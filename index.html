                </div>
            `;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ["ALL", "STOCK", "FUND", "REIT"].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                btn.className = f === filterType
                    ? "text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-teal-600 text-white shrink-0"
                    : "text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0";
            });
            renderWatchlist();
        }

        function renderWatchlist() {
            const container = document.getElementById("watchlistContainer");
            const macro = document.getElementById("macroSelect").value;
            const sortMode = document.getElementById("sortSelect").value;
            container.innerHTML = "";

            let filtered = watchlist.filter(item => {
                if (currentFilter === "ALL") return true;
                if (currentFilter === "FUND") return item.assetClass === "FUND" || item.assetClass === "LEVERAGE";
                return item.assetClass === currentFilter;
            });

            if (sortMode === "score_desc") {
                filtered = [...filtered].sort((a, b) => evaluateQuantMetrics(b, macro).totalScore - evaluateQuantMetrics(a, macro).totalScore);
            } else if (sortMode === "rsi_asc") {
                filtered = [...filtered].sort((a, b) => a.rsi - b.rsi);
            }

            document.getElementById("watchlistCounter").innerText = `${filtered.length} 銘柄`;

            filtered.forEach(item => {
                const quant = evaluateQuantMetrics(item, macro);
                const typeBadge = getAssetTypeBadge(item.assetClass);
                const isPos = String(item.change).startsWith("+");

                const card = document.createElement("div");
                card.className = "app-card rounded-3xl p-4 cursor-pointer hover:border-teal-400";
                card.onclick = () => openDetailModal(item.id);

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2.5">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg ${typeBadge.cls}">${typeBadge.label}</span>
                                <span class="text-[10px] font-bold text-slate-400">${item.code || ''}</span>
                                ${item.syncedAt ? `<span class="text-[9px] font-bold text-teal-700 bg-teal-50 px-1.5 py-0.5 rounded border border-teal-200">Y!同期済 ${item.syncedAt}</span>` : ''}
                            </div>
                            <h3 class="text-sm font-extrabold text-slate-800">${item.name}</h3>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-sm font-extrabold text-slate-900">${formatYen(item.price)}</div>
                            <div class="text-[11px] font-bold ${isPos ? 'text-emerald-600' : 'text-rose-500'}">${item.change}</div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 rounded-2xl px-3 py-2 border border-slate-100 mb-2.5">
                        <span class="text-xs font-extrabold px-2.5 py-1 rounded-xl border ${quant.badgeStyle}">${quant.badgeText}</span>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-400 block">AI総合スコア</span>
                            <span class="text-xs font-extrabold text-teal-700">${quant.totalScore}<span class="text-[10px] text-slate-400">/100点</span></span>
                        </div>
                    </div>

                    <p class="text-[11px] text-slate-600 font-medium mb-2">
                        👉 ${quant.actionHeadline}
                    </p>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold pt-1.5 border-t border-slate-100">
                        <span>温度計(RSI): <strong class="text-slate-700">${item.rsi}度</strong></span>
                        <span>25日平均(${formatYen(item.ma25)})比: <strong class="text-slate-700">${quant.maDiffPct > 0 ? '+' + quant.maDiffPct : quant.maDiffPct}%</strong></span>
                        <span class="text-teal-600 font-bold">理由 ＞</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openDetailModal(assetId) {
            const item = watchlist.find(w => w.id === assetId);
            if (!item) return;

            const macro = document.getElementById("macroSelect").value;
            const budget = parseFloat(document.getElementById("budgetInput").value) || 300000;
            const quant = evaluateQuantMetrics(item, macro);
            const xai = generateXaiExplanation(item, quant, budget);
            const typeBadge = getAssetTypeBadge(item.assetClass);

            document.getElementById("modalAssetBadge").className = `text-[10px] font-extrabold px-2 py-0.5 rounded-md ${typeBadge.cls}`;
            document.getElementById("modalAssetBadge").innerText = typeBadge.label;
            document.getElementById("modalCode").innerText = `${item.code || ''}`;
            document.getElementById("modalTitle").innerText = item.name;

            const yahooLink = document.getElementById("modalYahooLink");
            const codeForUrl = item.ticker || (/^([0-9]{4}|[0-9]{3}[A-Z])$/i.test(item.id) ? `${item.id}.T` : null);
            if (codeForUrl && !item.isProxyEtf) {
                yahooLink.href = `https://finance.yahoo.co.jp/quote/${codeForUrl}`;
                yahooLink.classList.remove("hidden");
            } else {
                yahooLink.href = `https://finance.yahoo.co.jp/search/?query=${encodeURIComponent(item.name)}`;
                yahooLink.classList.remove("hidden");
            }

            document.getElementById("deleteAssetBtn").onclick = () => {
                watchlist = watchlist.filter(w => w.id !== item.id);
                saveState();
                renderWatchlist();
                closeDetailModal();
            };

            const refreshBtn = document.getElementById("refreshSingleBtn");
            refreshBtn.innerText = "🔄 最新株価を再取得";
            refreshBtn.onclick = () => refreshSingleAsset(item.id);

            const body = document.getElementById("modalBody");
            body.innerHTML = `
                <!-- A. 結論サマリーカード -->
                <div class="bg-white rounded-3xl p-4 border-2 border-teal-500/30">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="text-[10px] font-bold text-slate-400 block mb-0.5">クオンツAIの最終結論</span>
                            <span class="inline-block text-sm font-extrabold px-3 py-1 rounded-xl border ${quant.badgeStyle}">
                                ${quant.badgeText}
                            </span>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-400 block">総合スコア / 信頼度</span>
                            <strong class="text-base font-extrabold text-teal-700">${quant.totalScore}点</strong>
                            <span class="text-[10px] font-bold text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded ml-1">信頼度${quant.cpcvConfidence}%</span>
                        </div>
                    </div>
                    <p class="text-xs font-bold text-slate-800 mt-2 mb-2">${quant.actionHeadline}</p>
                    <div class="bg-teal-50/70 border border-teal-100 rounded-2xl p-2.5 text-[11px] text-teal-900 font-medium leading-relaxed">
                        ${xai.analogy}
                    </div>
                </div>

                <!-- B. 価格位置メーター -->
                <div class="bg-white rounded-3xl p-4 border border-slate-200">
                    <div class="flex justify-between items-center mb-1.5">
                        <h4 class="text-xs font-extrabold text-slate-700">🌡️ いま高い？安い？（価格位置メーター）</h4>
                        <span class="text-[11px] font-bold text-slate-700">現在値: ${formatYen(item.price)} (${item.change})</span>
                    </div>
                    <div class="relative pt-2 pb-1">
                        <div class="h-3 w-full rounded-full gauge-track"></div>
                        <div class="absolute top-0 -ml-2.5 flex flex-col items-center" style="left: ${quant.gaugePosition}%;">
                            <div class="w-5 h-5 rounded-full bg-white border-4 border-slate-800 shadow-md"></div>
                        </div>
                    </div>
                    <div class="flex justify-between text-[10px] font-bold text-slate-500 mt-1">
                        <span class="text-emerald-700">🟢 割安圏 (-2σ)</span>
                        <span>⚖️ 25日平均 (${formatYen(item.ma25)})</span>
                        <span class="text-rose-600">🔴 過熱圏 (+2σ)</span>
                    </div>
                </div>

                <!-- C. なぜそう推論するのか？ -->
                <div class="bg-white rounded-3xl p-4 border border-slate-200 space-y-3">
                    <h4 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
                        <span>🧠</span> AIがそう判断した「明確な理由」
                    </h4>

                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-[11px] font-extrabold text-teal-800 mb-1">STEP 1：いま起きている事実（Y!ファイナンス連動データ）</div>
                        <p class="text-[11px] text-slate-700 leading-relaxed">${xai.factText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 underline decoration-teal-400 decoration-2">$1</strong>')}</p>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                        <div class="text-[11px] font-extrabold text-teal-800 mb-1">STEP 2：なぜその結論になるのか？（推論の根拠）</div>
                        <p class="text-[11px] text-slate-700 leading-relaxed">${xai.logicText.replace(/\*\*(.*?)\*\*/g, '<strong class="text-slate-900 underline decoration-amber-400 decoration-2">$1</strong>')}</p>
                    </div>

                    <div class="pt-1">
                        <div class="text-[10px] font-bold text-slate-500 mb-2">📊 基礎体力（5大クオンツファクター評価）</div>
                        <div class="space-y-1.5 text-[10px]">
                            ${renderFactorBar("割安度 (Value)", quant.factors.value)}
                            ${renderFactorBar("勢い (Momentum)", quant.factors.momentum)}
                            ${renderFactorBar("稼ぐ力・財務 (Quality)", quant.factors.quality)}
                            ${renderFactorBar("値動きの安定度 (Low-Vol)", quant.factors.stability)}
                            ${renderFactorBar("今の経済環境との相性", quant.factors.macroFit)}
                        </div>
                    </div>
                </div>

                <!-- D. いくらの指値で・いくら買うべきか？ -->
                <div class="bg-gradient-to-br from-teal-50 to-emerald-50/70 rounded-3xl p-4 border border-teal-200 space-y-3">
                    <h4 class="text-xs font-extrabold text-teal-900 flex items-center gap-1.5">
                        <span>🎯</span> あなたの具体的な売買目安・資金配分
                    </h4>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-white p-2.5 rounded-2xl border border-teal-100">
                            <span class="text-[10px] font-bold text-slate-400 block">① 第1弾：今の打診買い目安</span>
                            <strong class="text-sm font-extrabold text-teal-800">${formatYen(quant.entry1)}</strong>
                            <span class="text-[10px] font-bold text-teal-600 block mt-0.5">配分: ¥${xai.yen1.toLocaleString()} (${Math.round(xai.ratio1*100)}%)</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-2xl border border-teal-100">
                            <span class="text-[10px] font-bold text-slate-400 block">② 第2弾：本命押し目指値</span>
                            <strong class="text-sm font-extrabold text-sky-700">${formatYen(quant.entry2)}</strong>
                            <span class="text-[10px] font-bold text-sky-600 block mt-0.5">配分: ¥${xai.yen2.toLocaleString()} (${Math.round(xai.ratio2*100)}%)</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-2xl border border-teal-100">
                            <span class="text-[10px] font-bold text-slate-400 block">🎉 利益確定の目標目安</span>
                            <strong class="text-sm font-extrabold text-emerald-700">${formatYen(quant.takeProfit)}</strong>
                            <span class="text-[10px] text-slate-500 block mt-0.5">到達で半分利確を検討</span>
                        </div>
                        <div class="bg-white p-2.5 rounded-2xl border border-teal-100">
                            <span class="text-[10px] font-bold text-slate-400 block">🛡️ 損切り・撤退ライン</span>
                            <strong class="text-sm font-extrabold text-rose-600">${formatYen(quant.stopLoss)}</strong>
                            <span class="text-[10px] text-slate-500 block mt-0.5">予備資金: ¥${xai.yen3.toLocaleString()}温存</span>
                        </div>
                    </div>
                </div>

                <!-- E. 今後の3シナリオ予測 -->
                <div class="bg-white rounded-3xl p-4 border border-slate-200 space-y-2.5">
                    <h4 class="text-xs font-extrabold text-slate-800">🔮 今後の値動き・3つの予測シナリオ</h4>
                    ${xai.scenarios.map(s => `
                        <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[11px] font-extrabold text-slate-800">${s.name}</span>
                                <span class="text-[10px] font-bold bg-white px-2 py-0.5 rounded-full border border-slate-200 text-teal-700">確率 ${s.prob} / 目安 ${s.target}</span>
                            </div>
                            <p class="text-[11px] text-slate-600 leading-relaxed">${s.desc}</p>
                        </div>
                    `).join("")}
                </div>

                <!-- F. 夜間PTS株価や手動シミュレーション用ミニツール -->
                <div class="bg-slate-100 rounded-3xl p-3.5 border border-slate-200">
                    <div class="text-[11px] font-extrabold text-slate-700 mb-2">⚡ 夜間PTS価格や任意の数値でシミュレーションする</div>
                    <div class="grid grid-cols-3 gap-2 text-xs mb-2">
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 block">現在値/PTS(円)</label>
                            <input type="number" step="0.1" id="livePrice" value="${item.price}" class="w-full bg-white rounded-lg px-2 py-1 font-bold text-slate-800 border border-slate-300">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 block">25日平均(円)</label>
                            <input type="number" step="0.1" id="liveMa25" value="${item.ma25}" class="w-full bg-white rounded-lg px-2 py-1 font-bold text-slate-800 border border-slate-300">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-slate-500 block">RSI (0〜100)</label>
                            <input type="number" id="liveRsi" value="${item.rsi}" class="w-full bg-white rounded-lg px-2 py-1 font-bold text-slate-800 border border-slate-300">
                        </div>
                    </div>
                    <button type="button" onclick="updateAssetLive('${item.id}')" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold">
                        この数値で再計算する
                    </button>
                </div>
            `;

            document.getElementById("detailModal").classList.remove("hidden");
        }

        function renderFactorBar(label, val) {
            const color = val >= 80 ? "bg-teal-500" : val >= 60 ? "bg-sky-500" : "bg-amber-500";
            return `
                <div class="flex items-center gap-2">
                    <span class="w-36 text-slate-600 font-medium shrink-0">${label}</span>
                    <div class="flex-1 h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div class="${color} h-full rounded-full" style="width: ${val}%"></div>
                    </div>
                    <span class="w-8 text-right font-bold text-slate-700">${val}</span>
                </div>
            `;
        }

        function updateAssetLive(assetId) {
            const item = watchlist.find(w => w.id === assetId);
            if (!item) return;
            const newPrice = parseFloat(document.getElementById("livePrice").value) || item.price;
            const newMa25 = parseFloat(document.getElementById("liveMa25").value) || item.ma25;
            const newRsi = parseFloat(document.getElementById("liveRsi").value) || item.rsi;

            const diffRatio = (newPrice - newMa25) / (newMa25 * 0.04);
            item.price = newPrice;
            item.ma25 = newMa25;
            item.rsi = Math.max(5, Math.min(95, newRsi));
            item.bb = Number(Math.max(-3.0, Math.min(3.0, diffRatio)).toFixed(1));

            saveState();
            renderWatchlist();
            openDetailModal(assetId);
        }

        function closeDetailModal() {
            document.getElementById("detailModal").classList.add("hidden");
        }

        /* =========================================================================
         * 11. 図鑑モーダル・手動登録モーダル
         * ========================================================================= */
        function openCatalogModal() {
            document.getElementById("catalogSearchInput").value = "";
            currentCatalogCat = "ALL";
            setCatalogCat("ALL");
            document.getElementById("catalogModal").classList.remove("hidden");
        }

        function closeCatalogModal() {
            document.getElementById("catalogModal").classList.add("hidden");
        }

        function setCatalogCat(cat) {
            currentCatalogCat = cat;
            ["ALL", "半導体", "低位株", "電線", "銀行", "高配当", "投信"].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (!btn) return;
                btn.className = c === cat
                    ? "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-600 text-white shrink-0"
                    : "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0";
            });
            renderCatalogList();
        }

        function renderCatalogList() {
            const rawQ = document.getElementById("catalogSearchInput").value.trim();
            const q = normalizeText(rawQ);
            const container = document.getElementById("catalogListContainer");
            const macro = document.getElementById("macroSelect").value;
            container.innerHTML = "";

            const items = MASTER_MARKET_DB.filter(item => {
                const hay = normalizeText(`${item.name} ${item.id} ${item.code} ${item.keywords} ${item.sector}`);
                const catMatch = currentCatalogCat === "ALL" || hay.includes(normalizeText(currentCatalogCat));
                const queryMatch = !q || hay.includes(q);
                return catMatch && queryMatch;
            });

            items.forEach(item => {
                const quant = evaluateQuantMetrics(item, macro);
                const alreadyIn = watchlist.some(w => w.id === item.id);
                const row = document.createElement("div");
                row.className = "py-2.5 px-2 flex justify-between items-center gap-2 hover:bg-slate-50 rounded-xl cursor-pointer";
                row.onclick = () => selectAndFetchLive(item);
                row.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-extrabold text-slate-800 truncate">${item.name}</span>
                            <span class="text-[10px] font-bold text-slate-400 shrink-0">${item.code}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] font-bold text-teal-700">${quant.badgeText}</span>
                            <span class="text-[10px] text-slate-500">${formatYen(item.price)} (${item.change})</span>
                        </div>
                    </div>
                    <button type="button" class="text-[11px] font-extrabold px-3 py-1.5 rounded-xl shrink-0 ${alreadyIn ? 'bg-slate-100 text-slate-600' : 'bg-teal-600 text-white'}">
                        ${alreadyIn ? '診断へ' : '＋ 追加'}
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function openCustomModal() {
            document.getElementById("customModal").classList.remove("hidden");
        }

        function closeCustomModal() {
            document.getElementById("customModal").classList.add("hidden");
        }

        async function submitCustomAsset() {
            const name = document.getElementById("custName").value.trim();
            const codeInput = document.getElementById("custCode").value.trim().toUpperCase();
            const assetClass = document.getElementById("custType").value;
            let price = parseFloat(document.getElementById("custPrice").value);
            let rsi = parseFloat(document.getElementById("custRsi").value) || 50;

            if (!name && !codeInput) {
                alert("銘柄名または証券コードを入力してください。");
                return;
            }

            if (codeInput && /^([0-9]{4}|[0-9]{3}[A-Z])$/.test(codeInput)) {
                closeCustomModal();
                await selectOnlineCandidate(codeInput, name || `東証銘柄 (${codeInput})`);
                return;
            }

            if (isNaN(price) || price <= 0) price = 10000;
            const newItem = {
                id: "custom-" + Date.now(),
                code: "手動登録",
                name: name || codeInput,
                keywords: name,
                assetClass,
                sector: "カスタム登録銘柄",
                price,
                ma25: price,
                rsi,
                bb: 0.0,
                change: "0.00%",
                volatility: 20,
                factors: { value: 75, momentum: 70, quality: 75, stability: 75, macroFit: 75 },
                businessSummary: "手動登録された監視銘柄です。"
            };

            watchlist.unshift(newItem);
            saveState();
            renderWatchlist();
            closeCustomModal();
            openDetailModal(newItem.id);
        }

        function renderAll() {
            renderGlobalAllocation();
            renderWatchlist();
        }

        function setupSearchEvents() {
            const input = document.getElementById("quickSearchInput");
            if (!input) return;
            ["focus", "input", "keyup", "compositionend", "change", "search"].forEach(evtName => {
                input.addEventListener(evtName, () => {
                    renderSearchCandidates(true);
                });
            });
        }

        // アプリ起動＆初回Yahoo!ファイナンス自動同期
        loadState();
        setupSearchEvents();
        renderAll();
        setTimeout(() => {
            syncAllWatchlistPrices(false);
        }, 400);
    </script>
</body>
</html>
