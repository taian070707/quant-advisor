<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="投資ナビAI">
    <title>クオンツ投資ナビAI - Yahoo!ファイナンス自動連動版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #f4f8f6;
            --card-bg: #ffffff;
        }
        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom, 90px);
        }
        .app-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.05);
        }
        .gauge-track {
            background: linear-gradient(90deg, #10b981 0%, #38bdf8 30%, #facc15 65%, #f43f5e 100%);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .hidden { display: none !important; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            animation: spin-slow 0.9s linear infinite;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen px-3.5 pt-3 pb-28">

    <!-- 1. ヘッダー（Y!ファイナンス一括自動同期ボタン搭載） -->
    <header class="flex justify-between items-center mb-3">
        <div>
            <div class="flex items-center gap-1.5 mb-0.5">
                <span id="syncStatusDot" class="inline-block w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
                <span id="syncStatusText" class="text-[10px] font-bold text-teal-700">Y!ファイナンス自動連動・XAI推論稼働中</span>
            </div>
            <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">
                クオンツ投資ナビ <span class="text-[11px] font-bold bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full align-middle">PRO</span>
            </h1>
        </div>
        <div class="flex items-center gap-1.5">
            <button type="button" id="syncAllBtn" onclick="syncAllWatchlistPrices(true)" class="text-[11px] font-extrabold text-white bg-teal-600 hover:bg-teal-700 px-2.5 py-2 rounded-xl shadow-sm flex items-center gap-1">
                <span id="syncBtnIcon">🔄</span> 最新株価に更新
            </button>
            <button type="button" onclick="openCatalogModal()" class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200 px-2.5 py-2 rounded-xl">
                📋 図鑑
            </button>
        </div>
    </header>

    <!-- 2. Yahoo!ファイナンス連動・リアルタイム予測検索セクション -->
    <section class="mb-4" id="searchSection">
        <div class="app-card rounded-2xl p-3 bg-white border-2 border-teal-500/40">
            <div class="flex items-center gap-1.5">
                <span class="text-base pl-0.5">🔍</span>
                <input 
                    type="search" 
                    id="quickSearchInput" 
                    placeholder="社名の一部・かな・コード（例：北浜、きたはま、太陽誘電）" 
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    class="w-full text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-none bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2"
                >
                <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden text-slate-400 hover:text-slate-600 px-2 py-1.5 text-xs font-bold bg-slate-100 rounded-lg shrink-0">✕</button>
                <button type="button" onclick="triggerSearchNow()" class="bg-teal-600 text-white text-xs font-extrabold px-3 py-2 rounded-xl shrink-0">検索</button>
            </div>

            <!-- ワンタップ検索チップ -->
            <div class="flex items-center gap-1.5 mt-2.5 pt-2 border-t border-slate-100 overflow-x-auto custom-scroll pb-1">
                <span class="text-[10px] font-bold text-slate-400 shrink-0">注目・人気:</span>
                <button type="button" onclick="quickSelect('北浜キャピタル')" class="text-[10px] font-bold bg-amber-50 text-amber-800 px-2.5 py-1 rounded-lg border border-amber-200 shrink-0">📈 北浜キャピタル</button>
                <button type="button" onclick="quickSelect('キオクシア')" class="text-[10px] font-bold bg-teal-50 text-teal-800 px-2.5 py-1 rounded-lg border border-teal-200 shrink-0">🔥 キオクシア</button>
                <button type="button" onclick="quickSelect('りそな')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-lg border border-emerald-200 shrink-0">🏦 りそなHD</button>
                <button type="button" onclick="quickSelect('太陽誘電')" class="text-[10px] font-bold bg-sky-50 text-sky-800 px-2.5 py-1 rounded-lg border border-sky-200 shrink-0">💎 太陽誘電</button>
                <button type="button" onclick="quickSelect('4.3倍ブル')" class="text-[10px] font-bold bg-purple-50 text-purple-800 px-2.5 py-1 rounded-lg border border-purple-200 shrink-0">⚡ 楽天4.3倍ブル</button>
                <button type="button" onclick="quickSelect('半導体')" class="text-[10px] font-bold bg-indigo-50 text-indigo-800 px-2.5 py-1 rounded-lg border border-indigo-200 shrink-0">🔬 半導体</button>
            </div>

            <!-- 検索予測パネル（内蔵辞書＋Yahoo!ファイナンスライブ検索結果） -->
            <div id="searchResultPanel" class="hidden mt-3 pt-2.5 border-t-2 border-teal-100">
                <div class="flex justify-between items-center mb-2 px-1">
                    <span id="searchResultTitle" class="text-[11px] font-extrabold text-teal-800">検索予測候補</span>
                    <button type="button" onclick="clearSearch()" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md">▲ 閉じる</button>
                </div>
                <div id="searchResultList" class="max-h-72 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl bg-white custom-scroll">
                    <!-- JSで動的描画 -->
                </div>
                <div id="liveSearchStatus" class="hidden mt-1.5 px-2 py-1.5 bg-teal-50/70 rounded-lg text-[10px] font-bold text-teal-800 flex items-center justify-between">
                    <span id="liveSearchStatusText">🌐 Yahoo!ファイナンスから社名をライブ検索中...</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. あなたの投資予算 & 相場環境シミュレーター -->
    <section class="app-card rounded-3xl p-4 mb-4 bg-gradient-to-br from-white via-white to-teal-50/50">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xs font-extrabold text-slate-700 flex items-center gap-1.5">
                <span>👛</span> あなたの待機資金・3分割ナビ
            </h2>
            <span id="macroBadge" class="text-[10px] font-bold bg-teal-100 text-teal-800 px-2.5 py-0.5 rounded-full">金利上昇・業績相場</span>
        </div>
        <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">
            一度に全額買わず、<strong>「①打診買い → ②押し目買い → ③暴落予備」</strong>の3段階に分けることで高値掴みを防ぎます。
        </p>

        <div class="grid grid-cols-2 gap-2.5 mb-3">
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">投資に回せる予算 (円)</label>
                <input 
                    type="number" 
                    id="budgetInput" 
                    value="300000" 
                    step="10000" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-extrabold text-slate-800 focus:border-teal-500 focus:outline-none"
                    oninput="updateAllCalculations()"
                >
            </div>
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">現在のマクロ経済環境</label>
                <select 
                    id="macroSelect" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-slate-700 focus:border-teal-500 focus:outline-none"
                    onchange="updateAllCalculations()"
                >
                    <option value="rate_hike">🏦 日銀利上げ・国内追い風</option>
                    <option value="normal">☀️ 安定成長（通常モード）</option>
                    <option value="shock">⚡ 急落・リスクオフ警戒</option>
                    <option value="overheat">🔥 全面高・バブル過熱警戒</option>
                </select>
            </div>
        </div>

        <div id="globalAllocationCards" class="grid grid-cols-3 gap-2 text-center"></div>
    </section>

    <!-- 4. アセット種別フィルター ＆ 並び替えバー -->
    <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex gap-1 overflow-x-auto custom-scroll pb-1">
            <button type="button" onclick="setFilter('ALL')" id="filter-ALL" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-teal-600 text-white shrink-0">すべて</button>
            <button type="button" onclick="setFilter('STOCK')" id="filter-STOCK" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🏢 個別株</button>
            <button type="button" onclick="setFilter('FUND')" id="filter-FUND" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🌱 投信・ブル</button>
            <button type="button" onclick="setFilter('REIT')" id="filter-REIT" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🏙️ REIT</button>
        </div>
        <select id="sortSelect" onchange="renderWatchlist()" class="text-[11px] font-bold bg-white border border-slate-200 text-slate-700 rounded-xl px-2 py-1.5 shrink-0">
            <option value="default">登録順</option>
            <option value="score_desc">AIスコア順</option>
            <option value="rsi_asc">割安(RSI低)順</option>
        </select>
    </div>

    <!-- 5. 監視銘柄カードリスト -->
    <section>
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-[11px] font-bold text-slate-500">💡 銘柄をタップすると「判断の理由と売買指値」を解説</span>
            <span id="watchlistCounter" class="text-[11px] font-extrabold text-teal-700"></span>
        </div>
        <div id="watchlistContainer" class="space-y-3"></div>
        <div class="mt-6 flex justify-center gap-4">
            <button type="button" onclick="openCustomModal()" class="text-[11px] font-bold text-teal-700 underline">
                ＋ 任意の投資信託・銘柄を手動追加
            </button>
            <button type="button" onclick="resetToDefault()" class="text-[11px] font-semibold text-slate-400 hover:text-slate-600 underline">
                初期リストに戻す
            </button>
        </div>
    </section>

    <!-- ==========================================================
         モーダル1: 銘柄タップ時の「XAI徹底解説 & 具体的売買プラン」シート
    =========================================================== -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#f8faf9] w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl max-h-[92vh] flex flex-col overflow-hidden">
            
            <div class="bg-white px-5 py-3.5 border-b border-slate-200 flex justify-between items-center shrink-0">
                <div class="pr-2">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span id="modalAssetBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-md"></span>
                        <span id="modalCode" class="text-[11px] font-bold text-slate-400"></span>
                        <a id="modalYahooLink" href="#" target="_blank" rel="noopener" class="text-[10px] font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded border border-sky-200 hover:bg-sky-100">
                            🔗 Y!ファイナンスで見る ↗
                        </a>
                    </div>
                    <h3 id="modalTitle" class="text-base font-extrabold text-slate-800 mt-1"></h3>
                </div>
                <button type="button" onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center text-base shrink-0">✕</button>
            </div>

            <div id="modalBody" class="p-4 overflow-y-auto space-y-4 custom-scroll"></div>

            <div class="bg-white px-4 py-3 border-t border-slate-200 flex gap-2 shrink-0">
                <button type="button" id="deleteAssetBtn" class="px-3 py-2.5 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-xs font-bold hover:bg-rose-100">
                    🗑️ 削除
                </button>
                <button type="button" id="refreshSingleBtn" class="px-3 py-2.5 rounded-xl border border-teal-200 bg-teal-50 text-teal-800 text-xs font-extrabold hover:bg-teal-100">
                    🔄 最新株価を再取得
                </button>
                <button type="button" onclick="closeDetailModal()" class="flex-1 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-extrabold shadow-md">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         モーダル2: 📋 全銘柄図鑑＆カテゴリ検索モーダル
    =========================================================== -->
    <div id="catalogModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-5 py-3.5 border-b border-slate-200 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-sm font-extrabold text-slate-800">📋 銘柄・ファンド図鑑（Y!ファイナンス連動）</h3>
                    <p class="text-[10px] text-slate-500">選ぶと同時にYahoo!ファイナンスから最新株価を自動取得します</p>
                </div>
                <button type="button" onclick="closeCatalogModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center">✕</button>
            </div>

            <div class="p-3 bg-slate-50 border-b border-slate-200 shrink-0 space-y-2">
                <input 
                    type="search" 
                    id="catalogSearchInput" 
                    placeholder="図鑑内・東証全銘柄を検索（例：北浜、太陽誘電、銀行）" 
                    class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-teal-600"
                    oninput="renderCatalogList()"
                >
                <div class="flex gap-1.5 overflow-x-auto custom-scroll pb-1">
                    <button type="button" onclick="setCatalogCat('ALL')" id="cat-ALL" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-600 text-white shrink-0">すべて</button>
                    <button type="button" onclick="setCatalogCat('半導体')" id="cat-半導体" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">💎 半導体・電子部品</button>
                    <button type="button" onclick="setCatalogCat('低位株')" id="cat-低位株" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🚀 新興・低位・テーマ株</button>
                    <button type="button" onclick="setCatalogCat('電線')" id="cat-電線" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🔌 電線・重工・防衛</button>
                    <button type="button" onclick="setCatalogCat('銀行')" id="cat-銀行" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🏦 銀行・金融</button>
                    <button type="button" onclick="setCatalogCat('高配当')" id="cat-高配当" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">💰 商社・高配当</button>
                    <button type="button" onclick="setCatalogCat('投信')" id="cat-投信" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🌱 投信・ブル</button>
                </div>
            </div>

            <div id="catalogListContainer" class="p-3 overflow-y-auto divide-y divide-slate-100 space-y-1 custom-scroll flex-1"></div>

            <div class="p-3 bg-white border-t border-slate-200 shrink-0">
                <button type="button" onclick="closeCatalogModal()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         モーダル3: 非上場投信などのカスタム手動登録モーダル
    =========================================================== -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 border border-slate-200 shadow-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-extrabold text-slate-800">📝 銘柄・ファンドの手動登録</h3>
                <button type="button" onclick="closeCustomModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
            </div>
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">銘柄名・ファンド名</label>
                    <input type="text" id="custName" placeholder="例：北浜キャピタルパートナーズ" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">証券コード(4桁・任意)</label>
                        <input type="text" id="custCode" placeholder="例: 2134" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">現在値 / 基準価額 (円)</label>
                        <input type="number" id="custPrice" placeholder="未入力なら自動取得" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">種類</label>
                        <select id="custType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold text-slate-700">
                            <option value="STOCK">🏢 個別株式</option>
                            <option value="FUND">🌱 投資信託</option>
                            <option value="LEVERAGE">⚡ レバレッジ投信</option>
                            <option value="REIT">🏙️ J-REIT</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">RSI (未入力なら自動)</label>
                        <input type="number" id="custRsi" value="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold text-slate-800">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeCustomModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">キャンセル</button>
                <button type="button" onclick="submitCustomAsset()" class="flex-1 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-extrabold shadow-md">追加して診断</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
         * 1. 内蔵マスター辞書（北浜キャピタルパートナーズ・太陽誘電・主要100社超＋かな辞書）
         * ========================================================================= */
        const MASTER_MARKET_DB = [
            // --- 注目・新興・低位・テーマ株（北浜キャピタルパートナーズ等） ---
            {
                id: "2134", ticker: "2134.T", code: "2134 東証STD", name: "北浜キャピタルパートナーズ",
                keywords: "きたはま きたはまきゃぴたる 北浜 北浜キャピタル 北浜キャピタルパートナーズ 2134 低位株 不動産 投資 太陽光",
                assetClass: "STOCK", sector: "金融・投資・不動産 (低位株)", price: 17, ma25: 13.5, rsi: 68, bb: 1.8, change: "+41.67%",

                    // パターン1: 「北浜キャピタルパートナーズ(株)【2134.T】」またはリンク構造から抽出
                    const regexLink = /href="https:\/\/finance\.yahoo\.co\.jp\/quote\/([0-9]{4}|[0-9]{3}[A-Z])\.T"[^>]*>([\s\S]*?)<\/a>/gi;
                    let match;
                    const seenCodes = new Set();
                    while ((match = regexLink.exec(html)) !== null) {
                        const code = match[1].toUpperCase();
                        let rawTitle = match[2].replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
                        rawTitle = rawTitle.replace(/\(株\)|株式会社|【.*?】/g, "").trim();
                        if (code && rawTitle && rawTitle.length >= 2 && !/チャート|掲示板|ニュース|詳細|時系列/.test(rawTitle) && !seenCodes.has(code)) {
                            seenCodes.add(code);
                            results.push({
                                id: code,
                                ticker: `${code}.T`,
                                code: `${code} 東証`,
                                name: rawTitle
                            });
                        }
                        if (results.length >= 6) break;
                    }

                    // パターン2: 検索結果が直接1銘柄の個別ページにリダイレクトまたはヒットした場合
                    if (results.length === 0) {
                        const titleMatch = html.match(/<title>\s*([^<]+?)\【([0-9]{4}|[0-9]{3}[A-Z])\.T\】/i);
                        if (titleMatch) {
                            const name = titleMatch[1].replace(/\(株\)|株式会社/g, "").trim();
                            const code = titleMatch[2].toUpperCase();
                            results.push({ id: code, ticker: `${code}.T`, code: `${code} 東証`, name });
                        }
                    }
                }
            } catch (e) {
                console.warn("Live search fallback:", e);
            }

            if (results.length > 0) {
                liveSearchCache[cleanQ] = results;
            }
            return results;
        }

        /* =========================================================================
         * 4. Yahoo!ファイナンス リアル株価・移動平均・RSI・ボリンジャー自動取得エンジン
         * ========================================================================= */
        async function fetchYahooLiveQuoteAndTech(tickerOrCode) {
            if (!tickerOrCode) return null;
            const cleanCode = String(tickerOrCode).replace(/\.T$/i, "").trim().toUpperCase();
            if (!/^([0-9]{4}|[0-9]{3}[A-Z])$/.test(cleanCode)) return null;

            const symbol = `${cleanCode}.T`;

            // Step A: Yahoo Finance v8 Chart API から直近3ヶ月の日足データを取得し、現在値・25日線・RSI・BBを厳密計算
            try {
                const chartUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=3mo`;
                const rawJson = await fetchViaCorsProxy(chartUrl, 4000);
                if (rawJson) {
                    const parsed = JSON.parse(rawJson);
                    const result = parsed?.chart?.result?.[0];
                    if (result) {
                        const meta = result.meta || {};
                        const quotes = result.indicators?.quote?.[0] || {};
                        const rawCloses = (quotes.close || []).filter(v => typeof v === "number" && !isNaN(v));

                        if (rawCloses.length > 0) {
                            const currentPrice = meta.regularMarketPrice || rawCloses[rawCloses.length - 1];
                            const prevClose = meta.chartPreviousClose || meta.previousClose || (rawCloses.length >= 2 ? rawCloses[rawCloses.length - 2] : currentPrice);
                            const diff = currentPrice - prevClose;
                            const diffPct = prevClose > 0 ? (diff / prevClose) * 100 : 0;
                            const changeStr = (diffPct >= 0 ? "+" : "") + diffPct.toFixed(2) + "%";

                            // 25日移動平均線とボリンジャーバンド(σ)の算出
                            const slice25 = rawCloses.slice(-25);
                            const ma25 = slice25.reduce((a, b) => a + b, 0) / slice25.length;
                            const variance = slice25.reduce((a, b) => a + Math.pow(b - ma25, 2), 0) / slice25.length;
                            const stdDev = Math.sqrt(variance) || (ma25 * 0.02) || 1;
                            const bb = Number(Math.max(-3.0, Math.min(3.0, (currentPrice - ma25) / stdDev)).toFixed(1));

                            // 14日RSIの算出
                            let rsi = 50;
                            if (rawCloses.length >= 15) {
                                let gains = 0, losses = 0;
                                for (let i = rawCloses.length - 14; i < rawCloses.length; i++) {
                                    const d = rawCloses[i] - rawCloses[i - 1];
                                    if (d >= 0) gains += d;
                                    else losses -= d;
                                }
                                if (losses === 0) rsi = 85;
                                else {
                                    const rs = (gains / 14) / (losses / 14);
                                    rsi = Math.round(100 - (100 / (1 + rs)));
                                }
                            }

                            return {
                                price: currentPrice < 100 ? Number(currentPrice.toFixed(1)) : Math.round(currentPrice),
                                ma25: ma25 < 100 ? Number(ma25.toFixed(1)) : Math.round(ma25),
                                rsi: Math.max(5, Math.min(95, rsi)),
                                bb,
                                change: changeStr,
                                syncedAt: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
                            };
                        }
                    }
                }
            } catch (e) {
                console.warn("Chart v8 fetch error:", e);
            }

            // Step B: 万一Chart APIがブロックされた場合は finance.yahoo.co.jp/quote/{code}.T から直接スクレイピング
            try {
                const jpUrl = `https://finance.yahoo.co.jp/quote/${symbol}`;
                const html = await fetchViaCorsProxy(jpUrl, 4000);
                if (html) {
                    const stateMatch = html.match(/window\.__PRELOADED_STATE__\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
                    if (stateMatch) {
                        const state = JSON.parse(stateMatch[1]);
                        const priceStr = state?.mainStocksPriceBoard?.priceBoard?.price;
                        const rateStr = state?.mainStocksPriceBoard?.priceBoard?.priceChangeRate;
                        if (priceStr) {
                            const numPrice = parseFloat(String(priceStr).replace(/,/g, ""));
                            if (!isNaN(numPrice) && numPrice > 0) {
                                const rateNum = parseFloat(String(rateStr || "0").replace(/,/g, "")) || 0;
                                return {
                                    price: numPrice,
                                    ma25: numPrice < 100 ? Number((numPrice / (1 + rateNum / 200)).toFixed(1)) : Math.round(numPrice / (1 + rateNum / 200)),
                                    rsi: Math.max(15, Math.min(85, Math.round(50 + rateNum * 1.1))),
                                    bb: Number(Math.max(-2.5, Math.min(2.5, rateNum / 8)).toFixed(1)),
                                    change: (rateNum >= 0 ? "+" : "") + rateNum.toFixed(2) + "%",
                                    syncedAt: new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })
                                };
                            }
                        }
                    }
                }
            } catch (e) {
                console.warn("JP quote fallback error:", e);
            }

            return null;
        }

         * 5. 監視リスト全体のYahoo!ファイナンス自動同期 & 旧ダミーデータの自動修復

        /* =========================================================================
         * 6. ユーティリティ & ローカルストレージ管理（旧ダミーデータの自動クリーンアップ付き）
         * ========================================================================= */
        function cloneObj(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function normalizeText(str) {
            if (!str) return "";
            return String(str)
                .toLowerCase()
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60))
                .replace(/\(株\)|株式会社|ホールディングス|グループ/g, "")
                .replace(/\s+/g, "");
        }

        const STORAGE_KEY = "quant_advisor_pro_v8";
        let currentFilter = "ALL";
        let currentCatalogCat = "ALL";
        let watchlist = [];

        function loadState() {
            try {
                // v8 または 旧v7/v6 のデータを読み込み、旧ダミーデータ(+0.65%)があれば本物のマスターデータへ自動修復する
                const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("quant_advisor_pro_v7");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed.watchlist) && parsed.watchlist.length > 0) {
                        const repairedList = [];
                        const seenIds = new Set();

                        for (const rawItem of parsed.watchlist) {
                            if (!rawItem || !rawItem.name) continue;
                            // 「投信」のような意味のない単一ワードのゴミデータは除外
                            if (rawItem.name === "投信" && String(rawItem.id).startsWith("auto-")) continue;

                            // もし旧バージョンの auto- ダミーデータ（北浜キャピタル、太陽誘電、ソニー等）ならマスターの正規データに置き換える
                            let itemToKeep = rawItem;
                            if (String(rawItem.id).startsWith("auto-") || rawItem.change === "+0.65%") {
                                const normName = normalizeText(rawItem.name);
                                const matchedMaster = MASTER_MARKET_DB.find(m =>
                                    normalizeText(m.name).includes(normName) ||
                                    normName.includes(normalizeText(m.name)) ||
                                    normalizeText(m.keywords).includes(normName)
                                );
                                if (matchedMaster) {
                                    itemToKeep = cloneObj(matchedMaster);
                                }
                            }

                            if (!seenIds.has(itemToKeep.id)) {
                                seenIds.add(itemToKeep.id);
                                repairedList.push(itemToKeep);
                            }
                        }

                        if (repairedList.length > 0) {
                            watchlist = repairedList;
                            if (parsed.budget) document.getElementById("budgetInput").value = parsed.budget;
                            if (parsed.macro) document.getElementById("macroSelect").value = parsed.macro;
                            saveState();
                            return;
                        }
                    }
                }
            } catch (e) { console.warn(e); }

            // デフォルト初期監視リスト（北浜キャピタルパートナーズ・キオクシア・りそな・太陽誘電・ソニー・楽天4.3倍ブル・オルカン）
            const defaultIds = ["2134", "285A", "8308", "6976", "6758", "rakuten-43bull", "emaxis-allcountry"];
            watchlist = defaultIds.map(id => {
                const found = MASTER_MARKET_DB.find(m => m.id === id);
                return found ? cloneObj(found) : null;
            }).filter(Boolean);
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    watchlist,
                    budget: document.getElementById("budgetInput").value,
                    macro: document.getElementById("macroSelect").value
                }));
            } catch (e) { console.warn(e); }
        }

        function resetToDefault() {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem("quant_advisor_pro_v7");
            loadState();
            renderAll();
            syncAllWatchlistPrices(true);
        }

        /* =========================================================================
         * 7. クオンツ評価エンジン (低位株の小数点・1円単位の指値計算にも完全対応)
         * ========================================================================= */
        function formatYen(val) {
            const num = Number(val);
            if (isNaN(num)) return "¥0";
            if (num < 100 && num % 1 !== 0) return "¥" + num.toFixed(1);
            return "¥" + Math.round(num).toLocaleString();
        }

        function roundPriceSmart(val, refPrice) {
            if (refPrice < 50) return Number(val.toFixed(1));
            return Math.round(val);
        }

        function evaluateQuantMetrics(asset, macroRegime) {
            const price = Number(asset.price) || 100;
            const ma25 = Number(asset.ma25) || price;
            const rsi = Number(asset.rsi) || 50;
            const bb = Number(asset.bb) || 0;
            const maDiffPct = ((price - ma25) / ma25) * 100;
            const f = asset.factors || { value: 70, momentum: 70, quality: 70, stability: 70, macroFit: 70 };

            let technicalEntryScore = 50;
            if (rsi <= 30) technicalEntryScore += 32;
            else if (rsi <= 42) technicalEntryScore += 18;
            else if (rsi >= 72) technicalEntryScore -= 30;
            else if (rsi >= 65) technicalEntryScore -= 12;

            if (bb <= -1.5) technicalEntryScore += 18;
            else if (bb <= -0.8) technicalEntryScore += 10;
            else if (bb >= 1.8) technicalEntryScore -= 20;

            let fundamentalScore = Math.round(
                f.value * 0.22 + f.momentum * 0.18 + f.quality * 0.25 + f.stability * 0.15 + f.macroFit * 0.20
            );

            if (macroRegime === "rate_hike") {
                if (asset.sector && asset.sector.includes("銀行")) fundamentalScore += 7;
                if (asset.assetClass === "REIT") fundamentalScore -= 4;
            } else if (macroRegime === "shock") {
                if (asset.assetClass === "LEVERAGE") technicalEntryScore -= 15;
                if (asset.assetClass === "FUND") technicalEntryScore += 8;
            } else if (macroRegime === "overheat") {
                technicalEntryScore -= 10;
            }

            let decayRiskPct = 0;
            if (asset.assetClass === "LEVERAGE") {
                const L = asset.leverage || 4.3;
                const sigma = (asset.volatility || 65) / 100;
                decayRiskPct = Math.round(0.5 * L * (L - 1) * (sigma * sigma) * 100 * 0.15);
            }

            const totalScore = Math.max(15, Math.min(98, Math.round(fundamentalScore * 0.55 + technicalEntryScore * 0.45)));
            const pboPct = (asset.assetClass === "LEVERAGE" || price < 100) ? 16.8 : Math.max(3.2, (100 - f.quality) * 0.25 + 2.5);
            const cpcvConfidence = Math.round(100 - pboPct);

            let signalCode = "STAY";
            let badgeText = "🟡 ステイ（保有・押し目待ち）";
            let badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
            let actionHeadline = "焦って高値飛びつきせず、押し目（調整）を待つのが有利";

            if (asset.assetClass === "LEVERAGE") {
                if (rsi <= 43 && bb <= -1.0) {
                    signalCode = "SWING_BUY";
                    badgeText = "⚡ 短期リバウンド狙い（少額のみ）";
                    badgeStyle = "bg-sky-50 text-sky-800 border-sky-300";
                    actionHeadline = "急落後の反発狙い好機。ただし数日〜数週間の短期決戦に限定！";
                } else if (rsi >= 65 || bb >= 1.3) {
                    signalCode = "SELL";
                    badgeText = "🟠 即利益確定・売却推奨";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "ブル型投信の利益が乗っているうちに素早く利益確定を！";
                } else {
                    signalCode = "CAUTION";
                    badgeText = "⚠️ 様子見（長期放置はNG）";
                    badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
                    actionHeadline = "方向感が曖昧な時期は『減価』で削られるため手出し無用";
                }
            } else if (asset.assetClass === "FUND") {
                if (rsi <= 42 || bb <= -1.0) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 積立＋スポット買い増し好機";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    actionHeadline = "定額積立に加えて、待機資金でのスポット購入が有効な割安局面";
                } else {
                    signalCode = "HOLD_DCA";
                    badgeText = "🌱 積立継続（売却不要）";
                    badgeStyle = "bg-teal-50 text-teal-800 border-teal-300";
                    actionHeadline = "毎月の定額積立を淡々と継続。今あえて一括購入する必要はなし";
                }
            } else if (price < 100) {
                // 北浜キャピタルパートナーズ(2134)などの超低位株専用クオンツ判定
                if (rsi >= 65 || bb >= 1.4 || maDiffPct >= 15) {
                    signalCode = "SELL";
                    badgeText = "🟠 急騰過熱・短期利確推奨（飛びつき注意）";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "急騰による短期過熱圏。保有分は 분할利益確定、新規は25日線付近への押し目待ち！";
                } else if (rsi <= 40 || bb <= -1.0) {
                    signalCode = "SWING_BUY";
                    badgeText = "⚡ 低位株・短期打診買い好機";
                    badgeStyle = "bg-sky-50 text-sky-800 border-sky-300";
                    actionHeadline = "売られすぎ水準。少額の余裕資金で吹き値（急反発）待ちの打診買いが有効";
                } else {
                    signalCode = "CAUTION";
                    badgeText = "🟡 少額監視（逆指値徹底）";
                    badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
                    actionHeadline = "1円の値動きが大きいため、引きつけた指値での少額エントリーに限定";
                }
            } else {
                if (rsi <= 38 || bb <= -1.3) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 強い買い（絶好の押し目）";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    actionHeadline = "統計的な『売られすぎバーゲン圏』。第1弾・第2弾の買い出動を推奨";
                } else if (totalScore >= 74 && rsi <= 63 && bb <= 1.2) {
                    signalCode = "BUY";
                    badgeText = "🟢 分割買い推奨（順張り・押し目）";
                    badgeStyle = "bg-emerald-50 text-emerald-800 border-emerald-300";
                    actionHeadline = "業績・テーマ性と株価水準が両立。まず予算の3〜4割で打診買い";
                } else if (rsi >= 67 || bb >= 1.5) {
                    signalCode = "SELL";
                    badgeText = "🟠 利益確定・新規買い見送り";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "短期的な買われすぎ過熱圏。保有株は一部利確、新規は押し目待ち";
                }
            }

            const volFactor = (asset.assetClass === "LEVERAGE" || price < 100) ? 0.12 : 0.035;
            const entry1 = roundPriceSmart(price, price);
            const entry2 = roundPriceSmart(Math.min(price * (1 - volFactor), ma25 * (1 - volFactor * 0.5)), price);
            const takeProfit = roundPriceSmart(Math.max(price * (1 + volFactor * 2.0), ma25 * (1 + volFactor * 2.2)), price);
            const stopLoss = roundPriceSmart(entry2 * (1 - volFactor * 1.2), price);
            const gaugePosition = Math.max(5, Math.min(95, Math.round(50 + (bb / 3.0) * 42)));

            return {
                maDiffPct: maDiffPct.toFixed(1),
                totalScore,
                cpcvConfidence,
                decayRiskPct,
                signalCode,
                badgeText,
                badgeStyle,
                actionHeadline,
                entry1,
                entry2,
                takeProfit,
                stopLoss,
                gaugePosition,
                factors: f
            };
        }

        /* =========================================================================
         * 8. 初心者向けXAI解説ジェネレーター
         * ========================================================================= */
        function generateXaiExplanation(asset, quant, budget) {
            const maWord = parseFloat(quant.maDiffPct) >= 0 
                ? `過去25日間の平均価格（${formatYen(asset.ma25)}）より **+${quant.maDiffPct}% 上**` 
                : `過去25日間の平均価格（${formatYen(asset.ma25)}）より **${quant.maDiffPct}% 安い水準**`;

            let analogy = "";
            if (quant.signalCode === "STRONG_BUY") {
                analogy = "🛍️ 例えるなら：『品質が確かな人気ブランドの定番品が、一時的な季節セールで本来の価値より大幅に値下がりしている状態』です。";
            } else if (quant.signalCode === "BUY") {
                analogy = "🚃 例えるなら：『目的地に向かって順調に走り始めた特急列車に、混雑しすぎる前のちょうど良いタイミングで乗車できる状態』です。";
            } else if (quant.signalCode === "SWING_BUY") {
                analogy = "🏹 例えるなら：『強く引き絞られたゴムが跳ね返ろうとしている状態』です。勢いよく反発しやすいですが、深追いは禁物です。";
            } else if (quant.signalCode === "SELL") {
                analogy = "🌡️ 例えるなら：『人気店に行列ができすぎてプレミアム価格がついている状態』です。今すぐ飛びつくと高値掴みになりやすく、すでに持っている人は利益確定に適しています。";
            } else if (quant.signalCode === "HOLD_DCA") {
                analogy = "🌱 例えるなら：『日当たりの良い畑で果樹が順調に育っている状態』です。抜いたり植え替えたりせず、毎月決まった水やり（積立）を続けるのが一番の近道です。";
            } else {
                analogy = "☕ 例えるなら：『お買い得なセール価格でもなければ、高すぎるわけでもない定価の状態』です。無理に今すぐ全額を出さず、次の割引チャンスを待つ余裕が大切です。";
            }

            const factText = `Yahoo!ファイナンス連動による現在価格は **${formatYen(asset.price)}**（前日比 **${asset.change}**）で、${maWord}に位置しています。また、市場の買われすぎ・売られすぎを0〜100度で測る温度計 **「RSI」は ${asset.rsi}度**（30以下で売られすぎ、70以上で買われすぎ）、価格の振れ幅を示す **「ボリンジャーバンド」は ${asset.bb > 0 ? '+' + asset.bb : asset.bb}σ** となっています。`;

            let logicText = "";
            if (asset.price < 100 && asset.assetClass === "STOCK") {
                logicText = `${asset.businessSummary} 現在値は **${formatYen(asset.price)}** と25日移動平均（**${formatYen(asset.ma25)}**）に対して **${quant.maDiffPct}%** 乖離しています。低位株は短期資金の流入で急騰しやすい反面、出来高が細ると急落しやすいため、高値での一括買いは避け、**${formatYen(quant.entry2)}付近への押し目** を待つか、損切りライン（**${formatYen(quant.stopLoss)}**）を厳守した少額トレードに徹するのが統計的に正解です。`;
            } else if (asset.assetClass === "LEVERAGE") {
                logicText = `${asset.businessSummary} 現在はボリンジャーバンドが **${asset.bb}σ** にあるため、短期的な反発期待は高いと推論します。ただし、横ばい相場が続くと年間約 **${quant.decayRiskPct}%相当の減価リスク** が発生するため、長期の放置は厳禁という結論になります。`;
            } else if (asset.assetClass === "REIT") {
                logicText = `${asset.businessSummary} 不動産の解散価値を示す **NAV倍率は ${asset.navRatio || 0.86}倍（1倍未満は割安）**、借入金の健全性を示す **LTVは ${asset.ltv || 42}%** と安全圏です。分配金利回り **${asset.dividend || 4.2}%** を得ながら下値不安が小さいと推論します。`;
            } else if (asset.assetClass === "FUND") {
                logicText = `${asset.businessSummary} リスクに対するリターンの効率を示す **シャープレシオは ${asset.sharpe || 1.4}** と優秀です。短期的なRSI（${asset.rsi}）の上下を気にして売買を繰り返すよりも、長期の複利効果を活かすことが統計的に最も勝率が高くなります。`;
            } else {
                const valComment = asset.pbr && asset.pbr <= 1.2 ? `PBR（純資産倍率）が **${asset.pbr}倍** と資産価値に近く下値が堅い点` : `事業成長性・クオリティ評価（**${quant.factors.quality}点**）が高く実需の裏付けが強い点`;
                const techComment = asset.rsi <= 40 
                    ? `RSIが **${asset.rsi}** まで冷え込み、悪材料を織り込んで売り手が減っている点` 
                    : asset.rsi >= 66 
                        ? `RSIが **${asset.rsi}** まで上昇し、短期的な利益確定売りが出やすい水準にある点`
                        : `RSIが **${asset.rsi}** と過熱感のない健全な巡航速度（45〜62）に収まっている点`;
                logicText = `${asset.businessSummary} クオンツ5大ファクター分析では、${valComment}に加え、${techComment}が重なっています。過去データの過学習（まぐれ当たり）を除外したCPCV信頼度も **${quant.cpcvConfidence}%** と高く、統計的に根拠のある局面と推論します。`;
            }

            let ratio1 = 0.35, ratio2 = 0.40, ratio3 = 0.25;
            if (quant.signalCode === "STRONG_BUY") { ratio1 = 0.50; ratio2 = 0.35; ratio3 = 0.15; }
            else if (quant.signalCode === "SWING_BUY") { ratio1 = 0.20; ratio2 = 0.20; ratio3 = 0.60; }
            else if (quant.signalCode === "SELL" || quant.signalCode === "CAUTION") { ratio1 = 0.0; ratio2 = 0.25; ratio3 = 0.75; }

            const yen1 = Math.round(budget * ratio1);
            const yen2 = Math.round(budget * ratio2);
            const yen3 = Math.round(budget * ratio3);

            const scenarios = [
                {
                    name: "📈 強気（好転）シナリオ",
                    prob: quant.signalCode.includes("BUY") ? "55%" : "35%",
                    target: `${formatYen(quant.takeProfit)} 付近`,
                    desc: "25日移動平均線を明確に上抜け（または維持）し、買い戻しで上値目標へ到達する展開。"
                },
                {
                    name: "⚖️ 基本（メイン）シナリオ",
                    prob: "30%",
                    target: `${formatYen(asset.ma25)} 〜 ${formatYen(roundPriceSmart(asset.price * 1.04, asset.price))}`,
                    desc: "現在の価格帯で推移しながら、次の決算や材料を待つ展開。"
                },
                {
                    name: "☔ 警戒（下振れ）シナリオ",
                    prob: quant.signalCode.includes("BUY") ? "15%" : "35%",
                    target: `${formatYen(quant.entry2)} （撤退目安: ${formatYen(quant.stopLoss)}）`,
                    desc: "利益確定売りに押される展開。第2弾の待機資金を残しておけば安く拾える好機に変わります。"
                }
            ];

            return { analogy, factText, logicText, yen1, yen2, yen3, ratio1, ratio2, ratio3, scenarios };
        }

        /* =========================================================================
         * 9. ハイブリッド検索予測UI（内蔵辞書即時一致 ＋ Y!ファイナンスライブ社名検索）
         * ========================================================================= */
        function renderSearchCandidates(showDefaultWhenEmpty = false) {
            const input = document.getElementById("quickSearchInput");
            const clearBtn = document.getElementById("clearSearchBtn");
            const panel = document.getElementById("searchResultPanel");
            const listEl = document.getElementById("searchResultList");
            const titleEl = document.getElementById("searchResultTitle");
            const liveStatus = document.getElementById("liveSearchStatus");

            const rawQuery = input.value.trim();
            const q = normalizeText(rawQuery);

            if (rawQuery.length > 0) {
                clearBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
                liveStatus.classList.add("hidden");
                if (!showDefaultWhenEmpty) {
                    panel.classList.add("hidden");
                    return;
                }
            }

            let localMatches = [];
            if (!q) {
                titleEl.innerText = "🔥 注目・主要銘柄（タップで最新株価を取得＆診断）";
                localMatches = MASTER_MARKET_DB.slice(0, 12);
            } else {
                localMatches = MASTER_MARKET_DB.filter(item => {
                    const hay = normalizeText(`${item.name} ${item.id} ${item.code} ${item.keywords} ${item.sector}`);
                    return hay.includes(q);
                });
                titleEl.innerText = `「${rawQuery}」の検索予測候補`;
            }

            listEl.innerHTML = "";
            const macro = document.getElementById("macroSelect").value;

            localMatches.forEach(item => {
                const quant = evaluateQuantMetrics(item, macro);
                const alreadyIn = watchlist.some(w => w.id === item.id);

                const row = document.createElement("div");
                row.className = "p-3 bg-white hover:bg-teal-50 flex justify-between items-center gap-2 cursor-pointer";
                row.onclick = () => selectAndFetchLive(item);
                row.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-extrabold text-slate-800 truncate">${item.name}</span>
                            <span class="text-[10px] font-bold text-slate-400 shrink-0">${item.code}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] font-bold text-teal-700">${quant.badgeText}</span>
                            <span class="text-[10px] text-slate-500">${formatYen(item.price)} (${item.change})</span>
                        </div>
                    </div>
                    <button type="button" class="text-[11px] font-extrabold px-3 py-1.5 rounded-xl shrink-0 ${alreadyIn ? 'bg-slate-200 text-slate-700' : 'bg-teal-600 text-white shadow-sm'}">
                        ${alreadyIn ? '最新診断へ' : '＋ 選択'}
                    </button>
                `;
                listEl.appendChild(row);
            });

            panel.classList.remove("hidden");

            // 2文字以上入力されている場合、Yahoo!ファイナンス日本版から東証全銘柄の社名予測を非同期で追加表示
            if (rawQuery.length >= 2) {
                clearTimeout(liveSearchTimer);
                liveStatus.classList.remove("hidden");
                document.getElementById("liveSearchStatusText").innerText = `🌐 Yahoo!ファイナンスから「${rawQuery}」の社名候補を検索中...`;

                liveSearchTimer = setTimeout(async () => {
                    const onlineHits = await searchYahooJapanByKeyword(rawQuery);
                    const currentVal = document.getElementById("quickSearchInput").value.trim();
                    if (currentVal !== rawQuery) return;

                    let addedOnline = 0;
                    onlineHits.forEach(hit => {
                        if (localMatches.some(m => m.id === hit.id)) return;
                        addedOnline++;
                        const row = document.createElement("div");
                        row.className = "p-3 bg-sky-50/40 hover:bg-sky-50 flex justify-between items-center gap-2 cursor-pointer";
                        row.onclick = () => selectOnlineCandidate(hit.id, hit.name);
                        row.innerHTML = `
                            <div class="min-w-0 flex-1">
                                <div class="flex items-center gap-1.5">
                                    <span class="text-[9px] font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded">Y!検索予測</span>
                                    <span class="text-xs font-extrabold text-slate-800 truncate">${hit.name}</span>
                                    <span class="text-[10px] font-bold text-slate-500 shrink-0">(${hit.id})</span>
                                </div>
                                <div class="text-[10px] text-slate-500 mt-0.5">
                                    タップするとYahoo!ファイナンスから現在株価・RSIを自動取得して追加します
                                </div>
                            </div>
                            <button type="button" class="text-[11px] font-extrabold px-3 py-1.5 rounded-xl shrink-0 bg-sky-600 text-white shadow-sm">
                                ＋ 取得＆診断
                            </button>
                        `;
                        listEl.appendChild(row);
                    });

                    if (addedOnline > 0 || localMatches.length > 0) {
                        document.getElementById("liveSearchStatusText").innerText = `✅ 候補をタップするとYahoo!ファイナンスの最新株価を取得して診断します`;
                    } else {
                        document.getElementById("liveSearchStatusText").innerText = `💡 4桁の証券コード（例: 2134）を入力すると直接データ取得できます`;
                    }
                }, 320);
            } else {
                liveStatus.classList.add("hidden");
            }
        }

        // 内蔵辞書の銘柄を選択した際も、即座にYahoo!ファイナンスから最新株価を取得して診断を開く
        async function selectAndFetchLive(masterItem) {
            let target = watchlist.find(w => w.id === masterItem.id);
            if (!target) {
                target = cloneObj(masterItem);
                watchlist.unshift(target);
            }
            clearSearch();
            closeCatalogModal();
            saveState();
            renderWatchlist();
            openDetailModal(target.id);

            // 裏側でYahoo!ファイナンスの最新株価を取得し、画面をリアルタイム更新
            if (target.ticker && !target.isProxyEtf) {
                const liveData = await fetchYahooLiveQuoteAndTech(target.ticker);
                if (liveData) {
                    target.price = liveData.price;
                    target.ma25 = liveData.ma25;
                    target.rsi = liveData.rsi;
                    target.bb = liveData.bb;
                    target.change = liveData.change;
                    target.syncedAt = liveData.syncedAt;
                    saveState();
                    renderWatchlist();
                    if (!document.getElementById("detailModal").classList.contains("hidden")) {
                        openDetailModal(target.id);
                    }
                }
            }
        }

        // Yahoo!ファイナンスの検索予測から選ばれた東証銘柄をライブ取得して追加
        async function selectOnlineCandidate(code, companyName) {
            const liveStatusText = document.getElementById("liveSearchStatusText");
            if (liveStatusText) liveStatusText.innerText = `⏳ ${companyName} (${code}) の株価データを取得中...`;

            const liveData = await fetchYahooLiveQuoteAndTech(code);
            const price = liveData ? liveData.price : 1000;
            const ma25 = liveData ? liveData.ma25 : price;
            const rsi = liveData ? liveData.rsi : 50;
            const bb = liveData ? liveData.bb : 0.0;
            const change = liveData ? liveData.change : "0.00%";

            const newItem = {
                id: code,
                ticker: `${code}.T`,
                code: `${code} 東証`,
                name: companyName,
                keywords: `${companyName} ${code}`,
                assetClass: "STOCK",
                sector: "東証上場銘柄 (Y!ファイナンス連動)",
                price,
                ma25,
                rsi,
                bb,
                change,
                syncedAt: liveData ? liveData.syncedAt : null,
                volatility: price < 100 ? 60 : 26,
                factors: {
                    value: 74,
                    momentum: Math.min(92, Math.max(35, rsi + 15)),
                    quality: 75,
                    stability: price < 100 ? 30 : 75,
                    macroFit: 80
                },
                businessSummary: `Yahoo!ファイナンス（${code}.T）から自動取得した過去3ヶ月間の日足終値データに基づき、25日移動平均線・14日RSI・ボリンジャーバンドをリアルタイム計算してクオンツ判定を行っています。`
            };

            if (!MASTER_MARKET_DB.some(m => m.id === code)) {
                MASTER_MARKET_DB.unshift(newItem);
            }
            const existingIdx = watchlist.findIndex(w => w.id === code);
            if (existingIdx >= 0) {
                watchlist[existingIdx] = cloneObj(newItem);
            } else {
                watchlist.unshift(cloneObj(newItem));
            }

            saveState();
            renderWatchlist();
            clearSearch();
            closeCatalogModal();
            openDetailModal(code);
        }

        async function triggerSearchNow() {
            const rawQuery = document.getElementById("quickSearchInput").value.trim();
            if (!rawQuery) {
                renderSearchCandidates(true);
                return;
            }
            // 4桁コード直接入力なら即座に取得
            if (/^([0-9]{4}|[0-9]{3}[A-Za-z])$/.test(rawQuery)) {
                const code = rawQuery.toUpperCase();
                const hits = await searchYahooJapanByKeyword(code);
                const name = hits.length > 0 ? hits[0].name : `東証銘柄 (${code})`;
                await selectOnlineCandidate(code, name);
                return;
            }
            renderSearchCandidates(true);
        }

        function quickSelect(keyword) {
            const input = document.getElementById("quickSearchInput");
            input.value = keyword;
            renderSearchCandidates(true);
        }

        function clearSearch() {
            document.getElementById("quickSearchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            document.getElementById("searchResultPanel").classList.add("hidden");
        }

        /* =========================================================================
         * 10. メイン画面・図鑑モーダル・詳細モーダルの描画
         * ========================================================================= */
        function getMacroLabel(val) {
            if (val === "rate_hike") return "🏦 日銀利上げ・国内追い風";
            if (val === "shock") return "⚡ 急落・リスクオフ警戒";
            if (val === "overheat") return "🔥 全面高・過熱警戒";
            return "☀️ 安定成長（通常モード）";
        }

        function getAssetTypeBadge(type) {
            if (type === "STOCK") return { label: "🏢 個別株", cls: "bg-blue-50 text-blue-700 border border-blue-200" };
            if (type === "REIT") return { label: "🏙️ J-REIT", cls: "bg-amber-50 text-amber-800 border border-amber-200" };
            if (type === "LEVERAGE") return { label: "⚡ ブル型投信", cls: "bg-purple-50 text-purple-700 border border-purple-200" };
            return { label: "🌱 インデックス投信", cls: "bg-teal-50 text-teal-700 border border-teal-200" };
        }

        function updateAllCalculations() {
            saveState();
            renderGlobalAllocation();
            renderWatchlist();
        }

        function renderGlobalAllocation() {
            const budget = parseFloat(document.getElementById("budgetInput").value) || 300000;
            const macro = document.getElementById("macroSelect").value;
            document.getElementById("macroBadge").innerText = getMacroLabel(macro);

            let r1 = 0.35, r2 = 0.40, r3 = 0.25;
            if (macro === "shock") { r1 = 0.50; r2 = 0.35; r3 = 0.15; }
            else if (macro === "overheat") { r1 = 0.15; r2 = 0.30; r3 = 0.55; }

            document.getElementById("globalAllocationCards").innerHTML = `
                <div class="bg-teal-50/80 border border-teal-200 rounded-2xl p-2.5">
                    <span class="text-[10px] font-bold text-teal-800 block">① 第1弾（打診買い）</span>
                    <strong class="text-xs font-extrabold text-teal-900">¥${Math.round(budget * r1).toLocaleString()}</strong>
                    <span class="text-[9px] text-teal-600 block">予算の${Math.round(r1 * 100)}%</span>
                </div>
                <div class="bg-sky-50/80 border border-sky-200 rounded-2xl p-2.5">

                </div>
                <div class="bg-slate-100 border border-slate-200 rounded-2xl p-2.5">
                    <span class="text-[10px] font-bold text-slate-700 block">③ 第3弾（暴落予備）</span>
                    <strong class="text-xs font-extrabold text-slate-800">¥${Math.round(budget * r3).toLocaleString()}</strong>
