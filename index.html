<!DOCTYPE html>

    <style>

            --primary: #0d9488;
            --primary-light: #f0fdfa;
        }
        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom, 90px);
        }
        .app-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px -3px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.03);
            transition: all 0.18s ease;
        }
        .app-card:active {
            transform: scale(0.985);
        }
        .gauge-track {
            background: linear-gradient(90deg, #10b981 0%, #38bdf8 30%, #facc15 65%, #f43f5e 100%);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }

<body class="max-w-md mx-auto min-h-screen px-4 pt-3 pb-28">

    <!-- 1. ヘッダー & CPCV信頼度ステータス -->
    <header class="flex justify-between items-center mb-4">
        <div>
            <div class="flex items-center gap-1.5 mb-0.5">
                <span class="inline-block w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
                <span class="text-[11px] font-bold text-teal-700">CPCV過学習防止・XAI推論エンジン稼働中</span>
            </div>
            <h1 class="text-xl font-extrabold text-slate-800 tracking-tight">クオンツ投資ナビ <span class="text-xs font-bold bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full align-middle">PRO</span></h1>
        </div>
        <button onclick="resetToDefault()" class="text-[11px] font-semibold text-slate-500 hover:text-slate-700 bg-white border border-slate-200 px-2.5 py-1.5 rounded-xl shadow-2xs">
            🔄 初期値に戻す
        </button>
    </header>

    <section class="relative mb-4 z-30">

            <div class="flex items-center gap-2">
                <span class="text-base pl-1">🔍</span>
                <input 
                    type="text" 
                    id="quickSearchInput" 
                    placeholder="銘柄検索（例：りそな、住友、ソニー、楽天、8308）" 
                    class="w-full text-xs font-medium text-slate-800 placeholder-slate-400 focus:outline-none bg-transparent py-1"
                    oninput="handleSearchInput()"
                    onfocus="handleSearchInput()"
                >
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden text-slate-400 hover:text-slate-600 px-1.5 text-sm font-bold">✕</button>
            </div>
            <!-- クイック候補チップ -->
            <div class="flex items-center gap-1.5 mt-2 pt-2 border-t border-slate-100 overflow-x-auto custom-scroll pb-0.5">
                <span class="text-[10px] font-bold text-slate-400 shrink-0">人気検索:</span>
                <button onclick="quickSelect('りそな')" class="text-[10px] font-bold bg-teal-50 text-teal-700 px-2 py-0.5 rounded-lg border border-teal-200 shrink-0">りそなHD</button>

                <button onclick="quickSelect('ソニー')" class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-lg border border-slate-200 shrink-0">ソニーG</button>
                <button onclick="quickSelect('住友電工')" class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-lg border border-slate-200 shrink-0">住友電工</button>
                <button onclick="quickSelect('日立')" class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded-lg border border-slate-200 shrink-0">日立製作所</button>
                <button onclick="quickSelect('オルカン')" class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-lg border border-indigo-200 shrink-0">オルカン</button>
            </div>
        </div>

        <!-- 予測変換ドロップダウンリスト -->
        <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-1.5 bg-white rounded-2xl border border-slate-200 shadow-2xl max-h-72 overflow-y-auto z-50 divide-y divide-slate-100">
            <!-- JSで動的生成 -->
        </div>
    </section>

    <!-- 3. あなたの投資予算 & 相場環境シミュレーター -->
    <section class="app-card rounded-3xl p-4 mb-5 bg-gradient-to-br from-white via-white to-teal-50/50">

        </div>
        <p class="text-[11px] text-slate-500 mb-3 leading-relaxed">
            一度に全額買わず、<strong>「①打診買い → ②押し目買い → ③暴落予備」</strong>の3段階に分けることで高値掴みを防ぎます。
        </p>

        <div class="grid grid-cols-2 gap-2.5 mb-3">
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">投資に回せる予算 (円)</label>
                <input 
                    type="number" 
                    id="budgetInput" 
                    value="300000" 
                    step="10000" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-extrabold text-slate-800 focus:border-teal-500 focus:outline-none"
                    oninput="updateAllCalculations()"
                >
            </div>
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">現在のマクロ経済環境</label>
                <select 
                    id="macroSelect" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-slate-700 focus:border-teal-500 focus:outline-none"
                    onchange="updateAllCalculations()"

                    <option value="rate_hike">🏦 日銀利上げ・国内追い風</option>
                    <option value="normal">☀️ 安定成長（通常モード）</option>
                    <option value="shock">⚡ 急落・リスクオフ警戒</option>
                    <option value="overheat">🔥 全面高・バブル過熱警戒</option>

            </div>
        </div>

            <!-- JSで動的描画 -->
        </div>
    </section>

    <div class="flex items-center justify-between mb-3">

        /* =========================================================================
         * 【Layer 2: QuantEngine】 多アセット統合スコアリング & CPCV/PBO信頼度計算
         * ========================================================================= */
        function evaluateQuantMetrics(asset, macroRegime) {
            const maDiffPct = ((asset.price - asset.ma25) / asset.ma25) * 100;
            const f = asset.factors || { value: 70, momentum: 70, quality: 70, stability: 70, macroFit: 70 };

            // 1. 押し目（割安）スコア vs 過熱スコアの算出
            // RSIが低い(30近辺)・BBがマイナス(-1.5σ以下)ほど「短期の反発期待値」が高い
            let technicalEntryScore = 50;
            if (asset.rsi <= 30) technicalEntryScore += 32;
            else if (asset.rsi <= 42) technicalEntryScore += 18;
            else if (asset.rsi >= 72) technicalEntryScore -= 30;
            else if (asset.rsi >= 65) technicalEntryScore -= 12;

            if (asset.bb <= -1.5) technicalEntryScore += 18;
            else if (asset.bb <= -0.8) technicalEntryScore += 10;
            else if (asset.bb >= 1.8) technicalEntryScore -= 20;

            // 2. ファンダメンタルズ基礎体力スコア (0〜100)
            let fundamentalScore = Math.round(
                f.value * 0.22 + f.momentum * 0.18 + f.quality * 0.25 + f.stability * 0.15 + f.macroFit * 0.20
            );

            // マクロ環境補正
            if (macroRegime === "rate_hike") {
                if (asset.sector && asset.sector.includes("銀行")) fundamentalScore += 7;
                if (asset.assetClass === "REIT") fundamentalScore -= 4;
            } else if (macroRegime === "shock") {
                if (asset.assetClass === "LEVERAGE") technicalEntryScore -= 15;
                if (asset.assetClass === "FUND") technicalEntryScore += 8;
            } else if (macroRegime === "overheat") {
                technicalEntryScore -= 10;
            }

            // レバレッジ型商品の減価ペナルティ (Volatility Decay: 0.5 * L * (L-1) * sigma^2)
            let decayRiskPct = 0;
            if (asset.assetClass === "LEVERAGE") {
                const L = asset.leverage || 4.3;
                const sigma = (asset.volatility || 65) / 100;
                decayRiskPct = Math.round(0.5 * L * (L - 1) * (sigma * sigma) * 100 * 0.15); // 年間推計減価インパクト
            }

            const totalScore = Math.max(15, Math.min(98, Math.round(fundamentalScore * 0.55 + technicalEntryScore * 0.45)));

            // 3. CPCV (組合せパージング交差検証) 信頼度と PBO (過学習確率)
            const pboPct = asset.assetClass === "LEVERAGE" ? 18.4 : Math.max(3.2, (100 - f.quality) * 0.25 + 2.5);
            const cpcvConfidence = Math.round(100 - pboPct);

            // 4. 売買シグナル判定 (Verdict)
            let signalCode = "STAY";
            let badgeText = "🟡 ステイ（保有・様子見）";
            let badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
            let dotColor = "bg-amber-500";
            let actionHeadline = "焦って動かず、現在のポジション維持が最適";

            if (asset.assetClass === "LEVERAGE") {
                if (asset.rsi <= 43 && asset.bb <= -1.0) {
                    signalCode = "SWING_BUY";
                    badgeText = "⚡ 短期リバウンド狙い（少額のみ）";
                    badgeStyle = "bg-sky-50 text-sky-800 border-sky-300";
                    dotColor = "bg-sky-500";
                    actionHeadline = "急落後の反発狙い好機。ただし数日〜数週間の短期決戦に限定！";
                } else if (asset.rsi >= 65 || asset.bb >= 1.3) {
                    signalCode = "SELL";
                    badgeText = "🟠 即利益確定・売却推奨";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    dotColor = "bg-rose-500";
                    actionHeadline = "4.3倍ブルの利益が乗っているうちに素早く利益確定を！";
                } else {
                    signalCode = "CAUTION";
                    badgeText = "⚠️ 様子見（長期保有はNG）";
                    badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
                    dotColor = "bg-amber-500";
                    actionHeadline = "方向感が曖昧な時期は『減価』で削られるため手出し無用";
                }
            } else if (asset.assetClass === "FUND") {
                if (asset.rsi <= 40 || asset.bb <= -1.2) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 積立＋スポット買い増し好機";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    dotColor = "bg-emerald-600";
                    actionHeadline = "定額積立に加えて、待機資金でのスポット購入が有効な割安局面";
                } else {
                    signalCode = "HOLD_DCA";
                    badgeText = "🌱 積立継続（売却不要）";
                    badgeStyle = "bg-teal-50 text-teal-800 border-teal-300";
                    dotColor = "bg-teal-500";
                    actionHeadline = "毎月の定額積立を淡々と継続。今あえて一括購入する必要はなし";
                }
            } else {
                // 個別株 & J-REIT
                if (asset.rsi <= 35 || asset.bb <= -1.4) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 強い買い（絶好の押し目）";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    dotColor = "bg-emerald-600";
                    actionHeadline = "統計的な『売られすぎバーゲン圏』。第1弾・第2弾の買い出動を推奨";
                } else if (totalScore >= 75 && asset.rsi <= 62 && asset.bb <= 1.2) {
                    signalCode = "BUY";
                    badgeText = "🟢 分割買い推奨（順張り・押し目）";
                    badgeStyle = "bg-emerald-50 text-emerald-800 border-emerald-300";
                    dotColor = "bg-emerald-500";
                    actionHeadline = "業績・マクロ追い風と適正な株価水準が両立。まず予算の3〜4割で打診買い";
                } else if (asset.rsi >= 70 || asset.bb >= 1.8) {
                    signalCode = "SELL";
                    badgeText = "🟠 利益確定・新規買い見送り";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    dotColor = "bg-rose-500";
                    actionHeadline = "短期的な買われすぎ過熱圏。保有株は半分利確、新規買いは押し目を待つ";
                }
            }

            // 5. 具体的な目標価格帯（指値・利確・損切り）の計算
            const volFactor = asset.assetClass === "LEVERAGE" ? 0.08 : 0.035;
            const entry1 = Math.round(asset.price); // 現在の打診価格
            const entry2 = Math.round(Math.min(asset.price * (1 - volFactor), asset.ma25 * (1 - volFactor * 0.7))); // 本命押し目指値
            const takeProfit = Math.round(Math.max(asset.price * (1 + volFactor * 2.2), asset.ma25 * (1 + volFactor * 2.5)));
            const stopLoss = Math.round(entry2 * (1 - volFactor * 1.4));

            // 6. 温度計ゲージ位置 (0% = 超割安 -3σ, 50% = 25日平均, 100% = 超加熱 +3σ)
            const gaugePosition = Math.max(5, Math.min(95, Math.round(50 + (asset.bb / 3.0) * 42)));

            return {
                maDiffPct: maDiffPct.toFixed(1),
                totalScore,
                fundamentalScore,
                technicalEntryScore,
                pboPct: pboPct.toFixed(1),
                cpcvConfidence,
                decayRiskPct,
                signalCode,
                badgeText,
                badgeStyle,
                dotColor,
                actionHeadline,
                entry1,
                entry2,
                takeProfit,
                stopLoss,
                gaugePosition,
                factors: f
            };
        }

            ];

            return { analogy, factText, logicText, yen1, yen2, yen3, ratio1, ratio2, ratio3, scenarios };

        function updateAssetLive(assetId) {
            const item = watchlist.find(w => w.id === assetId);
            if (!item) return;

            const newMa25 = parseFloat(document.getElementById("liveMa25").value) || item.ma25;
            const newRsi = parseFloat(document.getElementById("liveRsi").value) || item.rsi;

            const diffRatio = (newPrice - newMa25) / (newMa25 * 0.04);
            item.price = newPrice;
            item.ma25 = newMa25;
            item.rsi = Math.max(5, Math.min(95, newRsi));
            item.bb = Number(Math.max(-3.0, Math.min(3.0, diffRatio)).toFixed(1));

            saveState();
            renderWatchlist();
            openDetailModal(assetId);
        }

        function closeDetailModal() {
            document.getElementById("detailModal").classList.add("hidden");
        }

        /* =========================================================================
         * 新規カスタム銘柄登録処理
         * ========================================================================= */
        function openCustomModal() {
            document.getElementById("customModal").classList.remove("hidden");
        }

        function openCustomModalWithQuery(q) {
            clearSearch();
            document.getElementById("custName").value = q;
            openCustomModal();
        }

        function closeCustomModal() {
            document.getElementById("customModal").classList.add("hidden");
        }

        function submitCustomAsset() {
            const name = document.getElementById("custName").value.trim();
            const assetClass = document.getElementById("custType").value;
            const price = parseFloat(document.getElementById("custPrice").value);
            const ma25 = parseFloat(document.getElementById("custMa25").value) || price;
            const rsi = parseFloat(document.getElementById("custRsi").value) || 50;
            const bb = parseFloat(document.getElementById("custBb").value) || 0.0;

            if (!name || isNaN(price) || price <= 0) {
                alert("銘柄名と現在値を入力してください。");
                return;
            }

            const newItem = {
                id: "custom-" + Date.now(),
                code: "カスタム登録",
                name,
                keywords: name,
                assetClass,
                sector: assetClass === "LEVERAGE" ? "レバレッジ投信" : "カスタム監視銘柄",
                price,
                ma25,
                rsi,
                bb,
                change: "+0.00%",
                volatility: assetClass === "LEVERAGE" ? 65 : 22,
                leverage: assetClass === "LEVERAGE" ? 4.3 : 1,
                factors: { value: 74, momentum: 72, quality: 76, stability: assetClass === "LEVERAGE" ? 20 : 75, macroFit: 78 },
                businessSummary: "あなたがカスタム登録した監視銘柄です。入力された移動平均線乖離・RSI・ボリンジャーバンド位置からクオンツエンジンがリアルタイムに推論を行っています。"
            };

            watchlist.unshift(newItem);
            saveState();
            renderWatchlist();
            closeCustomModal();
            openDetailModal(newItem.id);
        }

        function renderAll() {
            renderGlobalAllocation();
            renderWatchlist();
        }

        // 画面外タップで検索候補を閉じる
        document.addEventListener("click", (e) => {
            const searchSection = document.getElementById("quickSearchInput");
            const dropdown = document.getElementById("searchDropdown");
            if (!searchSection.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden");
            }
        });

        // アプリ起動
        loadState();
        renderAll();
    </script>
</body>
</html>
