<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantPulse Pro - クオンツ投資・売買アドバイザー</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #090a0f; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(20, 24, 39, 0.75); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-purple { box-shadow: 0 0 25px rgba(139, 92, 246, 0.25); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-5 pt-2">
        <div>
            <span class="text-xs font-semibold text-purple-400 tracking-wider uppercase">QuantPulse Pro v2.0</span>
            <h1 class="text-xl font-bold text-white">クオンツ投資・売買アドバイザー</h1>
        </div>
        <button onclick="openSearchModal()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1 shadow-lg shadow-purple-900/40">
            🔍 日経・市場検索
        </button>
    </header>

    <!-- 資金配分シミュレーター -->
    <section class="glass-card rounded-2xl p-4 mb-5 glow-purple">
        <h2 class="text-sm font-semibold text-purple-300 mb-2 flex items-center gap-1.5">
            <span>💡</span> 待機資金・分割エントリー配分
        </h2>
        <div class="flex gap-2 mb-3">
            <div class="flex-1">
                <label class="text-[10px] text-gray-400 block mb-1">投資可能資金 (円)</label>
                <input type="number" id="capitalInput" value="300000" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-purple-500" oninput="calculateAllocation()">
            </div>
            <div class="w-32">
                <label class="text-[10px] text-gray-400 block mb-1">現在の相場状態</label>
                <select id="marketState" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-purple-500" onchange="calculateAllocation()">
                    <option value="normal">中立・通常</option>
                    <option value="panic">📉 パニック急落</option>
                    <option value="bubble">📈 統計的過熱</option>
                </select>
            </div>
        </div>
        <div id="allocationResult" class="grid grid-cols-3 gap-2 text-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-xs"></div>
    </section>

    <!-- 監視銘柄・ファンド一覧 -->
    <section>
        <div class="flex justify-between items-center mb-3">
            <h2 class="text-sm font-semibold text-gray-300 flex items-center gap-1.5">
                <span>📊</span> 監視銘柄一覧（タップして詳細分析）
            </h2>
            <span id="itemCount" class="text-xs text-purple-400 bg-purple-950/60 px-2 py-0.5 rounded-full border border-purple-800/50"></span>
        </div>
        <div id="watchlistContainer" class="space-y-2.5"></div>
    </section>

    <!-- 銘柄検索＆予測モーダル -->
    <div id="searchModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-5 w-full max-w-sm border border-purple-500/30">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                    <span>🔍</span> 日経市場データ・銘柄検索
                </h3>
                <button onclick="closeSearchModal()" class="text-gray-400 hover:text-white text-lg">×</button>
            </div>
            <p class="text-[11px] text-gray-400 mb-3">
                銘柄名やキーワード（例：「りそな」「ソニー」「日経」「ブル」）を入力すると検索予測が表示されます。
            </p>

            <div class="relative mb-3">
                <input type="text" id="marketSearchInput" placeholder="例: りそなホールディングス" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-purple-500" oninput="filterSuggestions()">
                <div id="suggestionsBox" class="absolute left-0 right-0 top-full mt-1 bg-slate-900 border border-slate-700 rounded-lg max-h-40 overflow-y-auto z-20 hidden shadow-xl"></div>
            </div>

            <div class="space-y-2.5">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">銘柄名</label>
                        <input type="text" id="inputName" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" readonly>
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">現在値 (円)</label>
                        <input type="number" id="inputPrice" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">25日移動平均</label>
                        <input type="number" id="inputMa" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">RSI (0-100)</label>
                        <input type="number" id="inputRsi" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="text-[10px] text-gray-400 block mb-1">BB位置 (-3~3)</label>
                        <input type="number" step="0.1" id="inputBb" class="w-full bg-slate-900/90 border border-slate-700 rounded-lg px-2 py-2 text-xs text-white">
                    </div>
                </div>
            </div>

            <div class="flex gap-2 mt-4">
                <button onclick="closeSearchModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-gray-300 py-2 rounded-xl text-xs font-medium">キャンセル</button>
                <button onclick="addSelectedAsset()" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white py-2 rounded-xl text-xs font-medium shadow-lg shadow-purple-900/50">監視リストに追加</button>
            </div>
        </div>
    </div>

    <!-- 詳細分析モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card rounded-2xl p-5 w-full max-w-sm border border-purple-500/30 max-h-[85vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <h3 id="detailTitle" class="text-sm font-bold text-white flex items-center gap-1.5"><span>📈</span> 銘柄詳細分析</h3>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-white text-lg">×</button>
            </div>
            <div id="detailContent" class="space-y-3 text-xs"></div>
            <button onclick="closeDetailModal()" class="w-full mt-4 bg-slate-800 hover:bg-slate-700 text-gray-300 py-2 rounded-xl font-medium">閉じる</button>
        </div>
    </div>

    <script>
        // 日経市場データ・データベース（検索予測用）
        const marketDatabase = [
            { name: "りそなホールディングス (8308)", type: "個別株式", price: 1145, ma25: 1110, rsi: 58, bb: +0.9, change: "+1.42%", desc: "銀行セクター。金利引き上げ局面における利ざや改善期待が継続。押し目買い優勢のトレンド。" },
            { name: "楽天日本株4.3倍ブル", type: "投資信託", price: 54773, ma25: 58000, rsi: 42, bb: -1.2, change: "+11.9%", desc: "超短期レバレッジ型。下値支持線近辺でのボラティリティを活用した分割スイング狙い。" },
            { name: "ソニーグループ (6758)", type: "個別株式", price: 4297, ma25: 4180, rsi: 58, bb: +1.0, change: "+1.25%", desc: "エンタメ・半導体関連の好決算を背景に堅調。モメンタム維持でホールド推奨。" },
            { name: "トヨタ自動車 (7203)", type: "個別株式", price: 2582, ma25: 2700, rsi: 28, bb: -1.8, change: "+0.78%", desc: "売られすぎ領域（RSI 30以下）。ボリンジャー下限にタッチしており強い押し目買いチャンス。" },
            { name: "日経225インデックスファンド", type: "投資信託", price: 38953, ma25: 39200, rsi: 46, bb: -0.7, change: "-0.28%", desc: "日経平均全体のモメンタムは中立。定期積立継続しつつ、下落時はスポット追加を検討。" },
            { name: "eMAXIS Slim 全世界株式(オルカン)", type: "投資信託", price: 24150, ma25: 23800, rsi: 56, bb: +0.6, change: "+0.45%", desc: "世界分散の基軸ファンド。強気トレンド継続中につき淡々と積立継続。" },
            { name: "eMAXIS Slim 米国株式(S&P500)", type: "投資信託", price: 31200, ma25: 30500, rsi: 61, bb: +1.1, change: "+0.82%", desc: "米主要株価指数の堅調な推移を受け堅調。利益確定は急がずホールド。" },
            { name: "住友電気工業 (5802)", type: "個別株式", price: 2840, ma25: 2750, rsi: 63, bb: +1.3, change: "+2.10%", desc: "電線・自動車ハーネス関連。データセンター向け需要拡大思惑で買収意欲高い。" },
            { name: "日立製作所 (6501)", type: "個別ServiceID", price: 17200, ma25: 16800, rsi: 59, bb: +0.8, change: "+0.95%", desc: "グローバルIT・インフラ投資の追い風を受け、堅調な上値追い展開。" }
        ];

        let watchlist = [
            marketDatabase[0], // りそな
            marketDatabase[1], // 楽天4.3倍ブル
            marketDatabase[2], // ソニー
            marketDatabase[3]  // トヨタ
        ];

        function getSignal(rsi, bb) {
            if (rsi <= 30 || bb <= -2.0) return { text: "🔥 強い買い（押し目）", bg: "bg-emerald-950/80 text-emerald-400 border-emerald-800/60" };
            if (rsi <= 43 || (bb <= -1.0 && rsi < 52)) return { text: "🛒 分割買い検討", bg: "bg-blue-950/80 text-blue-400 border-blue-800/60" };
            if (rsi >= 70 || bb >= 2.0) return { text: "⚠️ 利確・売り", bg: "bg-rose-950/80 text-rose-400 border-rose-800/60" };
            return { text: "🛡️ ステイ・ホールド", bg: "bg-amber-950/80 text-amber-400 border-amber-800/60" };
        }

        function renderWatchlist() {
            const container = document.getElementById('watchlistContainer');
            document.getElementById('itemCount').innerText = `${watchlist.length} 銘柄`;
            container.innerHTML = '';

            watchlist.forEach((item, index) => {
                const sig = getSignal(item.rsi, item.bb);
                const isPositive = item.change.startsWith('+');
                
                const card = document.createElement('div');
                card.className = "glass-card rounded-xl p-3 flex justify-between items-center transition hover:border-purple-500/50 cursor-pointer";
                card.onclick = () => openDetailModal(item);
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-0.5">
                            <span class="text-[10px] px-1.5 py-0.5 rounded ${item.type === '投資信託' ? 'bg-purple-950 text-purple-300 border border-purple-800/50' : 'bg-slate-800 text-gray-300 border border-slate-700'}">${item.type}</span>
                            <h3 class="text-xs font-bold text-white">${item.name}</h3>
                        </div>
                        <div class="text-[10px] text-gray-400 flex gap-3 mt-1">
                            <span>RSI: <strong class="text-gray-200">${item.rsi}</strong></span>
                            <span>BB: <strong class="text-gray-200">${item.bb > 0 ? '+' + item.bb : item.bb}σ</strong></span>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-bold text-white">¥${item.price.toLocaleString()}</div>
                        <div class="text-[10px] ${isPositive ? 'text-emerald-400' : 'text-rose-400'} mb-1">${item.change}</div>
                        <span class="inline-block text-[10px] px-2 py-0.5 rounded-full border ${sig.bg}">${sig.text}</span>
                    </div>
                `;
                container.appendChild(card);
            });
            calculateAllocation();
        }

        // 検索予測フィルター
        function filterSuggestions() {
            const query = document.getElementById('marketSearchInput').value.toLowerCase();
            const box = document.getElementById('suggestionsBox');
            box.innerHTML = '';

            if (!query) {
                box.classList.add('hidden');
                return;
            }

            const filtered = marketDatabase.filter(m => m.name.toLowerCase().includes(query));
            if (filtered.length === 0) {
                box.classList.add('hidden');
                return;
            }

            filtered.forEach(m => {
                const div = document.createElement('div');
                div.className = "px-3 py-2 text-xs text-gray-200 hover:bg-purple-900/60 cursor-pointer border-b border-slate-800 last:border-none";
                div.innerHTML = `<strong>${m.name}</strong> <span class="text-gray-400 text-[10px]">(${m.type} / ¥${m.price.toLocaleString()})</span>`;
                div.onclick = () => selectSearchedItem(m);
                box.appendChild(div);
            });
            box.classList.remove('hidden');
        }

        function selectSearchedItem(m) {
            document.getElementById('marketSearchInput').value = m.name;
            document.getElementById('inputName').value = m.name;
            document.getElementById('inputPrice').value = m.price;
            document.getElementById('inputMa').value = m.ma25;
            document.getElementById('inputRsi').value = m.rsi;
            document.getElementById('inputBb').value = m.bb;
            document.getElementById('suggestionsBox').classList.add('hidden');
        }

        function addSelectedAsset() {
            const name = document.getElementById('inputName').value;
            if (!name) {
                alert('検索候補から銘柄を選択してください。');
                return;
            }
            const base = marketDatabase.find(m => m.name === name) || {
                name,
                type: '個別株式',
                price: parseFloat(document.getElementById('inputPrice').value),
                ma25: parseFloat(document.getElementById('inputMa').value),
                rsi: parseFloat(document.getElementById('inputRsi').value),
                bb: parseFloat(document.getElementById('inputBb').value),
                change: "+0.0%",
                desc: "カスタム登録された銘柄データ。統計指標を基に自動監視中。"
            };

            if (!watchlist.some(w => w.name === base.name)) {
                watchlist.unshift(base);
            }
            renderWatchlist();
            closeSearchModal();
        }

        // 詳細分析モーダル表示
        function openDetailModal(item) {
            const sig = getSignal(item.rsi, item.bb);
            document.getElementById('detailTitle').innerText = `📊 ${item.name} の詳細分析`;
            document.getElementById('detailContent').innerHTML = `
                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between">
                        <span class="text-gray-400">現在値 / 基準価額</span>
                        <strong class="text-white text-sm">¥${item.price.toLocaleString()}</strong>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">統計判定シグナル</span>
                        <span class="px-2 py-0.5 rounded border text-[10px] ${sig.bg}">${sig.text}</span>
                    </div>
                </div>

                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-2">
                    <h4 class="text-purple-300 font-bold">📉 クオンツ統計インジケーター</h4>
                    <div class="grid grid-cols-3 gap-2 text-center pt-1">
                        <div class="bg-slate-950 p-2 rounded-lg">
                            <span class="text-[10px] text-gray-400 block">RSI (14日)</span>
                            <strong class="text-white">${item.rsi}</strong>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-lg">
                            <span class="text-[10px] text-gray-400 block">ボリンジャー</span>
                            <strong class="text-white">${item.bb > 0 ? '+' + item.bb : item.bb}σ</strong>
                        </div>
                        <div class="bg-slate-950 p-2 rounded-lg">
                            <span class="text-[10px] text-gray-400 block">25日移動平均</span>
                            <strong class="text-white">¥${item.ma25.toLocaleString()}</strong>
                        </div>
                    </div>
                </div>

                <div class="bg-purple-950/30 p-3 rounded-xl border border-purple-800/40 space-y-1.5">
                    <h4 class="text-purple-300 font-bold">🔮 今後の相場予測・AIアドバイス</h4>
                    <p class="text-gray-300 leading-relaxed">${item.desc}</p>
                </div>

                <div class="bg-slate-900/90 p-3 rounded-xl border border-slate-800 space-y-1.5">
                    <h4 class="text-emerald-400 font-bold">💡 売買アクション指針</h4>
                    <p class="text-gray-300 text-[11px] leading-relaxed">
                        ${item.rsi <= 30 ? '売られすぎ水準に達しています。待機資金を用いた積極的な押し目買いを推奨します。' : item.rsi >= 70 ? '短期的な過熱感が見られます。一部利益確定や新規買いの停止を検討してください。' : 'トレンドは安定しています。積立の継続、または押し目での分割エントリーが有効です。'}
                    </p>
                </div>
            `;
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
        function openSearchModal() { document.getElementById('searchModal').classList.remove('hidden'); }
        function closeSearchModal() { document.getElementById('searchModal').classList.add('hidden'); }

        function calculateAllocation() {
            const capital = parseFloat(document.getElementById('capitalInput').value) || 300000;
            const state = document.getElementById('marketState').value;
            const resultDiv = document.getElementById('allocationResult');

            let r1 = 0.3, r2 = 0.5, r3 = 0.2;
            if (state === 'panic') { r1 = 0.6; r2 = 0.3; r3 = 0.1; }
            if (state === 'bubble') { r1 = 0.1; r2 = 0.2; r3 = 0.7; }

            resultDiv.innerHTML = `
                <div><span class="text-[10px] text-gray-400 block mb-0.5">第1弾(今すぐ)</span><strong class="text-xs text-purple-300">¥${Math.round(capital * r1).toLocaleString()}</strong></div>
                <div><span class="text-[10px] text-gray-400 block mb-0.5">第2弾(-2σ時)</span><strong class="text-xs text-blue-300">¥${Math.round(capital * r2).toLocaleString()}</strong></div>
                <div><span class="text-[10px] text-gray-400 block mb-0.5">予備(暴落時)</span><strong class="text-xs text-emerald-300">¥${Math.round(capital * r3).toLocaleString()}</strong></div>
            `;
        }

        renderWatchlist();
    </script>
</body>
</html>
