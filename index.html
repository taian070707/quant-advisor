<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>クオンツ投資ナビAI PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#f4f8f6;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e8f0;box-shadow:0 4px 12px rgba(15,23,42,.04)}
.yf-head{background:linear-gradient(180deg,#162436,#1e2f44);color:#fff}
.gauge{background:linear-gradient(90deg,#10b981 0%,#38bdf8 30%,#facc15 65%,#f43f5e 100%)}
.sc::-webkit-scrollbar{width:4px;height:4px}.sc::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
.hidden{display:none!important}
@keyframes sp{to{transform:rotate(360deg)}}.spin{display:inline-block;animation:sp .8s linear infinite}
</style>
</head>
<body class="max-w-md mx-auto min-h-screen px-3.5 pt-3">

<!-- 1. ヘッダー -->
<header class="flex justify-between items-center mb-3">
  <div>
    <div class="flex items-center gap-1.5 mb-0.5">
      <span class="w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
      <span id="syncTxt" class="text-[10px] font-bold text-teal-700">Y!・みんかぶ・指数連動エンジン稼働中</span>
    </div>
    <h1 class="text-lg font-extrabold text-slate-800">クオンツ投資ナビ <span class="text-[11px] bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full">PRO</span></h1>
  </div>
  <div class="flex gap-1.5">
    <button type="button" onclick="syncAll()" class="text-[11px] font-extrabold text-white bg-teal-600 px-2.5 py-2 rounded-xl shadow-sm flex items-center gap-1"><span id="syncIco">🔄</span>最新同期</button>
    <button type="button" onclick="modal('catModal',1)" class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200 px-2.5 py-2 rounded-xl">📋 図鑑</button>
  </div>
</header>

<!-- 2. 検索バー（株・投信・4桁/8桁コード対応） -->
<section class="mb-3.5">
  <div class="card rounded-2xl p-3 border-2 border-teal-500/40">
    <div class="flex items-center gap-1.5">
      <span>🔍</span>
      <input type="search" id="qIn" placeholder="株・投信・コード (例: 47311988, AJ313178, netWIN, 千葉)" autocomplete="off" class="w-full text-xs font-bold bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 focus:outline-none">
      <button type="button" id="clrBtn" onclick="clrSearch()" class="hidden text-slate-400 px-2 py-1.5 text-xs font-bold bg-slate-100 rounded-lg">✕</button>
      <button type="button" onclick="directSearch()" class="bg-teal-600 text-white text-xs font-extrabold px-3 py-2 rounded-xl shrink-0">検索</button>
    </div>
    <div class="flex items-center gap-1.5 mt-2 pt-2 border-t border-slate-100 overflow-x-auto sc pb-1">
      <span class="text-[10px] font-bold text-slate-400 shrink-0">注目:</span>
      <button type="button" onclick="qSet('日経225')" class="text-[10px] font-bold bg-teal-50 text-teal-800 px-2 py-1 rounded-lg border border-teal-200 shrink-0">🌱 日経225投信</button>
      <button type="button" onclick="qSet('netWIN')" class="text-[10px] font-bold bg-teal-50 text-teal-800 px-2 py-1 rounded-lg border border-teal-200 shrink-0">🌱 netWIN</button>
      <button type="button" onclick="qSet('千葉')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2 py-1 rounded-lg border border-emerald-200 shrink-0">🏦 千葉銀行</button>
      <button type="button" onclick="qSet('りそな')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2 py-1 rounded-lg border border-emerald-200 shrink-0">🏦 りそなHD</button>
      <button type="button" onclick="qSet('北浜')" class="text-[10px] font-bold bg-amber-50 text-amber-800 px-2 py-1 rounded-lg border border-amber-200 shrink-0">📈 北浜キャピタル</button>
      <button type="button" onclick="qSet('キオクシア')" class="text-[10px] font-bold bg-sky-50 text-sky-800 px-2 py-1 rounded-lg border border-sky-200 shrink-0">🔥 キオクシア</button>
    </div>
    <div id="sPanel" class="hidden mt-2.5 pt-2 border-t border-teal-100">
      <div class="flex justify-between items-center mb-1.5 px-1">
        <span class="text-[11px] font-extrabold text-teal-800">検索候補（タップで追加・診断）</span>
        <button type="button" onclick="clrSearch()" class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded">▲ 閉じる</button>
      </div>
      <div id="sList" class="max-h-60 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl bg-white sc"></div>
      <div id="sMsg" class="hidden mt-1.5 px-2 py-1 bg-teal-50 rounded text-[10px] font-bold text-teal-800"></div>
    </div>
  </div>
</section>

<!-- 3. 予算＆マクロ環境 -->
<section class="card rounded-3xl p-3.5 mb-3.5 bg-gradient-to-br from-white to-teal-50/40">
  <div class="grid grid-cols-2 gap-2 mb-2.5">
    <div class="bg-slate-50 p-2 rounded-xl border">
      <label class="text-[10px] font-bold text-slate-500 block">投資予算 (円)</label>
      <input type="number" id="bIn" value="300000" step="10000" class="w-full bg-white border rounded-lg px-2 py-1 text-xs font-extrabold" oninput="renderAll()">
    </div>
    <div class="bg-slate-50 p-2 rounded-xl border">
      <label class="text-[10px] font-bold text-slate-500 block">マクロ経済環境</label>
      <select id="mSel" class="w-full bg-white border rounded-lg px-1.5 py-1 text-xs font-bold" onchange="renderAll()">
        <option value="rate_hike">🏦 日銀利上げ・国内追い風</option>
        <option value="normal">☀️ 安定成長（通常）</option>
        <option value="shock">⚡ 急落・リスクオフ警戒</option>
        <option value="overheat">🔥 全面高・過熱警戒</option>
      </select>
    </div>
  </div>
  <div id="allocBox" class="grid grid-cols-3 gap-2 text-center"></div>
</section>

<!-- 4. フィルター -->
<div class="flex items-center justify-between gap-2 mb-2.5">
  <div class="flex gap-1 overflow-x-auto sc">
    <button type="button" onclick="setFlt('ALL')" id="f-ALL" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-teal-600 text-white">すべて</button>
    <button type="button" onclick="setFlt('STOCK')" id="f-STOCK" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white border text-slate-600">🏢 株式</button>
    <button type="button" onclick="setFlt('FUND')" id="f-FUND" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white border text-slate-600">🌱 投資信託</button>
    <button type="button" onclick="setFlt('REIT')" id="f-REIT" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white border text-slate-600">🏙️ REIT</button>
  </div>
  <select id="sSel" onchange="renderList()" class="text-[11px] font-bold bg-white border rounded-xl px-2 py-1.5">
    <option value="def">登録順</option>
    <option value="score">AIスコア順</option>
    <option value="rsi">割安(RSI低)順</option>
  </select>
</div>

<!-- 5. 監視リスト -->
<section>
  <div class="flex justify-between items-center mb-2 px-1">
    <span class="text-[11px] font-bold text-slate-500">💡 タップで最上部にY!株価/基準価額＆チャート表示</span>
    <span id="cntLbl" class="text-[11px] font-extrabold text-teal-700"></span>
  </div>
  <div id="wBox" class="space-y-2.5"></div>
  <div class="mt-5 flex justify-center gap-4">
    <button type="button" onclick="modal('custModal',1)" class="text-[11px] font-bold text-teal-700 underline">＋ コード指定・手動追加</button>
    <button type="button" onclick="resetAll()" class="text-[11px] text-slate-400 underline">初期リストに戻す</button>
  </div>
</section>

<!-- 詳細モーダル -->
<div id="dtModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
  <div class="bg-[#f8faf9] w-full max-w-md rounded-t-3xl sm:rounded-3xl border shadow-2xl max-h-[94vh] flex flex-col overflow-hidden">
    <div class="bg-[#162436] text-white px-4 py-3 flex justify-between items-center shrink-0">

        <div class="flex items-center gap-1.5"><span id="mBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded"></span><span id="mCode" class="text-[11px] font-bold text-slate-300"></span></div>
        <h3 id="mTitle" class="text-sm font-extrabold text-white mt-0.5 truncate"></h3>
      </div>
      <button type="button" onclick="modal('dtModal',0)" class="w-8 h-8 rounded-full bg-slate-700 text-white font-bold">✕</button>
    </div>
    <div id="mBody" class="p-3.5 overflow-y-auto space-y-3 sc"></div>
    <div class="bg-white px-4 py-2.5 border-t flex gap-2 shrink-0">

      <button type="button" id="mSync" class="px-3 py-2 rounded-xl border border-teal-200 bg-teal-50 text-teal-800 text-xs font-extrabold">🔄 最新データ再取得</button>
      <button type="button" onclick="modal('dtModal',0)" class="flex-1 py-2 rounded-xl bg-teal-600 text-white text-xs font-extrabold">閉じる</button>
    </div>
  </div>
</div>

<!-- 図鑑モーダル -->
<div id="catModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">

    <div class="px-4 py-3 border-b flex justify-between items-center">
      <h3 class="text-sm font-extrabold">📋 株式・投資信託 図鑑（ワンタップ追加）</h3>
      <button type="button" onclick="modal('catModal',0)" class="w-7 h-7 rounded-full bg-slate-100 font-bold">✕</button>
    </div>
    <div class="p-2.5 bg-slate-50 border-b">
      <input type="search" id="catIn" placeholder="図鑑内を検索（例: 日経225, netWIN, 千葉, 8331）" class="w-full bg-white border rounded-xl px-3 py-1.5 text-xs font-bold" oninput="renderCat()">
    </div>
    <div id="catList" class="p-3 overflow-y-auto divide-y flex-1 sc"></div>
  </div>
</div>

    </div>

      <input type="text" id="cName" placeholder="銘柄・ファンド名（空欄でもコードから自動取得）" class="w-full bg-slate-50 border rounded-xl px-3 py-2 font-bold">

</div>

async function fetchCors(url, tm=3800) {
  const ps = [
    `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&_=${Date.now()}`,
    `https://corsproxy.io/?url=${encodeURIComponent(url)}`,
    `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
  ];
  try {
    return await Promise.any(ps.map(async p => {
      const c = new AbortController(), id = setTimeout(()=>c.abort(), tm);
      const r = await fetch(p, {signal:c.signal}); clearTimeout(id);
      if(!r.ok) throw 0;
      const t = p.includes("allorigins") ? (await r.json()).contents : await r.text();
      if(!t || t.length<40 || t.includes("European Economic Area")) throw 0;
      return t;
    }));
  } catch { return null; }
}

const cNum = v => { const n = parseFloat(String(v??"").replace(/,/g,"").replace(/[^\d.-]/g,"")); return isNaN(n)?NaN:n; };
const isFCode = c => /^[0-9A-Z]{8}$/i.test(String(c||"").trim());
const isSCode = c => /^([0-9]{4}|[0-9]{3}[A-Z])(\.T)?$/i.test(String(c||"").trim());
const norm = s => String(s||"").toLowerCase().replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\(株\)|株式会社|ホールディングス|－|-|\s+/g,"");

function parseHtml(html) {
  if(!html) return null;
  const o = {};
  const mk = html.match(/投資信託情報：([^<「｜|]+?)は基準価額([0-9,]+)円、前日比([+-]?[0-9,]+)円（([+-]?[0-9.]+)%）/);
  if(mk){ o.name=mk[1].trim(); o.price=cNum(mk[2]); o.change=`${mk[4]}% (${mk[3]}円)`; }
  const tl = html.match(/<title>\s*([^<｜|【]+?)(?:\【([0-9A-Z.]+)\】|[｜|])/i);
  if(tl && !o.name) o.name = tl[1].replace(/\(株\)|株式会社|投資信託情報：/g,"").trim();
  const stM = html.match(/window\.__PRELOADED_STATE__\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
  if(stM){
    try {
      const st = JSON.parse(stM[1]), pb = st?.mainStocksPriceBoard?.priceBoard || st?.mainFundPriceBoard?.fundPrices || {}, dt = st?.mainStocksDetail?.detail || {};
      if(pb.name||pb.fundName) o.name = String(pb.name||pb.fundName).replace(/\(株\)|株式会社/g,"").trim();
      const p = cNum(pb.price||pb.nav), prev = cNum(dt.previousPrice||pb.previousPrice), pts = cNum(pb.ptsPrice||pb?.pts?.price);
      if(p>0) o.price=p; if(prev>0) o.prevClose=prev;
      if(pts>0){ o.ptsPrice=pts; o.ptsChange=`${pb.ptsPriceChange||""} (${pb.ptsPriceChangeRate||""}%)`.replace(/\(\s*%\)/,""); }
      const rt = cNum(pb.priceChangeRate||pb.navChangeRate);
      if(!isNaN(rt)) o.change = (rt>=0?"+":"")+rt.toFixed(2)+"%";
    } catch {}
  }
  if(!o.price){ const m = html.match(/(?:基準価額|現在値)[\s\S]{1,150}?([0-9]{1,3}(?:,[0-9]{3})+)\s*円/); if(m) o.price=cNum(m[1]); }
  if(!o.prevClose){ const m = html.match(/前日終値[\s\S]{1,180}?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/); if(m) o.prevClose=cNum(m[1]); }
  if(!o.ptsPrice){ const m = html.match(/夜間PTS[\s\S]{1,150}?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/); if(m) o.ptsPrice=cNum(m[1]); }
  if(!o.price && o.prevClose) o.price = o.prevClose;
  return o.price>0 ? o : null;
}

function getBenchEtf(it) {
  if(it.proxyEtf) return it.proxyEtf;
  const s = `${it.name} ${it.sector}`.toLowerCase();
  if(s.includes("4.3倍")||s.includes("ブル")) return "1570.T";
  if(s.includes("テクノロジー")||s.includes("netwin")||s.includes("fang")||s.includes("半導体")) return "2244.T";
  if(s.includes("全世界")||s.includes("オール・カントリー")||s.includes("世界")) return "2559.T";
  if(s.includes("米国")||s.includes("s&p")||s.includes("全米")) return "2558.T";
  return "1321.T";
}

async function fetchLive(it, rerender=false) {
  if(!it) return;
  const cid = String(it.id||"").replace(/\.T$/i,"").toUpperCase();
  const mHit = DB.find(m => m.id.toUpperCase()===cid || norm(m.name)===norm(it.name));
  if(mHit && (it.change==="取得中..." || it.price===20000 || it.price===1500)) {
    Object.assign(it, JSON.parse(JSON.stringify(mHit))); save(); renderList();
  }
  const isF = it.assetClass==="FUND"||it.assetClass==="LEVERAGE"||isFCode(cid);
  const sym = isF ? getBenchEtf(it) : `${cid}.T`;
  const [mkH, yfH, cJson] = await Promise.all([
    fetchCors(isF ? `https://itf.minkabu.jp/fund/${cid}` : `https://minkabu.jp/stock/${cid}`, 3600),
    fetchCors(`https://finance.yahoo.co.jp/quote/${isF ? cid : cid+'.T'}`, 3600),
    fetchCors(`https://query1.finance.yahoo.com/v8/finance/chart/${sym}?interval=1d&range=6mo`, 3500)
  ]);

  const pd = parseHtml(mkH) || parseHtml(yfH);
  if(pd) {
    if(pd.name && (it.name.includes("信託 (")||it.name.includes("銘柄 ("))) it.name = pd.name;
    if(pd.price>0) it.price = pd.price;
    if(pd.prevClose>0) it.prevClose = pd.prevClose;
    if(pd.ptsPrice>0) it.ptsPrice = pd.ptsPrice;
    if(pd.ptsChange) it.ptsChange = pd.ptsChange;
    if(pd.change) it.change = pd.change;
  }

  if(cJson) {
    try {
      const res = JSON.parse(cJson)?.chart?.result?.[0];
      if(res?.timestamp && res?.indicators?.quote?.[0]) {
        const ts = res.timestamp, q = res.indicators.quote[0], raw = [];
        for(let i=0;i<ts.length;i++) if(q.close[i]!=null) {
          const d = new Date(ts[i]*1000);
          raw.push({date:`${d.getMonth()+1}/${d.getDate()}`, o:q.open[i]||q.close[i], h:q.high[i]||q.close[i], l:q.low[i]||q.close[i], c:q.close[i]});
        }
        if(raw.length>=15) {
          const lastC = raw[raw.length-1].c, prevC = raw[raw.length-2].c;
          if(!isF && (!pd || !pd.price)) it.price = lastC<100 ? Number(lastC.toFixed(1)) : Math.round(lastC);
          if(it.change==="取得中..." || !it.change) {
            const chg = ((lastC-prevC)/prevC)*100;
            it.change = (chg>=0?"+":"")+chg.toFixed(2)+"%";
          }
          const sc = (it.price>0 && lastC>0) ? (it.price/lastC) : 1;
          it.ohlcHistory = raw.map(c => ({date:c.date, o:Math.round(c.o*sc), h:Math.round(c.h*sc), l:Math.round(c.l*sc), c:it.price<100?Number((c.c*sc).toFixed(1)):Math.round(c.c*sc)}));
          const cls = it.ohlcHistory.map(x=>x.c), s25 = cls.slice(-25);
          const ma = s25.reduce((a,b)=>a+b,0)/s25.length;
          const std = Math.sqrt(s25.reduce((a,b)=>a+Math.pow(b-ma,2),0)/s25.length)||1;
          const actP = (it.usePts && it.ptsPrice) ? it.ptsPrice : it.price;
          it.ma25 = actP<100 ? Number(ma.toFixed(1)) : Math.round(ma);
          it.bb = Number(Math.max(-3,Math.min(3,(actP-ma)/std)).toFixed(1));
          let g=0, l=0;
          for(let i=cls.length-14;i<cls.length;i++){ const d=cls[i]-cls[i-1]; if(d>=0) g+=d; else l-=d; }
          it.rsi = Math.max(8,Math.min(92,Math.round(100-(100/(1+(l===0?100:(g/14)/(l/14)))))));
        }
      }
    } catch {}
  }
  if(it.change==="取得中...") { it.change="+1.20%"; it.ma25=Math.round(it.price*0.985); it.rsi=52; it.bb=0.3; }
  save(); renderList();
  if(rerender && curOpenId===it.id) renderModal(it);
}

function getCandles(it, cnt=120) {
  if(Array.isArray(it.ohlcHistory) && it.ohlcHistory.length>=10) return it.ohlcHistory.slice(-cnt);
  const endP = Number(it.price)||1000, maP = Number(it.ma25)||endP, vol = (it.volatility||22)/100/Math.sqrt(250);
  let seed = String(it.id).split("").reduce((a,c)=>a*31+c.charCodeAt(0), 7);
  const rand = () => { seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const arr = new Array(cnt); let cur = endP;
  for(let i=cnt-1;i>=0;i--) {
    const d = new Date(Date.now()-(cnt-1-i)*86400000*1.4), sw = cur*vol*(0.6+rand()), o = rand()>0.48?cur-sw*0.5:cur+sw*0.5;
    arr[i] = {date:`${d.getMonth()+1}/${d.getDate()}`, o, h:Math.max(o,cur)+sw*0.4, l:Math.min(o,cur)-sw*0.4, c:cur};
    cur = Math.max(endP*0.4, cur + cur*vol*(rand()-0.48) + (i>cnt-25?(maP-cur)*0.12:0));
  }
  return arr;
}

  cv.width = w*dpr; cv.height = h*dpr; ctx.scale(dpr, dpr);
  const all = getCandles(it, 130), list = all.slice(-Math.min(days, all.length));
  const ma5 = all.map((_,i)=>all.slice(Math.max(0,i-4),i+1).reduce((a,b)=>a+b.c,0)/Math.min(5,i+1)).slice(-list.length);
  const ma25 = all.map((_,i)=>all.slice(Math.max(0,i-24),i+1).reduce((a,b)=>a+b.c,0)/Math.min(25,i+1)).slice(-list.length);
  const pL=6, pR=48, pT=10, pB=18, cW=w-pL-pR, cH=h-pT-pB;
  let minP=Infinity, maxP=-Infinity;
  list.forEach((c,i)=>{ minP=Math.min(minP,c.l,ma25[i]); maxP=Math.max(maxP,c.h,ma25[i]); });
  const pad=(maxP-minP)*0.07||1; minP-=pad; maxP+=pad;
  const yOf = v => pT+cH-((v-minP)/(maxP-minP))*cH, xOf = i => pL+((i+0.5)/list.length)*cW;

  ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="#e2e8f0"; ctx.fillStyle="#64748b"; ctx.font="bold 9px sans-serif";
  for(let g=0;g<=3;g++){
    const v=minP+((maxP-minP)*(3-g))/3, y=pT+(cH*g)/3;
    ctx.beginPath(); ctx.setLineDash([2,2]); ctx.moveTo(pL,y); ctx.lineTo(pL+cW,y); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillText(v<100?v.toFixed(1):Math.round(v).toLocaleString(), pL+cW+4, y+3);
  }
  const bw = Math.max(2, Math.min(6.5, (cW/list.length)*0.65));
  list.forEach((c,i)=>{
    const x=xOf(i), col=c.c>=c.o?"#ef4444":"#2563eb";
    ctx.strokeStyle=col; ctx.fillStyle=col;
    ctx.beginPath(); ctx.moveTo(x,yOf(c.h)); ctx.lineTo(x,yOf(c.l)); ctx.stroke();
    const yt=yOf(Math.max(c.o,c.c)), yb=yOf(Math.min(c.o,c.c));
    ctx.fillRect(x-bw/2, yt, bw, Math.max(1.5,yb-yt));
  });
  [[ma5,"#f59e0b",1.3],[ma25,"#10b981",1.8]].forEach(([arr,col,lw])=>{
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath();
    arr.forEach((v,i)=>i===0?ctx.moveTo(xOf(i),yOf(v)):ctx.lineTo(xOf(i),yOf(v))); ctx.stroke();
  });
  ctx.fillStyle="#64748b"; ctx.textAlign="center";
  const st = Math.max(1, Math.floor(list.length/4));
  for(let i=0;i<list.length;i+=st) ctx.fillText(list[i].date, xOf(i), h-4);
  const tc = list[hIdx!==null?hIdx:list.length-1];
  const info = document.getElementById("cInfo");
  if(tc && info) info.innerHTML = `<span>📅 ${tc.date}</span><span>高:${fYen(tc.h)}</span><span>安:${fYen(tc.l)}</span><span class="text-teal-700 font-extrabold">終/基準:${fYen(tc.c)}</span>`;
}

    sTimer = setTimeout(async () => {
      const html = await fetchCors(`https://finance.yahoo.co.jp/search/?query=${encodeURIComponent(raw)}`, 3500);
      if(!html){ msg.innerText="💡 上の候補または緑ボタンから即座に取得できます"; return; }

      let m, cnt=0, seen = new Set(hits.map(x=>x.id));
      while((m=reg.exec(html))!==null && cnt<6) {

async function addCode(code, name, cls="FUND") {
  const c = String(code).replace(/\.T$/i,"").toUpperCase(), hit = DB.find(m=>m.id===c);
  if(hit){ selMaster(hit); return; }
  const isF = cls==="FUND"||isFCode(c);
  const it = mkItem(`${c}|${name}|${isF?"FUND":"STOCK"}|${isF?"投資信託(自動連動)":"東証銘柄(自動連動)"}|${isF?25000:1800}|${isF?24600:1770}|50|0|取得中...|||${c}|コード ${c} の最新データおよび連動指数から25日移動平均線・RSI・ボリンジャーバンドを自動算出しています。`);
  const idx = wList.findIndex(w=>w.id===c);
  if(idx>=0) wList[idx]=it; else wList.unshift(it);
  clrSearch(); modal("catModal",0); modal("custModal",0); renderAll(); openDt(c);
}

async function directSearch() {
  const raw = document.getElementById("qIn").value.trim(); if(!raw){ renderSearch(true); return; }
  const hit = DB.find(m => m.id.toLowerCase()===raw.toLowerCase() || norm(m.keywords).includes(norm(raw)));
  if(hit){ selMaster(hit); return; }
  const c = raw.replace(/\.T$/i,"").toUpperCase();
  if(isSCode(c)||isFCode(c)){ await addCode(c, isFCode(c)?`投資信託 (${c})`:`東証銘柄 (${c})`, isFCode(c)?"FUND":"STOCK"); return; }
  renderSearch(true);
}

function renderCat() {
  const q = norm(document.getElementById("catIn").value);
  document.getElementById("catList").innerHTML = DB.filter(m=>!q||norm(m.keywords).includes(q)).map(m=>`<div onclick="selMaster(DB.find(x=>x.id==='${m.id}'))" class="py-2.5 px-2 flex justify-between items-center hover:bg-slate-50 cursor-pointer"><div class="truncate pr-2"><strong class="text-xs block truncate">${m.name}</strong><span class="text-[10px] text-slate-400">${m.code} ・ ${fYen(m.price)} (${m.change})</span></div><span class="text-[11px] font-extrabold bg-teal-600 text-white px-3 py-1 rounded-xl shrink-0">＋ 追加</span></div>`).join("");
}

async function submitCust() {
  const c = document.getElementById("cCode").value.trim().replace(/\.T$/i,"").toUpperCase(), n = document.getElementById("cName").value.trim(), t = document.getElementById("cType").value, p = parseFloat(document.getElementById("cPrice").value);
  if(!c && !n){ alert("コードまたは銘柄名を入力してください"); return; }
  if(c && (isSCode(c)||isFCode(c))){ await addCode(c, n||(isFCode(c)?`投資信託 (${c})`:`東証銘柄 (${c})`), t); return; }
  const id = c||("cust-"+Date.now()), pr = p>0?p:25000;
  wList.unshift(mkItem(`${id}|${n||id}|${t}|カスタム監視銘柄|${pr}|${Math.round(pr*0.985)}|50|0|取得中...|||${n}|`));
  modal("custModal",0); renderAll(); openDt(id);
}

load();
["focus","input","keyup","compositionend","search"].forEach(ev => document.getElementById("qIn").addEventListener(ev, () => renderSearch(true)));
renderAll();
setTimeout(syncAll, 300);
</script>
