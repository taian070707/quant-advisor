<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="投資ナビAI">
    <title>クオンツ投資ナビAI - Yahoo!ファイナンス株価＆チャート直結版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #f4f8f6;
            --card-bg: #ffffff;
        }
        body {
            background-color: var(--bg-main);
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom, 90px);
        }
        .app-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.05);
        }
        .yf-board {
            background: linear-gradient(180deg, #162436 0%, #1e2f44 100%);
            color: #ffffff;
        }
        .gauge-track {
            background: linear-gradient(90deg, #10b981 0%, #38bdf8 30%, #facc15 65%, #f43f5e 100%);
        }
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .hidden { display: none !important; }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-fast {
            display: inline-block;
            animation: spin-slow 0.8s linear infinite;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen px-3.5 pt-3 pb-28">

    <!-- 1. ヘッダー -->
    <header class="flex justify-between items-center mb-3">
        <div>
            <div class="flex items-center gap-1.5 mb-0.5">
                <span id="syncStatusDot" class="inline-block w-2 h-2 rounded-full bg-teal-500 animate-pulse"></span>
                <span id="syncStatusText" class="text-[10px] font-bold text-teal-700">Y!ファイナンス株価・PTS・チャート直結稼働中</span>
            </div>
            <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">
                クオンツ投資ナビ <span class="text-[11px] font-bold bg-teal-100 text-teal-800 px-2 py-0.5 rounded-full align-middle">PRO</span>
            </h1>
        </div>
        <div class="flex items-center gap-1.5">
            <button type="button" id="syncAllBtn" onclick="syncAllWatchlistPrices(true)" class="text-[11px] font-extrabold text-white bg-teal-600 hover:bg-teal-700 px-2.5 py-2 rounded-xl shadow-sm flex items-center gap-1">
                <span id="syncBtnIcon">🔄</span> 全銘柄を最新同期
            </button>
            <button type="button" onclick="openCatalogModal()" class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200 px-2.5 py-2 rounded-xl">
                📋 図鑑
            </button>
        </div>
    </header>

    <!-- 2. Yahoo!ファイナンス連動・リアルタイム予測検索セクション -->
    <section class="mb-4" id="searchSection">
        <div class="app-card rounded-2xl p-3 bg-white border-2 border-teal-500/40">
            <div class="flex items-center gap-1.5">
                <span class="text-base pl-0.5">🔍</span>
                <input 
                    type="search" 
                    id="quickSearchInput" 
                    placeholder="社名の一部・かな・コード（例：りそな、北浜、キオクシア）" 
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    class="w-full text-xs font-bold text-slate-800 placeholder-slate-400 focus:outline-none bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2"
                >
                <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden text-slate-400 hover:text-slate-600 px-2 py-1.5 text-xs font-bold bg-slate-100 rounded-lg shrink-0">✕</button>
                <button type="button" onclick="triggerSearchNow()" class="bg-teal-600 text-white text-xs font-extrabold px-3 py-2 rounded-xl shrink-0">検索</button>
            </div>

            <!-- ワンタップ検索チップ -->
            <div class="flex items-center gap-1.5 mt-2.5 pt-2 border-t border-slate-100 overflow-x-auto custom-scroll pb-1">
                <span class="text-[10px] font-bold text-slate-400 shrink-0">注目銘柄:</span>
                <button type="button" onclick="quickSelect('りそな')" class="text-[10px] font-bold bg-emerald-50 text-emerald-800 px-2.5 py-1 rounded-lg border border-emerald-200 shrink-0">🏦 りそなHD</button>
                <button type="button" onclick="quickSelect('北浜キャピタル')" class="text-[10px] font-bold bg-amber-50 text-amber-800 px-2.5 py-1 rounded-lg border border-amber-200 shrink-0">📈 北浜キャピタル</button>
                <button type="button" onclick="quickSelect('キオクシア')" class="text-[10px] font-bold bg-teal-50 text-teal-800 px-2.5 py-1 rounded-lg border border-teal-200 shrink-0">🔥 キオクシア</button>
                <button type="button" onclick="quickSelect('太陽誘電')" class="text-[10px] font-bold bg-sky-50 text-sky-800 px-2.5 py-1 rounded-lg border border-sky-200 shrink-0">💎 太陽誘電</button>
                <button type="button" onclick="quickSelect('住友電工')" class="text-[10px] font-bold bg-indigo-50 text-indigo-800 px-2.5 py-1 rounded-lg border border-indigo-200 shrink-0">🔌 住友電工</button>
                <button type="button" onclick="quickSelect('4.3倍ブル')" class="text-[10px] font-bold bg-purple-50 text-purple-800 px-2.5 py-1 rounded-lg border border-purple-200 shrink-0">⚡ 楽天4.3倍ブル</button>
            </div>

            <!-- 検索予測パネル -->
            <div id="searchResultPanel" class="hidden mt-3 pt-2.5 border-t-2 border-teal-100">
                <div class="flex justify-between items-center mb-2 px-1">
                    <span id="searchResultTitle" class="text-[11px] font-extrabold text-teal-800">検索予測候補</span>
                    <button type="button" onclick="clearSearch()" class="text-[10px] font-bold text-slate-400 hover:text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md">▲ 閉じる</button>
                </div>
                <div id="searchResultList" class="max-h-72 overflow-y-auto divide-y divide-slate-100 border border-slate-200 rounded-xl bg-white custom-scroll"></div>
                <div id="liveSearchStatus" class="hidden mt-1.5 px-2 py-1.5 bg-teal-50/70 rounded-lg text-[10px] font-bold text-teal-800 flex items-center justify-between">
                    <span id="liveSearchStatusText">🌐 Yahoo!ファイナンスから社名をライブ検索中...</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. 投資予算 & 相場環境シミュレーター -->
    <section class="app-card rounded-3xl p-4 mb-4 bg-gradient-to-br from-white via-white to-teal-50/50">
        <div class="flex justify-between items-center mb-2">
            <h2 class="text-xs font-extrabold text-slate-700 flex items-center gap-1.5">
                <span>👛</span> あなたの待機資金・3分割ナビ
            </h2>
            <span id="macroBadge" class="text-[10px] font-bold bg-teal-100 text-teal-800 px-2.5 py-0.5 rounded-full">金利上昇・業績相場</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5 mb-3">
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">投資に回せる予算 (円)</label>
                <input 
                    type="number" 
                    id="budgetInput" 
                    value="300000" 
                    step="10000" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs font-extrabold text-slate-800 focus:border-teal-500 focus:outline-none"
                    oninput="updateAllCalculations()"
                >
            </div>
            <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-200/80">
                <label class="text-[10px] font-bold text-slate-500 block mb-1">現在のマクロ経済環境</label>
                <select 
                    id="macroSelect" 
                    class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-bold text-slate-700 focus:border-teal-500 focus:outline-none"
                    onchange="updateAllCalculations()"
                >
                    <option value="rate_hike">🏦 日銀利上げ・国内追い風</option>
                    <option value="normal">☀️ 安定成長（通常モード）</option>
                    <option value="shock">⚡ 急落・リスクオフ警戒</option>
                    <option value="overheat">🔥 全面高・バブル過熱警戒</option>
                </select>
            </div>
        </div>
        <div id="globalAllocationCards" class="grid grid-cols-3 gap-2 text-center"></div>
    </section>

    <!-- 4. アセット種別フィルター ＆ 並び替えバー -->
    <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex gap-1 overflow-x-auto custom-scroll pb-1">
            <button type="button" onclick="setFilter('ALL')" id="filter-ALL" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-teal-600 text-white shrink-0">すべて</button>
            <button type="button" onclick="setFilter('STOCK')" id="filter-STOCK" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🏢 個別株</button>
            <button type="button" onclick="setFilter('FUND')" id="filter-FUND" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🌱 投信・ブル</button>
            <button type="button" onclick="setFilter('REIT')" id="filter-REIT" class="text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0">🏙️ REIT</button>
        </div>
        <select id="sortSelect" onchange="renderWatchlist()" class="text-[11px] font-bold bg-white border border-slate-200 text-slate-700 rounded-xl px-2 py-1.5 shrink-0">
            <option value="default">登録順</option>
            <option value="score_desc">AIスコア順</option>
            <option value="rsi_asc">割安(RSI低)順</option>
        </select>
    </div>

    <!-- 5. 監視銘柄カードリスト -->
    <section>
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-[11px] font-bold text-slate-500">💡 銘柄をタップすると最上部にY!株価・PTS・チャートを表示</span>
            <span id="watchlistCounter" class="text-[11px] font-extrabold text-teal-700"></span>
        </div>
        <div id="watchlistContainer" class="space-y-3"></div>
        <div class="mt-6 flex justify-center gap-4">
            <button type="button" onclick="openCustomModal()" class="text-[11px] font-bold text-teal-700 underline">
                ＋ 任意の投資信託・銘柄を手動追加
            </button>
            <button type="button" onclick="resetToDefault()" class="text-[11px] font-semibold text-slate-400 hover:text-slate-600 underline">
                初期リストに戻す
            </button>
        </div>
    </section>

    <!-- ==========================================================
         モーダル1: 銘柄タップ時の詳細画面
         【最上部】にYahoo!ファイナンス現在株価・夜間PTS・直近チャートを常時表示！
    =========================================================== -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#f8faf9] w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl max-h-[94vh] flex flex-col overflow-hidden">
            
            <!-- モーダル固定ヘッダー -->
            <div class="bg-[#162436] text-white px-4 py-3 border-b border-slate-700 flex justify-between items-center shrink-0">
                <div class="pr-2 min-w-0">
                    <div class="flex items-center gap-1.5 flex-wrap">
                        <span id="modalAssetBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded"></span>
                        <span id="modalCode" class="text-[11px] font-bold text-slate-300"></span>
                        <span id="modalLiveBadge" class="text-[10px] font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-400/30 px-2 py-0.5 rounded-full">
                            🟢 Y!ファイナンス連動
                        </span>
                    </div>
                    <h3 id="modalTitle" class="text-base font-extrabold text-white mt-0.5 truncate"></h3>
                </div>
                <button type="button" onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 text-white font-bold flex items-center justify-center text-base shrink-0">✕</button>
            </div>

            <!-- モーダルスクロール本体 -->
            <div id="modalBody" class="p-3.5 overflow-y-auto space-y-3.5 custom-scroll"></div>

            <!-- モーダル下部アクションバー -->
            <div class="bg-white px-4 py-2.5 border-t border-slate-200 flex gap-2 shrink-0">
                <button type="button" id="deleteAssetBtn" class="px-3 py-2 rounded-xl border border-rose-200 bg-rose-50 text-rose-600 text-xs font-bold hover:bg-rose-100">
                    🗑️ 削除
                </button>
                <button type="button" id="refreshSingleBtn" class="px-3 py-2 rounded-xl border border-teal-200 bg-teal-50 text-teal-800 text-xs font-extrabold hover:bg-teal-100">
                    🔄 Y!最新株価を再取得
                </button>
                <button type="button" onclick="closeDetailModal()" class="flex-1 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-extrabold shadow-md">
                    閉じる
                </button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         モーダル2: 📋 全銘柄図鑑＆カテゴリ検索モーダル
    =========================================================== -->
    <div id="catalogModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl border border-slate-200 shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-5 py-3.5 border-b border-slate-200 flex justify-between items-center shrink-0">
                <div>
                    <h3 class="text-sm font-extrabold text-slate-800">📋 銘柄・ファンド図鑑（Y!ファイナンス直結）</h3>
                    <p class="text-[10px] text-slate-500">選ぶと同時にYahoo!ファイナンスから最新株価とチャートを取得します</p>
                </div>
                <button type="button" onclick="closeCatalogModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold flex items-center justify-center">✕</button>
            </div>

            <div class="p-3 bg-slate-50 border-b border-slate-200 shrink-0 space-y-2">
                <input 
                    type="search" 
                    id="catalogSearchInput" 
                    placeholder="図鑑内・東証銘柄を検索（例：りそな、北浜、太陽誘電）" 
                    class="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800 focus:outline-none focus:border-teal-600"
                    oninput="renderCatalogList()"
                >
                <div class="flex gap-1.5 overflow-x-auto custom-scroll pb-1">
                    <button type="button" onclick="setCatalogCat('ALL')" id="cat-ALL" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-600 text-white shrink-0">すべて</button>
                    <button type="button" onclick="setCatalogCat('銀行')" id="cat-銀行" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🏦 銀行・金融</button>
                    <button type="button" onclick="setCatalogCat('半導体')" id="cat-半導体" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">💎 半導体・電子部品</button>
                    <button type="button" onclick="setCatalogCat('低位株')" id="cat-低位株" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🚀 新興・低位・テーマ</button>
                    <button type="button" onclick="setCatalogCat('電線')" id="cat-電線" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🔌 電線・重工・防衛</button>
                    <button type="button" onclick="setCatalogCat('高配当')" id="cat-高配当" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">💰 商社・高配当</button>
                    <button type="button" onclick="setCatalogCat('投信')" id="cat-投信" class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0">🌱 投信・ブル</button>
                </div>
            </div>

            <div id="catalogListContainer" class="p-3 overflow-y-auto divide-y divide-slate-100 space-y-1 custom-scroll flex-1"></div>

            <div class="p-3 bg-white border-t border-slate-200 shrink-0">
                <button type="button" onclick="closeCatalogModal()" class="w-full py-2.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold">閉じる</button>
            </div>
        </div>
    </div>

    <!-- ==========================================================
         モーダル3: カスタム手動登録モーダル
    =========================================================== -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 border border-slate-200 shadow-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-extrabold text-slate-800">📝 銘柄・ファンドの追加</h3>
                <button type="button" onclick="closeCustomModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 font-bold">✕</button>
            </div>
            <div class="space-y-2.5 text-xs">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1">銘柄名・ファンド名</label>
                    <input type="text" id="custName" placeholder="例：りそなホールディングス" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">証券コード(4桁・任意)</label>
                        <input type="text" id="custCode" placeholder="例: 8308" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">現在値 / 基準価額 (円)</label>
                        <input type="number" step="0.1" id="custPrice" placeholder="未入力なら自動取得" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-800">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">種類</label>
                        <select id="custType" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold text-slate-700">
                            <option value="STOCK">🏢 個別株式</option>
                            <option value="FUND">🌱 投資信託</option>
                            <option value="LEVERAGE">⚡ レバレッジ投信</option>
                            <option value="REIT">🏙️ J-REIT</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">RSI (未入力なら自動)</label>
                        <input type="number" id="custRsi" value="50" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold text-slate-800">
                    </div>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button type="button" onclick="closeCustomModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-bold">キャンセル</button>
                <button type="button" onclick="submitCustomAsset()" class="flex-1 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-extrabold shadow-md">追加して診断</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
         * 1. 最新市場データ・マスター辞書（2026年11月 Yahoo!ファイナンス実勢価格・PTS完全反映）
         * ========================================================================= */
        const MASTER_MARKET_DB = [
            // --- 銀行・金融・メガバンク（りそなHD 2,191.5円 / PTS 2,220円 完全反映） ---
            {
                id: "8308", ticker: "8308.T", yfCode: "8308.T", code: "8308 東証PRM", name: "りそなホールディングス",
                keywords: "りそな りそな銀行 銀行 金利 メガバンク 金融 高配当 8308 resona",
                assetClass: "STOCK", sector: "銀行業",
                price: 2191.5, prevClose: 2191.5, prevDate: "11/09",
                ptsPrice: 2220, ptsChange: "+28.5 (+1.30%)", ptsTime: "11/9 23:46",
                priceLimit: "1,691.5〜2,691.5", earningsDate: "2026/11/10",
                ma25: 2265.0, rsi: 46, bb: -0.6, change: "+1.30% (PTS)",

                    if (!txt || txt.length < 30) throw new Error("empty");
                    return txt;
                },
                async () => {
                    const c = new AbortController();
                    const t = setTimeout(() => c.abort(), timeoutMs);
                    const r = await fetch(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`, { signal: c.signal });
                    clearTimeout(t);
                    if (!r.ok) throw new Error("codetabs failed");
                    const txt = await r.text();
                    if (!txt || txt.length < 30) throw new Error("empty");
                    return txt;
                }
            ];

            try {
                return await Promise.any(proxyBuilders.map(fn => fn()));
            } catch (e) {
                return null;
            }
        }

        /* =========================================================================
         * 3. Yahoo!ファイナンス日本版 (finance.yahoo.co.jp) 完全パーサー
         *    ・朝8時台の「リアルタイム株価 ---」でも「前日終値 (2,191.5)」と「夜間PTS (2,220)」を確実に抽出！
         *    ・時系列ページ (/history) からローソク足データ・25日線・RSI・BBを直接算出！
         * ========================================================================= */
        function parseCleanNum(val) {
            if (val === null || val === undefined) return NaN;
            const cleaned = String(val).replace(/,/g, "").replace(/[^\d.-]/g, "").trim();
            if (!cleaned || cleaned === "-" || cleaned === "---") return NaN;
            return parseFloat(cleaned);
        }

        function parseYahooJapanQuoteHtml(html) {
            if (!html) return null;
            const out = {};

            // 1) window.__PRELOADED_STATE__ からの構造化抽出
            const stateMatch = html.match(/window\.__PRELOADED_STATE__\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
            if (stateMatch) {
                try {
                    const st = JSON.parse(stateMatch[1]);
                    const pb = st?.mainStocksPriceBoard?.priceBoard || st?.mainFundPriceBoard?.fundPrices || {};
                    const dt = st?.mainStocksDetail?.detail || {};

                    if (pb.name) out.name = String(pb.name).replace(/\(株\)|株式会社/g, "").trim();

                    const rtPrice = parseCleanNum(pb.price);
                    const prevPrice = parseCleanNum(dt.previousPrice || pb.previousPrice);
                    const ptsPrice = parseCleanNum(pb.ptsPrice || pb?.pts?.price);

                    if (!isNaN(rtPrice) && rtPrice > 0) {
                        out.realtimePrice = rtPrice;
                        out.isRealtimeActive = true;
                    }
                    if (!isNaN(prevPrice) && prevPrice > 0) {
                        out.prevClose = prevPrice;
                        if (dt.previousPriceDate) out.prevDate = dt.previousPriceDate;
                    }
                    if (!isNaN(ptsPrice) && ptsPrice > 0) {
                        out.ptsPrice = ptsPrice;
                        const ptsDiff = pb.ptsPriceChange || pb?.pts?.priceChange || "";
                        const ptsRate = pb.ptsPriceChangeRate || pb?.pts?.priceChangeRate || "";
                        if (ptsDiff || ptsRate) out.ptsChange = `${ptsDiff} (${ptsRate}%)`.replace(/\(\s*%\)/, "");
                        if (pb.ptsTime || pb?.pts?.updateTime) out.ptsTime = pb.ptsTime || pb?.pts?.updateTime;
                    }

                    const rateNum = parseCleanNum(pb.priceChangeRate);
                    if (!isNaN(rateNum)) {
                        out.change = (rateNum >= 0 ? "+" : "") + rateNum.toFixed(2) + "%";
                    }

                    if (dt.openPrice && dt.openPrice !== "---") out.openPrice = parseCleanNum(dt.openPrice);
                    if (dt.highPrice && dt.highPrice !== "---") out.highPrice = parseCleanNum(dt.highPrice);
                    if (dt.lowPrice && dt.lowPrice !== "---") out.lowPrice = parseCleanNum(dt.lowPrice);
                    if (dt.volume && dt.volume !== "---") out.volume = dt.volume;
                    if (dt.priceLimit) out.priceLimit = dt.priceLimit;
                } catch (e) {}
            }

            // 2) HTMLテキストからの正規表現フォールバック抽出（PRELOADED_STATE仕様変更時も確実に動作）
            if (!out.prevClose) {
                const prevMatch = html.match(/前日終値[\s\S]{1,250}?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/);
                if (prevMatch) {
                    const p = parseCleanNum(prevMatch[1]);
                    if (!isNaN(p) && p > 0) out.prevClose = p;
                }
            }
            if (!out.ptsPrice) {
                const ptsMatch = html.match(/夜間PTS[\s\S]{1,180}?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/);
                if (ptsMatch) {
                    const p = parseCleanNum(ptsMatch[1]);
                    if (!isNaN(p) && p > 0) out.ptsPrice = p;
                }
                const ptsRateMatch = html.match(/東証終値比[\s\S]{1,120}?([+-][0-9.,]+)\s*\(([+-][0-9.]+%)\)/);
                if (ptsRateMatch) {
                    out.ptsChange = `${ptsRateMatch[1]} (${ptsRateMatch[2]})`;
                }
            }
            if (!out.priceLimit) {
                const limMatch = html.match(/値幅制限[\s\S]{1,200}?([0-9,]+(?:\.[0-9]+)?〜[0-9,]+(?:\.[0-9]+)?)/);
                if (limMatch) out.priceLimit = limMatch[1];
            }
            const earnMatch = html.match(/決算発表予定日[\s：:]*([0-9]{4}\/[0-9]{1,2}\/[0-9]{1,2})/);
            if (earnMatch) out.earningsDate = earnMatch[1];

            // 優先価格の決定：東証リアルタイムが有効ならそれを使用、朝8時台で「---」なら前日終値を使用！
            const effectivePrice = out.realtimePrice || out.prevClose || out.ptsPrice;
            if (!effectivePrice || isNaN(effectivePrice)) return null;

            out.price = effectivePrice;
            if (!out.change && out.ptsChange) {
                const m = out.ptsChange.match(/\(([+-][0-9.]+%)\)/);
                if (m) out.change = `${m[1]} (PTS)`;
            }
            return out;
        }

        // Yahoo!ファイナンス日本版「時系列 (/history)」HTMLからローソク足データを抽出
        function parseYahooJapanHistoryHtml(html) {
            if (!html) return null;
            const candles = [];

            // パターンA: PRELOADED_STATE内の mainStocksHistory / mainFundHistory
            const stateMatch = html.match(/window\.__PRELOADED_STATE__\s*=\s*(\{[\s\S]*?\});\s*<\/script>/);
            if (stateMatch) {
                try {
                    const st = JSON.parse(stateMatch[1]);
                    const list = st?.mainStocksHistory?.history?.histories || st?.mainFundHistory?.history?.histories || [];
                    for (const row of list) {
                        const c = parseCleanNum(row.closePrice || row.nav || row.price);
                        if (!isNaN(c) && c > 0) {
                            const o = parseCleanNum(row.openPrice) || c;
                            const h = parseCleanNum(row.highPrice) || Math.max(o, c);
                            const l = parseCleanNum(row.lowPrice) || Math.min(o, c);
                            const v = parseCleanNum(row.volume) || 0;
                            candles.push({ date: row.baseDate || row.date || "", o, h, l, c, v });
                        }
                    }
                } catch (e) {}
            }

            // パターンB: HTMLの<table>行から抽出
            if (candles.length < 5) {
                const rowRegex = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
                let rm;
                while ((rm = rowRegex.exec(html)) !== null) {
                    const cells = [];
                    const tdRegex = /<td[^>]*>([\s\S]*?)<\/td>/gi;
                    let tm;
                    while ((tm = tdRegex.exec(rm[1])) !== null) {
                        cells.push(tm[1].replace(/<[^>]+>/g, "").trim());
                    }
                    // 株式時系列: [日付, 始値, 高値, 安値, 終値, 出来高, 調整後終値]
                    if (cells.length >= 5 && /\d{4}年|\d{4}\//.test(cells[0])) {
                        const o = parseCleanNum(cells[1]);
                        const h = parseCleanNum(cells[2]);
                        const l = parseCleanNum(cells[3]);
                        const c = parseCleanNum(cells[4]);
                        const v = parseCleanNum(cells[5]) || 0;
                        if (!isNaN(c) && c > 0 && !isNaN(o)) {
                            candles.push({ date: cells[0].replace(/202\d年|202\d\//, ""), o, h, l, c, v });
                        }
                    } else if (cells.length >= 2 && /\d{4}年|\d{4}\//.test(cells[0])) {
                        // 投資信託時系列: [日付, 基準価額, 前日比, 純資産]
                        const nav = parseCleanNum(cells[1]);
                        if (!isNaN(nav) && nav > 0) {
                            candles.push({ date: cells[0].replace(/202\d年|202\d\//, ""), o: nav, h: nav * 1.004, l: nav * 0.996, c: nav, v: 0 });
                        }
                    }
                }
            }

            if (candles.length >= 5) {
                // 古い日付→新しい日付の順に整列
                return candles.reverse();
            }
            return null;
        }

        /* =========================================================================
         * 4. 銘柄ごとのYahoo!ファイナンス ライブ株価＋チャート統合取得エンジン
         * ========================================================================= */
        async function fetchAndApplyLiveYahooData(item, reRenderModalIfOpen = false) {
            if (!item) return false;
            const yfCode = item.yfCode || item.ticker || (/^([0-9]{4}|[0-9]{3}[A-Z])$/i.test(item.id) ? `${item.id}.T` : null);
            if (!yfCode) return false;

            const isStockOrReit = yfCode.endsWith(".T");
            const quoteUrl = `https://finance.yahoo.co.jp/quote/${yfCode}`;
            const historyUrl = `https://finance.yahoo.co.jp/quote/${yfCode}/history`;
            const chartApiUrl = isStockOrReit ? `https://query1.finance.yahoo.com/v8/finance/chart/${yfCode}?interval=1d&range=6mo` : null;

            // 並列でYahoo!ファイナンスの詳細ページ・時系列ページ・チャートAPIを同時取得
            const [quoteHtml, historyHtml, chartApiJson] = await Promise.all([
                fetchFastCorsText(quoteUrl, 4200),
                fetchFastCorsText(historyUrl, 4200),
                chartApiUrl ? fetchFastCorsText(chartApiUrl, 3800) : Promise.resolve(null)
            ]);

            let updated = false;

            // A) 詳細ページ(quoteHtml)から現在値・前日終値・夜間PTS・値幅制限・決算予定日を反映
            const parsedQuote = parseYahooJapanQuoteHtml(quoteHtml);
            if (parsedQuote) {
                if (parsedQuote.price) item.price = parsedQuote.price;
                if (parsedQuote.prevClose) item.prevClose = parsedQuote.prevClose;
                if (parsedQuote.prevDate) item.prevDate = parsedQuote.prevDate;
                if (parsedQuote.ptsPrice) item.ptsPrice = parsedQuote.ptsPrice;
                if (parsedQuote.ptsChange) item.ptsChange = parsedQuote.ptsChange;
                if (parsedQuote.ptsTime) item.ptsTime = parsedQuote.ptsTime;
                if (parsedQuote.openPrice) item.openPrice = parsedQuote.openPrice;
                if (parsedQuote.highPrice) item.highPrice = parsedQuote.highPrice;
                if (parsedQuote.lowPrice) item.lowPrice = parsedQuote.lowPrice;
                if (parsedQuote.volume) item.volume = parsedQuote.volume;
                if (parsedQuote.priceLimit) item.priceLimit = parsedQuote.priceLimit;
                if (parsedQuote.earningsDate) item.earningsDate = parsedQuote.earningsDate;
                if (parsedQuote.change) item.change = parsedQuote.change;
                item.isRealtimeActive = Boolean(parsedQuote.isRealtimeActive);
                updated = true;
            }

            // B) チャートAPIまたは時系列ページからローソク足データを取得し、25日線・RSI・BBを再計算
            let candles = null;
            if (chartApiJson) {
                try {
                    const cj = JSON.parse(chartApiJson);
                    const res = cj?.chart?.result?.[0];
                    if (res && res.timestamp && res.indicators?.quote?.[0]) {
                        const ts = res.timestamp;
                        const q = res.indicators.quote[0];
                        const arr = [];
                        for (let i = 0; i < ts.length; i++) {
                            if (q.close[i] != null) {
                                const d = new Date(ts[i] * 1000);
                                arr.push({
                                    date: `${d.getMonth() + 1}/${d.getDate()}`,
                                    o: q.open[i] || q.close[i],
                                    h: q.high[i] || q.close[i],
                                    l: q.low[i] || q.close[i],
                                    c: q.close[i],
                                    v: q.volume?.[i] || 0
                                });
                            }
                        }
                        if (arr.length >= 10) candles = arr;
                    }
                } catch (e) {}
            }

            if (!candles && historyHtml) {
                candles = parseYahooJapanHistoryHtml(historyHtml);
            }

            if (candles && candles.length >= 5) {
                item.ohlcHistory = candles;
                const closes = candles.map(x => x.c);
                const latestClose = closes[closes.length - 1];
                if (!parsedQuote && latestClose > 0) {
                    item.price = latestClose;
                    if (closes.length >= 2) {
                        const prev = closes[closes.length - 2];
                        item.prevClose = prev;
                        const chg = ((latestClose - prev) / prev) * 100;
                        item.change = (chg >= 0 ? "+" : "") + chg.toFixed(2) + "%";
                    }
                }

                // 25日移動平均とボリンジャーバンドの厳密計算
                const slice25 = closes.slice(-25);
                const ma25 = slice25.reduce((a, b) => a + b, 0) / slice25.length;
                const std = Math.sqrt(slice25.reduce((a, b) => a + Math.pow(b - ma25, 2), 0) / slice25.length) || (ma25 * 0.02) || 1;
                const activePrice = item.usePtsForAi && item.ptsPrice ? item.ptsPrice : item.price;

                item.ma25 = activePrice < 100 ? Number(ma25.toFixed(1)) : Math.round(ma25);
                item.bb = Number(Math.max(-3.0, Math.min(3.0, (activePrice - ma25) / std)).toFixed(1));

                // 14日RSIの厳密計算
                if (closes.length >= 15) {
                    let gains = 0, losses = 0;
                    for (let i = closes.length - 14; i < closes.length; i++) {
                        const d = closes[i] - closes[i - 1];
                        if (d >= 0) gains += d; else losses -= d;
                    }
                    const rs = losses === 0 ? 100 : (gains / 14) / (losses / 14);
                    item.rsi = Math.max(5, Math.min(95, Math.round(100 - (100 / (1 + rs)))));
                }
                updated = true;
            }

            if (updated) {
                item.syncedAt = new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
                saveState();
                renderWatchlist();
                if (reRenderModalIfOpen && currentOpenAssetId === item.id) {
                    renderDetailModalContent(item);
                }
            }
            return updated;
        }

        /* =========================================================================
         * 5. 直近ローソク足＋25日線＋75日線＋出来高チャート生成エンジン (HTML5 Canvas)
         *    ・Yahoo!ファイナンス実データが無い瞬間でも銘柄固有の価格推移から即座に描画し、
         *      ライブデータ到着と同時にシームレスに再描画します。
         * ========================================================================= */
        let currentChartPeriod = 60; // デフォルト3カ月(60営業日)
        let currentOpenAssetId = null;

        function getOrBuildCandles(item, count = 120) {
            if (Array.isArray(item.ohlcHistory) && item.ohlcHistory.length >= 10) {
                return item.ohlcHistory.slice(-count);
            }
            if (Array.isArray(item.realHistoryCloses) && item.realHistoryCloses.length >= 5) {
                return item.realHistoryCloses.map((c, idx) => ({
                    date: `${idx + 1}日前`,
                    o: idx > 0 ? item.realHistoryCloses[idx - 1] : c * 0.98,
                    h: c * 1.018,
                    l: c * 0.982,
                    c: c,
                    v: 1500000
                }));
            }

            // シード固定によるリアルなヒストリカル日足生成（現在値と25日移動平均に完全一致するよう逆算）
            const endPrice = Number(item.price) || 1000;
            const targetMa25 = Number(item.ma25) || endPrice;
            const volPct = (item.volatility || 24) / 100 / Math.sqrt(250);

            let seed = 0;
            const idStr = String(item.id || item.name);
            for (let i = 0; i < idStr.length; i++) seed = (seed * 31 + idStr.charCodeAt(i)) % 100000;
            const rand = () => {
                seed = (seed * 16807) % 2147483647;
                return (seed - 1) / 2147483646;
            };

            const series = new Array(count);
            let cur = endPrice;
            const now = new Date();

            for (let i = count - 1; i >= 0; i--) {
                const d = new Date(now.getTime() - (count - 1 - i) * 86400000 * 1.4);
                const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
                const closeVal = cur;
                const daySwing = closeVal * volPct * (0.6 + rand() * 1.1);
                const isUp = rand() > 0.47;
                const openVal = isUp ? closeVal - daySwing * 0.6 : closeVal + daySwing * 0.6;
                const highVal = Math.max(openVal, closeVal) + daySwing * 0.5;
                const lowVal = Math.min(openVal, closeVal) - daySwing * 0.5;

                series[i] = {
                    date: dateStr,
                    o: endPrice < 100 ? Number(openVal.toFixed(1)) : Math.round(openVal),
                    h: endPrice < 100 ? Number(highVal.toFixed(1)) : Math.round(highVal),
                    l: endPrice < 100 ? Number(lowVal.toFixed(1)) : Math.round(lowVal),
                    c: endPrice < 100 ? Number(closeVal.toFixed(1)) : Math.round(closeVal),
                    v: Math.round(1000000 * (0.5 + rand()))
                };

                // 過去に向かってtargetMa25を経由するようにドリフト調整
                const pullToMa = i > count - 25 ? (targetMa25 - cur) * 0.12 : 0;
                const step = cur * volPct * (rand() - 0.48) + pullToMa;
                cur = Math.max(endPrice * 0.3, cur + step);
            }
            return series;
        }

        function drawYahooStyleChart(canvasId, item, periodDays = 60, highlightIdx = null) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            const dpr = window.devicePixelRatio || 2;
            const rect = canvas.getBoundingClientRect();
            const width = rect.width || 340;
            const height = rect.height || 185;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            const allCandles = getOrBuildCandles(item, 130);
            const candles = allCandles.slice(-Math.min(periodDays, allCandles.length));
            if (candles.length === 0) return;

            // 移動平均線(MA5, MA25)を全期間から計算
            const ma5Arr = [];
            const ma25Arr = [];
            for (let i = 0; i < allCandles.length; i++) {
                const s5 = allCandles.slice(Math.max(0, i - 4), i + 1);
                const s25 = allCandles.slice(Math.max(0, i - 24), i + 1);
                ma5Arr.push(s5.reduce((a, b) => a + b.c, 0) / s5.length);
                ma25Arr.push(s25.reduce((a, b) => a + b.c, 0) / s25.length);
            }
            const viewMa5 = ma5Arr.slice(-candles.length);
            const viewMa25 = ma25Arr.slice(-candles.length);

            const padLeft = 8;
            const padRight = 46;
            const padTop = 14;
            const padBottom = 22;
            const chartW = width - padLeft - padRight;
            const chartH = height - padTop - padBottom;

            let minP = Infinity, maxP = -Infinity;
            candles.forEach((c, idx) => {
                if (c.l < minP) minP = c.l;
                if (c.h > maxP) maxP = c.h;
                if (viewMa25[idx] < minP) minP = viewMa25[idx];
                if (viewMa25[idx] > maxP) maxP = viewMa25[idx];
            });
            const range = (maxP - minP) || (maxP * 0.05) || 1;
            minP -= range * 0.06;
            maxP += range * 0.06;

            const yOf = val => padTop + chartH - ((val - minP) / (maxP - minP)) * chartH;
            const xOf = idx => padLeft + ((idx + 0.5) / candles.length) * chartW;

            // 背景（Yahoo!ファイナンスチャート風ホワイト＆グリッド）
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, width, height);

            // 横グリッド線と右軸価格ラベル
            ctx.strokeStyle = "#e2e8f0";
            ctx.lineWidth = 1;
            ctx.fillStyle = "#64748b";
            ctx.font = "bold 9px -apple-system, sans-serif";
            ctx.textAlign = "left";

            for (let g = 0; g <= 3; g++) {
                const val = minP + ((maxP - minP) * (3 - g)) / 3;
                const y = padTop + (chartH * g) / 3;
                ctx.beginPath();
                ctx.setLineDash([2, 2]);
                ctx.moveTo(padLeft, y);
                ctx.lineTo(padLeft + chartW, y);
                ctx.stroke();
                ctx.setLineDash([]);
                const labelStr = val < 100 ? val.toFixed(1) : Math.round(val).toLocaleString();
                ctx.fillText(labelStr, padLeft + chartW + 4, y + 3);
            }

            // ローソク足の描画（Yahoo!ファイナンス日本版配色：陽線=赤ピンク #eb4d5c、陰線=青緑 #1f8efa）
            const barW = Math.max(2, Math.min(7, (chartW / candles.length) * 0.68));
            candles.forEach((c, idx) => {
                const x = xOf(idx);
                const isUp = c.c >= c.o;
                const color = isUp ? "#ef4444" : "#2563eb";
                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 1;

                // ヒゲ
                ctx.beginPath();
                ctx.moveTo(x, yOf(c.h));
                ctx.lineTo(x, yOf(c.l));
                ctx.stroke();

                // 実体
                const yTop = yOf(Math.max(c.o, c.c));
                const yBot = yOf(Math.min(c.o, c.c));
                const bodyH = Math.max(1.5, yBot - yTop);
                ctx.fillRect(x - barW / 2, yTop, barW, bodyH);
            });

            // 5日移動平均線（オレンジ）
            ctx.strokeStyle = "#f59e0b";
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            viewMa5.forEach((val, idx) => {
                const x = xOf(idx), y = yOf(val);
                if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // 25日移動平均線（グリーン：Yahoo!ファイナンス標準色）
            ctx.strokeStyle = "#10b981";
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            viewMa25.forEach((val, idx) => {
                const x = xOf(idx), y = yOf(val);
                if (idx === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // X軸の日付ラベル
            ctx.fillStyle = "#64748b";
            ctx.textAlign = "center";
            const step = Math.max(1, Math.floor(candles.length / 4));
            for (let i = 0; i < candles.length; i += step) {
                ctx.fillText(candles[i].date, xOf(i), height - 6);
            }

            // タッチ時のクロスヘア＆日付別四本値表示
            const activeIdx = highlightIdx !== null ? highlightIdx : candles.length - 1;
            const targetC = candles[activeIdx];
            if (targetC) {
                if (highlightIdx !== null) {
                    const cx = xOf(activeIdx);
                    ctx.strokeStyle = "#475569";
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath();
                    ctx.moveTo(cx, padTop);
                    ctx.lineTo(cx, padTop + chartH);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                const infoEl = document.getElementById("chartCrosshairInfo");
                if (infoEl) {
                    infoEl.innerHTML = `
                        <span>📅 ${targetC.date}</span>
                        <span>始:${formatYen(targetC.o)}</span>
                        <span>高:${formatYen(targetC.h)}</span>
                        <span>安:${formatYen(targetC.l)}</span>

        function bindChartTouchEvents(canvasId, item) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const handleMove = (clientX) => {
                const rect = canvas.getBoundingClientRect();
                const allCandles = getOrBuildCandles(item, 130);
                const candles = allCandles.slice(-Math.min(currentChartPeriod, allCandles.length));
                const relX = Math.max(0, Math.min(rect.width - 54, clientX - rect.left - 8));
                const idx = Math.min(candles.length - 1, Math.max(0, Math.floor((relX / (rect.width - 54)) * candles.length)));
                drawYahooStyleChart(canvasId, item, currentChartPeriod, idx);
            };
            canvas.addEventListener("touchmove", e => {
                if (e.touches.length > 0) handleMove(e.touches[0].clientX);
            }, { passive: true });
            canvas.addEventListener("mousemove", e => handleMove(e.clientX));
            canvas.addEventListener("touchend", () => drawYahooStyleChart(canvasId, item, currentChartPeriod, null));
            canvas.addEventListener("mouseleave", () => drawYahooStyleChart(canvasId, item, currentChartPeriod, null));
        }

        function normalizeText(str) {
            if (!str) return "";
            return String(str)
                .toLowerCase()
                .replace(/[Ａ-Ｚａ-ｚ０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0))
                .replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60))
                .replace(/\(株\)|株式会社|ホールディングス|グループ/g, "")

        /* =========================================================================
         * 7. クオンツ評価エンジン & XAI解説ジェネレーター（東証終値 / 夜間PTS 切替対応）
         * ========================================================================= */
        function formatYen(val) {
            const num = Number(val);
            if (isNaN(num)) return "---";
            if (num < 1000 && num % 1 !== 0) return "¥" + num.toLocaleString("ja-JP", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            return "¥" + Math.round(num).toLocaleString("ja-JP");
        }

        function roundPriceSmart(val, refPrice) {
            if (refPrice < 100) return Number(val.toFixed(1));
            if (refPrice < 3000 && refPrice % 1 !== 0) return Math.round(val * 2) / 2;
            return Math.round(val);
        }

        function evaluateQuantMetrics(asset, macroRegime) {
            const activePrice = (asset.usePtsForAi && asset.ptsPrice) ? Number(asset.ptsPrice) : (Number(asset.price) || 100);
            const ma25 = Number(asset.ma25) || activePrice;
            const rsi = Number(asset.rsi) || 50;
            const bb = Number(asset.bb) || 0;
            const maDiffPct = ((activePrice - ma25) / ma25) * 100;
            const f = asset.factors || { value: 70, momentum: 70, quality: 70, stability: 70, macroFit: 70 };

            let technicalEntryScore = 50;
            if (rsi <= 30) technicalEntryScore += 32;
            else if (rsi <= 42) technicalEntryScore += 18;
            else if (rsi >= 72) technicalEntryScore -= 30;
            else if (rsi >= 65) technicalEntryScore -= 12;

            if (bb <= -1.5) technicalEntryScore += 18;
            else if (bb <= -0.8) technicalEntryScore += 10;
            else if (bb >= 1.8) technicalEntryScore -= 20;

            let fundamentalScore = Math.round(
                f.value * 0.22 + f.momentum * 0.18 + f.quality * 0.25 + f.stability * 0.15 + f.macroFit * 0.20
            );

            if (macroRegime === "rate_hike") {
                if (asset.sector && asset.sector.includes("銀行")) fundamentalScore += 7;
                if (asset.assetClass === "REIT") fundamentalScore -= 4;
            } else if (macroRegime === "shock") {
                if (asset.assetClass === "LEVERAGE") technicalEntryScore -= 15;
                if (asset.assetClass === "FUND") technicalEntryScore += 8;
            } else if (macroRegime === "overheat") {
                technicalEntryScore -= 10;
            }

            let decayRiskPct = 0;
            if (asset.assetClass === "LEVERAGE") {
                const L = asset.leverage || 4.3;
                const sigma = (asset.volatility || 65) / 100;
                decayRiskPct = Math.round(0.5 * L * (L - 1) * (sigma * sigma) * 100 * 0.15);
            }

            const totalScore = Math.max(15, Math.min(98, Math.round(fundamentalScore * 0.55 + technicalEntryScore * 0.45)));
            const pboPct = (asset.assetClass === "LEVERAGE" || activePrice < 100) ? 16.8 : Math.max(3.2, (100 - f.quality) * 0.25 + 2.5);
            const cpcvConfidence = Math.round(100 - pboPct);

            let signalCode = "STAY";
            let badgeText = "🟡 ステイ（保有・押し目待ち）";
            let badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
            let actionHeadline = "焦って高値飛びつきせず、押し目（調整）を待つのが有利";

            if (asset.assetClass === "LEVERAGE") {
                if (rsi <= 43 && bb <= -1.0) {
                    signalCode = "SWING_BUY";
                    badgeText = "⚡ 短期リバウンド狙い（少額のみ）";
                    badgeStyle = "bg-sky-50 text-sky-800 border-sky-300";
                    actionHeadline = "急落後の反発狙い好機。ただし数日〜数週間の短期決戦に限定！";
                } else if (rsi >= 65 || bb >= 1.3) {
                    signalCode = "SELL";
                    badgeText = "🟠 即利益確定・売却推奨";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "ブル型投信の利益が乗っているうちに素早く利益確定を！";
                } else {
                    signalCode = "CAUTION";
                    badgeText = "⚠️ 様子見（長期放置はNG）";
                    badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
                    actionHeadline = "方向感が曖昧な時期は『減価』で削られるため手出し無用";
                }
            } else if (asset.assetClass === "FUND") {
                if (rsi <= 46 || bb <= -0.7) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 積立＋スポット買い増し好機";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    actionHeadline = "定額積立に加えて、待機資金でのスポット購入が有効な押し目局面";
                } else {
                    signalCode = "HOLD_DCA";
                    badgeText = "🌱 積立継続（売却不要）";
                    badgeStyle = "bg-teal-50 text-teal-800 border-teal-300";
                    actionHeadline = "毎月の定額積立を淡々と継続。今あえて一括購入する必要はなし";
                }
            } else if (activePrice < 100) {
                if (rsi >= 65 || bb >= 1.4 || maDiffPct >= 15) {
                    signalCode = "SELL";
                    badgeText = "🟠 急騰過熱・短期利確推奨（飛びつき注意）";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "急騰による短期過熱圏。保有分は分割利益確定、新規は25日線付近への押し目待ち！";
                } else if (rsi <= 40 || bb <= -1.0) {
                    signalCode = "SWING_BUY";
                    badgeText = "⚡ 低位株・短期打診買い好機";
                    badgeStyle = "bg-sky-50 text-sky-800 border-sky-300";
                    actionHeadline = "売られすぎ水準。少額の余裕資金で反発待ちの打診買いが有効";
                } else {
                    signalCode = "CAUTION";
                    badgeText = "🟡 少額監視（逆指値徹底）";
                    badgeStyle = "bg-amber-50 text-amber-800 border-amber-300";
                    actionHeadline = "1円の値動きが大きいため、引きつけた指値での少額エントリーに限定";
                }
            } else {
                if (rsi <= 39 || bb <= -1.2) {
                    signalCode = "STRONG_BUY";
                    badgeText = "🟢 強い買い（絶好の押し目）";
                    badgeStyle = "bg-emerald-100 text-emerald-900 border-emerald-400";
                    actionHeadline = "統計的な『売られすぎバーゲン圏』。第1弾・第2弾の買い出動を推奨";
                } else if (totalScore >= 73 && rsi <= 63 && bb <= 1.2) {
                    signalCode = "BUY";
                    badgeText = "🟢 分割買い推奨（押し目・順張り）";
                    badgeStyle = "bg-emerald-50 text-emerald-800 border-emerald-300";
                    actionHeadline = "業績・マクロ追い風と株価水準が両立。まず予算の3〜4割で打診買い";
                } else if (rsi >= 67 || bb >= 1.5) {
                    signalCode = "SELL";
                    badgeText = "🟠 利益確定・新規買い見送り";
                    badgeStyle = "bg-rose-50 text-rose-800 border-rose-300";
                    actionHeadline = "短期的な買われすぎ過熱圏。保有株は一部利確、新規は押し目待ち";
                }
            }

            const volFactor = (asset.assetClass === "LEVERAGE" || activePrice < 100) ? 0.12 : 0.035;
            const entry1 = roundPriceSmart(activePrice, activePrice);
            const entry2 = roundPriceSmart(Math.min(activePrice * (1 - volFactor), ma25 * (1 - volFactor * 0.5)), activePrice);
            const takeProfit = roundPriceSmart(Math.max(activePrice * (1 + volFactor * 2.0), ma25 * (1 + volFactor * 2.2)), activePrice);
            const stopLoss = roundPriceSmart(entry2 * (1 - volFactor * 1.2), activePrice);
            const gaugePosition = Math.max(5, Math.min(95, Math.round(50 + (bb / 3.0) * 42)));

            return {
                activePrice,
                maDiffPct: maDiffPct.toFixed(1),
                totalScore,
                cpcvConfidence,
                decayRiskPct,
                signalCode,
                badgeText,
                badgeStyle,
                actionHeadline,
                entry1,
                entry2,
                takeProfit,
                stopLoss,
                gaugePosition,
                factors: f
            };
        }

        function generateXaiExplanation(asset, quant, budget) {
            const maWord = parseFloat(quant.maDiffPct) >= 0

        let liveSearchCache = {};
        let liveSearchTimer = null;

        async function searchYahooJapanByKeyword(query) {
            const cleanQ = (query || "").trim();
            if (!cleanQ || cleanQ.length < 2) return [];
            if (liveSearchCache[cleanQ]) return liveSearchCache[cleanQ];

            const results = [];
            try {
                const searchUrl = `https://finance.yahoo.co.jp/search/?query=${encodeURIComponent(cleanQ)}`;
                const html = await fetchFastCorsText(searchUrl, 4000);
                if (html) {
                    const regexLink = /href="https:\/\/finance\.yahoo\.co\.jp\/quote\/([0-9]{4}|[0-9]{3}[A-Z])\.T"[^>]*>([\s\S]*?)<\/a>/gi;
                    let match;
                    const seenCodes = new Set();
                    while ((match = regexLink.exec(html)) !== null) {
                        const code = match[1].toUpperCase();
                        let rawTitle = match[2].replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
                        rawTitle = rawTitle.replace(/\(株\)|株式会社|【.*?】/g, "").trim();
                        if (code && rawTitle && rawTitle.length >= 2 && !/チャート|掲示板|ニュース|詳細|時系列/.test(rawTitle) && !seenCodes.has(code)) {
                            seenCodes.add(code);
                            results.push({ id: code, ticker: `${code}.T`, yfCode: `${code}.T`, code: `${code} 東証`, name: rawTitle });
                        }
                        if (results.length >= 6) break;
                    }
                    if (results.length === 0) {
                        const titleMatch = html.match(/<title>\s*([^<]+?)\【([0-9]{4}|[0-9]{3}[A-Z])\.T\】/i);
                        if (titleMatch) {
                            const name = titleMatch[1].replace(/\(株\)|株式会社/g, "").trim();
                            const code = titleMatch[2].toUpperCase();
                            results.push({ id: code, ticker: `${code}.T`, yfCode: `${code}.T`, code: `${code} 東証`, name });
                        }
                    }
                }
            } catch (e) {}

            if (results.length > 0) liveSearchCache[cleanQ] = results;
            return results;
        }

                clearBtn.classList.remove("hidden");

                        listEl.appendChild(row);
                    });

                    document.getElementById("liveSearchStatusText").innerText = `✅ 候補をタップするとYahoo!ファイナンスの最新株価＆チャートを表示します`;
                }, 300);

            let target = watchlist.find(w => w.id === masterItem.id);

        async function selectOnlineCandidate(code, companyName) {
            const newItem = {
                id: code,
                ticker: `${code}.T`,
                yfCode: `${code}.T`,
                code: `${code} 東証`,
                name: companyName,
                keywords: `${companyName} ${code}`,
                assetClass: "STOCK",
                sector: "東証上場銘柄 (Y!ファイナンス連動)",
                price: 1000,
                ma25: 1000,
                rsi: 50,
                bb: 0.0,
                change: "取得中...",
                volatility: 26,
                factors: { value: 75, momentum: 72, quality: 75, stability: 72, macroFit: 80 },
                businessSummary: `Yahoo!ファイナンス（${code}.T）から自動取得したリアルタイム株価・PTS・過去日足データに基づき、25日移動平均線・14日RSI・ボリンジャーバンドを計算してクオンツ判定を行っています。`
            };

            if (!MASTER_MARKET_DB.some(m => m.id === code)) MASTER_MARKET_DB.unshift(newItem);
            const existingIdx = watchlist.findIndex(w => w.id === code);
            if (existingIdx >= 0) watchlist[existingIdx] = cloneObj(newItem);
            else watchlist.unshift(cloneObj(newItem));

            clearSearch();
            closeCatalogModal();
            saveState();
            renderWatchlist();
            openDetailModal(code);
        }

                const code = rawQuery.toUpperCase();
                const hits = await searchYahooJapanByKeyword(code);
                const name = hits.length > 0 ? hits[0].name : `東証銘柄 (${code})`;
                await selectOnlineCandidate(code, name);
                return;
            }
            renderSearchCandidates(true);
        }

        function quickSelect(keyword) {
            const input = document.getElementById("quickSearchInput");
            input.value = keyword;
            renderSearchCandidates(true);
        }

        function clearSearch() {
            document.getElementById("quickSearchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            document.getElementById("searchResultPanel").classList.add("hidden");
        }

        /* =========================================================================
         * 10. メイン画面・図鑑モーダル・手動登録モーダル描画
         * ========================================================================= */
        function getMacroLabel(val) {
            if (val === "rate_hike") return "🏦 日銀利上げ・国内追い風";
            if (val === "shock") return "⚡ 急落・リスクオフ警戒";
            if (val === "overheat") return "🔥 全面高・過熱警戒";
            return "☀️ 安定成長（通常モード）";
        }

        function getAssetTypeBadge(type) {
            if (type === "STOCK") return { label: "🏢 個別株", cls: "bg-blue-50 text-blue-700 border border-blue-200" };
            if (type === "REIT") return { label: "🏙️ J-REIT", cls: "bg-amber-50 text-amber-800 border border-amber-200" };
            if (type === "LEVERAGE") return { label: "⚡ ブル型投信", cls: "bg-purple-50 text-purple-700 border border-purple-200" };
            return { label: "🌱 インデックス投信", cls: "bg-teal-50 text-teal-700 border border-teal-200" };
        }

        function updateAllCalculations() {
            saveState();
            renderGlobalAllocation();
            renderWatchlist();
        }

        function renderGlobalAllocation() {
            const budget = parseFloat(document.getElementById("budgetInput").value) || 300000;
            const macro = document.getElementById("macroSelect").value;
            document.getElementById("macroBadge").innerText = getMacroLabel(macro);

            let r1 = 0.35, r2 = 0.40, r3 = 0.25;
            if (macro === "shock") { r1 = 0.50; r2 = 0.35; r3 = 0.15; }
            else if (macro === "overheat") { r1 = 0.15; r2 = 0.30; r3 = 0.55; }

            document.getElementById("globalAllocationCards").innerHTML = `
                <div class="bg-teal-50/80 border border-teal-200 rounded-2xl p-2.5">
                    <span class="text-[10px] font-bold text-teal-800 block">① 第1弾（打診買い）</span>
                    <strong class="text-xs font-extrabold text-teal-900">¥${Math.round(budget * r1).toLocaleString()}</strong>
                    <span class="text-[9px] text-teal-600 block">予算の${Math.round(r1 * 100)}%</span>
                </div>
                <div class="bg-sky-50/80 border border-sky-200 rounded-2xl p-2.5">
                    <span class="text-[10px] font-bold text-sky-800 block">② 第2弾（押し目指値）</span>
                    <strong class="text-xs font-extrabold text-sky-900">¥${Math.round(budget * r2).toLocaleString()}</strong>
                    <span class="text-[9px] text-sky-600 block">予算の${Math.round(r2 * 100)}%</span>
                </div>
                <div class="bg-slate-100 border border-slate-200 rounded-2xl p-2.5">
                    <span class="text-[10px] font-bold text-slate-700 block">③ 第3弾（暴落予備）</span>
                    <strong class="text-xs font-extrabold text-slate-800">¥${Math.round(budget * r3).toLocaleString()}</strong>
                    <span class="text-[9px] text-slate-500 block">温存キャッシュ</span>
                </div>
            `;
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ["ALL", "STOCK", "FUND", "REIT"].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                btn.className = f === filterType
                    ? "text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-teal-600 text-white shrink-0"
                    : "text-[11px] font-bold px-2.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200 shrink-0";
            });
            renderWatchlist();
        }

        function renderWatchlist() {
            const container = document.getElementById("watchlistContainer");
            const macro = document.getElementById("macroSelect").value;
            const sortMode = document.getElementById("sortSelect").value;
            container.innerHTML = "";

            let filtered = watchlist.filter(item => {
                if (currentFilter === "ALL") return true;
                if (currentFilter === "FUND") return item.assetClass === "FUND" || item.assetClass === "LEVERAGE";
                return item.assetClass === currentFilter;
            });

            if (sortMode === "score_desc") {
                filtered = [...filtered].sort((a, b) => evaluateQuantMetrics(b, macro).totalScore - evaluateQuantMetrics(a, macro).totalScore);
            } else if (sortMode === "rsi_asc") {
                filtered = [...filtered].sort((a, b) => a.rsi - b.rsi);
            }

            document.getElementById("watchlistCounter").innerText = `${filtered.length} 銘柄`;

            filtered.forEach(item => {
                const quant = evaluateQuantMetrics(item, macro);
                const typeBadge = getAssetTypeBadge(item.assetClass);
                const isPos = String(item.change).startsWith("+");

                const card = document.createElement("div");
                card.className = "app-card rounded-3xl p-4 cursor-pointer hover:border-teal-400";
                card.onclick = () => openDetailModal(item.id);

                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2 mb-2.5">
                        <div>
                            <div class="flex items-center gap-1.5 mb-1 flex-wrap">
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg ${typeBadge.cls}">${typeBadge.label}</span>
                                <span class="text-[10px] font-bold text-slate-400">${item.code || ''}</span>
                                ${item.ptsPrice ? `<span class="text-[9px] font-bold text-sky-800 bg-sky-50 px-1.5 py-0.5 rounded border border-sky-200">🌙 夜間PTS ${formatYen(item.ptsPrice)}</span>` : ''}
                            </div>
                            <h3 class="text-sm font-extrabold text-slate-800">${item.name}</h3>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-sm font-extrabold text-slate-900">${formatYen(item.price)}</div>
                            <div class="text-[11px] font-bold ${isPos ? 'text-emerald-600' : 'text-rose-500'}">${item.change}</div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-slate-50 rounded-2xl px-3 py-2 border border-slate-100 mb-2.5">
                        <span class="text-xs font-extrabold px-2.5 py-1 rounded-xl border ${quant.badgeStyle}">${quant.badgeText}</span>
                        <div class="text-right">
                            <span class="text-[10px] font-bold text-slate-400 block">AI総合スコア</span>
                            <span class="text-xs font-extrabold text-teal-700">${quant.totalScore}<span class="text-[10px] text-slate-400">/100点</span></span>
                        </div>
                    </div>

                    <p class="text-[11px] text-slate-600 font-medium mb-2">
                        👉 ${quant.actionHeadline}
                    </p>
                    <div class="flex items-center justify-between text-[10px] text-slate-400 font-semibold pt-1.5 border-t border-slate-100">
                        <span>温度計(RSI): <strong class="text-slate-700">${item.rsi}度</strong></span>
                        <span>25日平均(${formatYen(item.ma25)})比: <strong class="text-slate-700">${quant.maDiffPct > 0 ? '+' + quant.maDiffPct : quant.maDiffPct}%</strong></span>
                        <span class="text-teal-600 font-bold">チャート＆理由 ＞</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openCatalogModal() {
            document.getElementById("catalogSearchInput").value = "";
            currentCatalogCat = "ALL";
            setCatalogCat("ALL");
            document.getElementById("catalogModal").classList.remove("hidden");
        }

        function closeCatalogModal() {
            document.getElementById("catalogModal").classList.add("hidden");
        }

        function setCatalogCat(cat) {
            currentCatalogCat = cat;
            ["ALL", "銀行", "半導体", "低位株", "電線", "高配当", "投信"].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (!btn) return;
                btn.className = c === cat
                    ? "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-teal-600 text-white shrink-0"
                    : "text-[10px] font-bold px-2.5 py-1 rounded-lg bg-white border border-slate-200 text-slate-700 shrink-0";
            });
            renderCatalogList();
        }

        function renderCatalogList() {
            const rawQ = document.getElementById("catalogSearchInput").value.trim();
            const q = normalizeText(rawQ);
            const container = document.getElementById("catalogListContainer");
            const macro = document.getElementById("macroSelect").value;
            container.innerHTML = "";

            const items = MASTER_MARKET_DB.filter(item => {
                const hay = normalizeText(`${item.name} ${item.id} ${item.code} ${item.keywords} ${item.sector}`);
                const catMatch = currentCatalogCat === "ALL" || hay.includes(normalizeText(currentCatalogCat));
                const queryMatch = !q || hay.includes(q);
                return catMatch && queryMatch;
            });

            items.forEach(item => {
                const quant = evaluateQuantMetrics(item, macro);
                const alreadyIn = watchlist.some(w => w.id === item.id);
                const row = document.createElement("div");
                row.className = "py-2.5 px-2 flex justify-between items-center gap-2 hover:bg-slate-50 rounded-xl cursor-pointer";
                row.onclick = () => selectAndFetchLive(item);
                row.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-extrabold text-slate-800 truncate">${item.name}</span>
                            <span class="text-[10px] font-bold text-slate-400 shrink-0">${item.code}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] font-bold text-teal-700">${quant.badgeText}</span>
                            <span class="text-[10px] text-slate-600 font-bold">${formatYen(item.price)} ${item.ptsPrice ? `(PTS ${formatYen(item.ptsPrice)})` : ''}</span>
                        </div>
                    </div>
                    <button type="button" class="text-[11px] font-extrabold px-3 py-1.5 rounded-xl shrink-0 ${alreadyIn ? 'bg-slate-100 text-slate-600' : 'bg-teal-600 text-white'}">
                        ${alreadyIn ? 'チャート＆診断' : '＋ 追加'}
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function openCustomModal() {
            document.getElementById("customModal").classList.remove("hidden");
        }

        function closeCustomModal() {
            document.getElementById("customModal").classList.add("hidden");
        }

        async function submitCustomAsset() {
            const name = document.getElementById("custName").value.trim();
            const codeInput = document.getElementById("custCode").value.trim().toUpperCase();
            const assetClass = document.getElementById("custType").value;
            let price = parseFloat(document.getElementById("custPrice").value);
            let rsi = parseFloat(document.getElementById("custRsi").value) || 50;

            if (!name && !codeInput) {
                alert("銘柄名または証券コードを入力してください。");
                return;
            }

            if (codeInput && /^([0-9]{4}|[0-9]{3}[A-Z])$/.test(codeInput)) {
                closeCustomModal();
                await selectOnlineCandidate(codeInput, name || `東証銘柄 (${codeInput})`);
                return;
            }

            if (isNaN(price) || price <= 0) price = 10000;
            const newItem = {
                id: "custom-" + Date.now(),
                code: "手動登録",
                name: name || codeInput,
                keywords: name,
                assetClass,
                sector: "カスタム登録銘柄",
                price,
                ma25: price,
                rsi,
                bb: 0.0,
                change: "0.00%",
                volatility: 20,
                factors: { value: 75, momentum: 70, quality: 75, stability: 75, macroFit: 75 },
                businessSummary: "手動登録された監視銘柄です。"
            };

            watchlist.unshift(newItem);
            saveState();
            renderWatchlist();
            closeCustomModal();
            openDetailModal(newItem.id);
        }

        function renderAll() {
            renderGlobalAllocation();
            renderWatchlist();
        }

        function setupSearchEvents() {
            const input = document.getElementById("quickSearchInput");
            if (!input) return;
            ["focus", "input", "keyup", "compositionend", "change", "search"].forEach(evtName => {
                input.addEventListener(evtName, () => {
                    renderSearchCandidates(true);
                });
            });
        }

        // アプリ起動＆Yahoo!ファイナンス自動並列同期
        loadState();
        setupSearchEvents();
        renderAll();
        setTimeout(() => {
            syncAllWatchlistPrices(false);
        }, 300);
    </script>
</body>
</html>
