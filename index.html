<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クオンツ投資アドバイザー - やさしい市場診断</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { 
            background: linear-gradient(180deg, #f0fdf4 0%, #f8fafc 100%); 
            color: #1e293b; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
            min-height: 100vh;
        }
        .soft-card { 
            background: #ffffff; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 4px 20px -2px rgba(16, 185, 129, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04); 
        }
        .card-press:active {
            transform: scale(0.985);
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto pb-24">

    <!-- ヘッダー -->
    <header class="flex justify-between items-center mb-5 pt-2">
        <div>
            <div class="flex items-center gap-1.5 mb-0.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-[11px] font-bold text-emerald-700 tracking-wider">統計データ解析中</span>
            </div>
            <h1 class="text-xl font-extrabold text-slate-800">投資アドバイザー</h1>
        </div>
        <button onclick="openSearchModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-2xl text-xs font-bold transition flex items-center gap-1.5 shadow-md shadow-emerald-600/20 active:scale-95">
            <span>🔍</span> 銘柄を探す
        </button>
    </header>

    <!-- 待機資金・安心エントリー配分シミュレーター -->
    <section class="soft-card rounded-3xl p-4 mb-5 border-emerald-100 bg-white/90 backdrop-blur">
        <div class="flex items-center justify-between mb-2">
            <h2 class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                <span>💡</span> 失敗しない資金配分プラン
            </h2>
            <span class="text-[10px] text-emerald-800 font-semibold bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">一括投資を避ける設計</span>
        </div>
        <p class="text-[11px] text-slate-500 mb-3">相場の波に慌てないよう、資金を3回に分けてエントリーする目安です。</p>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <div>
                <label class="text-[10px] text-slate-500 block mb-1 font-medium">投資する予定の資金 (円)</label>
                <input type="number" id="capitalInput" value="300000" step="10000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-800 font-bold focus:border-emerald-500 focus:bg-white outline-none transition" oninput="calculateAllocation()">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1 font-medium">いまの市場の雰囲気</label>
                <select id="marketMood" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 text-xs text-slate-700 font-medium focus:border-emerald-500 focus:bg-white outline-none transition" onchange="calculateAllocation()">
                    <option value="normal">穏やか（通常）</option>
                    <option value="panic">急落（バーゲン局面）</option>
                    <option value="hot">過熱気味（高値圏）</option>
                </select>
            </div>
        </div>

        <div id="allocationDisplay" class="grid grid-cols-3 gap-2 text-center bg-slate-50 p-2.5 rounded-2xl border border-slate-100 text-xs">
            <!-- JSで動的計算 -->
        </div>
    </section>

    <!-- 監視銘柄リスト -->
    <section>
        <div class="flex justify-between items-center mb-3">
            <div>
                <h2 class="text-xs font-bold text-slate-700">📊 注目銘柄・ファンド一覧</h2>
                <p class="text-[10px] text-slate-400">タップすると「なぜその判断なのか」の詳しい理由が表示されます</p>
            </div>
            <span id="watchlistCount" class="text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100"></span>
        </div>
        <div id="watchlistContainer" class="space-y-2.5">
            <!-- JSで動的生成 -->
        </div>
    </section>

    <!-- 銘柄検索・追加モーダル -->
    <div id="searchModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-5 w-full max-w-sm border border-slate-100 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                    <span>🔍</span> 銘柄・ファンドの検索
                </h3>
                <button onclick="closeSearchModal()" class="text-slate-400 hover:text-slate-600 text-lg w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100">×</button>
            </div>
            <p class="text-[11px] text-slate-500 mb-3">
                名前の一部（例: 「りそな」「ブル」「ソニー」）を入力すると候補が表示されます。
            </p>

            <div class="relative mb-3">
                <input type="text" id="searchInput" placeholder="銘柄名を入力..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-800 focus:border-emerald-500 focus:bg-white outline-none" oninput="filterSuggestions()">
                <div id="suggestionsBox" class="absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl max-h-48 overflow-y-auto z-20 hidden shadow-xl divide-y divide-slate-100"></div>
            </div>

            <div id="selectedPreview" class="bg-slate-50 p-3 rounded-2xl border border-slate-200 mb-4 hidden space-y-1.5 text-xs">
                <div class="font-bold text-slate-800" id="previewName"></div>
                <div class="text-slate-500 text-[11px]" id="previewMeta"></div>
            </div>

            <div class="flex gap-2">
                <button onclick="closeSearchModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-xs font-bold transition">閉じる</button>
                <button onclick="addSelectedAsset()" id="addBtn" disabled class="flex-1 bg-emerald-600 disabled:opacity-40 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-md shadow-emerald-600/20">リストに追加</button>
            </div>
        </div>
    </div>

    <!-- 初心者向けXAI詳細診断モーダル -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-5 w-full max-w-sm border border-slate-100 shadow-2xl max-h-[88vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1.5">
                    <span class="text-base" id="detailIcon">📊</span>
                    <h3 id="detailTitle" class="text-sm font-extrabold text-slate-800"></h3>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-lg w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100">×</button>
            </div>

            <div id="detailContent" class="space-y-3 text-xs">
                <!-- 動的に生成 -->
            </div>

            <button onclick="closeDetailModal()" class="w-full mt-4 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-bold transition text-xs">
                閉じる
            </button>
        </div>
    </div>

    <script>
        // 日本市場データ & 明確な推論理由データベース
        const marketDatabase = [
            {
                name: "りそなホールディングス (8308)",
                type: "個別株",
                price: 1145,
                change: "+1.42%",
                status: "buy",
                badge: "押し目買い好機",
                badgeColor: "bg-emerald-50 text-emerald-700 border-emerald-200",
                rsi: 58,
                bb: "+0.9σ",
                whatHappening: "日銀の追加利上げ観測を背景に、銀行の本業である『預金と貸出の利ざや』が拡大しやすい環境が続いています。急激な過熱感はなく、堅実な資金流入が見られます。",
                whyReason: "短期的な買われすぎを示す指標（RSI）は58と適正範囲内にあり、25日平均線より少し上で安定して推移しています。下落リスクが比較的低く、中長期で配当を得ながら保有しやすい状態です。",
                actionGuide: "今すぐ全額を買うのではなく、資金の3割〜5割をまずエントリーし、もし一時的に値下がりした場合は追加の買い増しチャンスと捉えるのが賢明です。"
            },
            {
                name: "楽天日本株4.3倍ブル",
                type: "レバレッジ投信",
                price: 54773,
                change: "+11.90%",
                status: "careful",
                badge: "少額分割買いのみ",
                badgeColor: "bg-sky-50 text-sky-700 border-sky-200",
                rsi: 42,
                bb: "-1.2σ",
                whatHappening: "日経平均の値動きの約4.3倍上下する超ハイリスク・ハイリターン商品です。直近で相場が急変動したため基準価額が大きく揺れ動いています。",
                whyReason: "統計的には売られすぎ水準（下値支持線付近）に近づいているため短期的なリバウンドが期待できますが、レバレッジ特有の『横ばい相場での資産目減り（減価）』リスクが非常に高い局面です。",
                actionGuide: "初心者は原則として手を出さないか、失っても生活に支障のない余裕資金（総投資額の数%程度）に限定してください。長期保有は厳禁で、短期で利益が出たら即座に手仕舞うルールを徹底しましょう。"
            },
            {
                name: "ソニーグループ (6758)",
                type: "個別株",
                price: 4297,
                change: "+1.25%",
                status: "stay",
                badge: "様子見・ホールド",
                badgeColor: "bg-amber-50 text-amber-700 border-amber-200",
                rsi: 58,
                bb: "+1.0σ",
                whatHappening: "ゲーム、音楽、映画などのエンタメ事業と画像センサー需要が好調で、業績の裏付けを伴った安定した値動きを続けています。",
                whyReason: "すでに適正な水準まで買われており、過熱はしていないものの『割安なバーゲンセール』でもありません。焦って今高値掴みをする必要性は低い状態です。",
                actionGuide: "すでに持っている方は利益確定を急がずそのままホールド（保有継続）。新しく買いたい方は、日経平均全体の調整などで少し株価が下がったタイミングを待つのが安全です。"
            },
            {
                name: "トヨタ自動車 (7203)",
                type: "個別株",
                price: 2582,
                change: "+0.78%",
                status: "strong_buy",
                badge: "強い買いシグナル",
                badgeColor: "bg-emerald-100 text-emerald-800 border-emerald-300",
                rsi: 28,
                bb: "-1.8σ",
                whatHappening: "為替の変動や一時的な市場の警戒感から、ここ最近集中的に売りが先行し、株価が統計的な下限ラインまで沈み込んでいます。",
                whyReason: "RSIが『28』まで低下しています。一般にRSIが30を下回ると『統計的に売られすぎ（割安放置）』と判断され、過去のデータ上も反発しやすいゾーンに入っています。",
                actionGuide: "統計的には絶好の押し目（バーゲン）水準です。手元資金の半分程度を投じるなど、積極的なエントリーを検討できるタイミングです。"
            },
            {
                name: "eMAXIS Slim 全世界株式 (オルカン)",
                type: "インデックス投信",
                price: 24150,
                change: "+0.45%",
                status: "stay",
                badge: "積立継続・一括見送り",
                badgeColor: "bg-indigo-50 text-indigo-700 border-indigo-200",
                rsi: 56,
                bb: "+0.6σ",
                whatHappening: "世界中の優良企業に幅広く分散投資されており、長期的な世界経済の成長に沿って右肩上がりの基調を維持しています。",
                whyReason: "世界市場全体が平均的な巡航速度で成長しているため、相場の暴落も暴騰も起きていません。テクニカル指標も極めて中立的です。",
                actionGuide: "毎月の定額積立（つみたてNISA等）をそのまま変更せず淡々と続けてください。いま無理に手持ちの現金を一括投入してスポット購入する必要はありません。"
            },
            {
                name: "eMAXIS Slim 米国株式 (S&P500)",
                type: "インデックス投信",
                price: 31200,
                change: "+0.82%",
                status: "stay",
                badge: "積立継続・利益確定不要",
                badgeColor: "bg-indigo-50 text-indigo-700 border-indigo-200",
                rsi: 61,
                bb: "+1.1σ",
                whatHappening: "米国の大手IT企業群を中心とした力強い業績に支えられ、堅調な上昇トレンドが続いています。",
                whyReason: "やや買われ気味（RSI 61）ではあるものの、過去のバブルピーク（RSI 70以上）には達していません。上昇トレンドの勢いが残っています。",
                actionGuide: "売却して利益を確定する必要は全くありません。積立設定をそのままキープし、長期的な複利効果を最大限に活かしましょう。"
            }
        ];

        let watchlist = [...marketDatabase];
        let pendingAsset = null;

        // 監視リストのレンダリング
        function renderWatchlist() {
            const container = document.getElementById('watchlistContainer');
            document.getElementById('watchlistCount').innerText = `${watchlist.length} 銘柄を監視中`;
            container.innerHTML = '';

            watchlist.forEach((item, index) => {
                const isPos = item.change.startsWith('+');
                const card = document.createElement('div');
                card.className = "soft-card card-press rounded-2xl p-3.5 flex justify-between items-center transition hover:border-emerald-300 cursor-pointer";
                card.onclick = () => openDetailModal(item);
                
                card.innerHTML = `
                    <div class="flex-1 pr-2">
                        <div class="flex items-center gap-1.5 mb-1">
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 border border-slate-200">${item.type}</span>
                            <h3 class="text-xs font-bold text-slate-800 line-clamp-1">${item.name}</h3>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg border ${item.badgeColor}">${item.badge}</span>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-xs font-extrabold text-slate-800">¥${item.price.toLocaleString()}</div>
                        <div class="text-[11px] font-semibold ${isPos ? 'text-emerald-600' : 'text-rose-500'}">${item.change}</div>
                    </div>
                `;
                container.appendChild(card);
            });
            calculateAllocation();
        }

        // 資金配分シミュレーション
        function calculateAllocation() {
            const capital = parseFloat(document.getElementById('capitalInput').value) || 300000;
            const mood = document.getElementById('marketMood').value;
            const container = document.getElementById('allocationDisplay');

            let p1 = 0.35, p2 = 0.40, p3 = 0.25;
            if (mood === 'panic') { p1 = 0.55; p2 = 0.30; p3 = 0.15; }
            if (mood === 'hot') { p1 = 0.15; p2 = 0.35; p3 = 0.50; }

            container.innerHTML = `
                <div>
                    <span class="text-[10px] text-slate-500 block mb-0.5">① 今すぐ買う</span>
                    <strong class="text-xs text-emerald-700 font-extrabold">¥${Math.round(capital * p1).toLocaleString()}</strong>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 block mb-0.5">② 下がったら買う</span>
                    <strong class="text-xs text-sky-700 font-extrabold">¥${Math.round(capital * p2).toLocaleString()}</strong>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 block mb-0.5">③ 予備・守る資金</span>
                    <strong class="text-xs text-slate-700 font-extrabold">¥${Math.round(capital * p3).toLocaleString()}</strong>
                </div>
            `;
        }

        // 銘柄検索サジェスト
        function filterSuggestions() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const box = document.getElementById('suggestionsBox');
            box.innerHTML = '';

            if (!query) {
                box.classList.add('hidden');
                return;
            }

            const matches = marketDatabase.filter(m => m.name.toLowerCase().includes(query) || m.type.toLowerCase().includes(query));
            if (matches.length === 0) {
                box.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center">該当する銘柄が見つかりませんでした</div>`;
                box.classList.remove('hidden');
                return;
            }

            matches.forEach(item => {
                const row = document.createElement('div');
                row.className = "p-2.5 hover:bg-emerald-50 cursor-pointer flex justify-between items-center text-xs transition";
                row.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800">${item.name}</span>
                        <span class="text-[10px] text-slate-400 block">${item.type}</span>
                    </div>
                    <span class="text-[11px] font-bold text-slate-600">¥${item.price.toLocaleString()}</span>
                `;
                row.onclick = () => selectItemForPreview(item);
                box.appendChild(row);
            });
            box.classList.remove('hidden');
        }

        function selectItemForPreview(item) {
            pendingAsset = item;
            document.getElementById('searchInput').value = item.name;
            document.getElementById('suggestionsBox').classList.add('hidden');
            
            const preview = document.getElementById('selectedPreview');
            document.getElementById('previewName').innerText = item.name;
            document.getElementById('previewMeta').innerText = `現在価格: ¥${item.price.toLocaleString()} | 直近騰落率: ${item.change}`;
            preview.classList.remove('hidden');
            
            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = false;
        }

        function addSelectedAsset() {
            if (!pendingAsset) return;
            if (!watchlist.some(w => w.name === pendingAsset.name)) {
                watchlist.unshift(pendingAsset);
            }
            renderWatchlist();
            closeSearchModal();
        }

        // 初心者向けXAI詳細診断モーダルの表示
        function openDetailModal(item) {
            document.getElementById('detailTitle').innerText = item.name;
            const container = document.getElementById('detailContent');

            container.innerHTML = `
                <!-- 判定結果カード -->
                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 p-3.5 rounded-2xl border border-emerald-100 flex items-center justify-between">
                    <div>
                        <span class="text-[10px] text-slate-500 font-medium block">クオンツ総合判定</span>
                        <div class="text-sm font-extrabold text-emerald-800 mt-0.5">${item.badge}</div>
                    </div>
                    <div class="text-right">
                        <span class="text-[10px] text-slate-400 block">現在価格</span>
                        <strong class="text-sm font-bold text-slate-800">¥${item.price.toLocaleString()}</strong>
                    </div>
                </div>

                <!-- 1. いま何が起きているか -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-1">
                    <div class="flex items-center gap-1.5 text-slate-700 font-bold text-xs">
                        <span>🧭</span> いま何が起きているか？
                    </div>
                    <p class="text-[11px] text-slate-600 leading-relaxed font-normal">${item.whatHappening}</p>
                </div>

                <!-- 2. なぜそう推論するのか -->
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 space-y-1">
                    <div class="flex items-center gap-1.5 text-slate-700 font-bold text-xs">
                        <span>🔍</span> なぜそう判断するのか？（推論の根拠）
                    </div>
                    <p class="text-[11px] text-slate-600 leading-relaxed font-normal">${item.whyReason}</p>
                </div>

                <!-- 3. 初心者はどう動くべきか -->
                <div class="bg-emerald-50/60 p-3.5 rounded-2xl border border-emerald-100 space-y-1">
                    <div class="flex items-center gap-1.5 text-emerald-800 font-bold text-xs">
                        <span>🎯</span> 初心者のアクション指針
                    </div>
                    <p class="text-[11px] text-slate-700 leading-relaxed font-medium">${item.actionGuide}</p>
                </div>

                <!-- 統計データの参考値 -->
                <div class="bg-white p-2.5 rounded-xl border border-slate-100 flex justify-around text-center text-[10px] text-slate-400">
                    <div>RSI指標: <strong class="text-slate-700">${item.rsi}</strong> (30以下割安 / 70以上過熱)</div>
                    <div>ボリンジャー: <strong class="text-slate-700">${item.bb}</strong></div>
                </div>
            `;

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function openSearchModal() {
            document.getElementById('searchInput').value = '';
            document.getElementById('selectedPreview').classList.add('hidden');
            document.getElementById('addBtn').disabled = true;
            document.getElementById('searchModal').classList.remove('hidden');
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.add('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // 初期実行
        renderWatchlist();
    </script>
</body>
</html>
